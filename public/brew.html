<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0905">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Game Day">
<title>Game Day Hub · Brew</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#14110c;--bar:#1a160f;--s:#1f1a12;--s2:#2a2418;--ink:#f4efe6;--mut:#a89f8c;--faint:#7b7261;--line:#3a3222;--amber:#f0b54a;--good:#5ee08f;--bad:#ff7b6b}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;font-feature-settings:"tnum" 1;-webkit-font-smoothing:antialiased;padding-bottom:40px}
#hub-bar{position:-webkit-sticky;position:sticky;top:0;flex:none;z-index:1000;height:56px;display:flex;align-items:center;justify-content:center;padding:0 16px;background:var(--bar);border-bottom:1px solid var(--line)}
#hub-bar .sw{display:flex;gap:4px;background:var(--s2);border-radius:999px;padding:4px;width:100%;max-width:360px}
#hub-bar a{flex:1;text-align:center;text-decoration:none;border-radius:999px;padding:8px 12px;font-weight:700;font-size:14px;color:var(--mut)}
#hub-bar a.on{background:var(--amber);color:#14110c}
.wrap{max-width:560px;margin:0 auto;padding:0 18px}
.title{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:18px}
.sub{font-size:12.5px;color:var(--mut);margin:3px 0 14px;line-height:1.5}
.empty{border:1px dashed var(--line);border-radius:14px;padding:18px 14px;text-align:center;color:var(--mut);font-size:13px}
.card{background:var(--s);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.src{font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--amber);font-weight:650}
.ttl{font-size:17px;font-weight:750;letter-spacing:-.01em;margin:3px 0 10px}
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.chip{background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:7px 8px;display:flex;flex-direction:column;gap:1px}
.chip small{font-size:11px;color:var(--mut)}.chip b{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}.chip span{font-size:12px;font-weight:650;font-variant-numeric:tabular-nums}
.up{color:var(--good)}.dn{color:var(--bad)}.fl{color:var(--mut)}
.list{display:flex;flex-direction:column;gap:9px}
.bt{display:flex;flex-direction:column;gap:1px;padding-left:10px;border-left:2px solid var(--line)}
.bt b{font-size:13.5px;font-weight:700}.bt span{font-size:13px;color:var(--mut);line-height:1.45}
.note{font-size:12px;color:var(--faint);margin-top:8px}
/* ===== Neon minimal theme (brown). Same layout as the soccer page. Colours and layout only. ===== */
:root{--acc-rgb:224,166,98;--acc-hi:#F0C58A;--acc-ink:#0c0905;--acc-dim:#6b4e2c;--bg:#0c0905;--bar:transparent;--s:rgba(255,255,255,.045);--s2:rgba(255,255,255,.07);--ink:#F5EFE6;--mut:rgba(245,239,230,.62);--faint:rgba(245,239,230,.42);--line:rgba(255,255,255,.08);--blue:#E0A662;--chip:rgba(255,255,255,.06);--card-top:rgba(255,255,255,.05);--card-bot:rgba(255,255,255,.035);--gold:#FFC247}
html{background:#0c0905}
body{font-family:"DM Sans",Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;background:linear-gradient(180deg,#110d08 0,#050403 100%) fixed}
body:before{content:"";position:fixed;top:-130px;right:-90px;width:340px;height:340px;border-radius:50%;background:rgba(224,166,98,.14);filter:blur(90px);pointer-events:none;z-index:0}
.wrap,.dock{position:relative;z-index:1}.dock{position:-webkit-sticky;position:sticky}
#hub-bar{background:transparent;border:0;height:64px}#hub-bar .sw{background:transparent;gap:6px;justify-content:center;max-width:none;width:auto}
#hub-bar a{flex:none;padding:9px 22px;background:rgba(255,255,255,.08);color:var(--mut);font-weight:500;font-size:13.5px}#hub-bar a.on{background:var(--blue);color:#0c0905;font-weight:600}
.top{padding:10px 20px 4px}
.title{font-weight:400;letter-spacing:0}.title .wd{display:block;font-size:15px;color:var(--mut)}.title .dt2{display:block;font-size:56px;font-weight:300;letter-spacing:-.045em;line-height:1.05}
.sub{font-size:13px;color:var(--mut);margin-top:6px}
.days{gap:4px;margin:22px 0 4px}
.day{background:transparent;border:0;border-radius:22px;padding:10px 0;color:var(--faint);font-size:12px}.day b{font-weight:300;font-size:20px;color:var(--ink)}
.day.on{background:var(--blue);color:rgba(12,9,5,.6)}.day.on b{color:#0c0905;font-weight:500}
.tabs{border-bottom:0;padding:0 20px;margin-top:14px;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{color:var(--faint);font-size:15px;white-space:nowrap;margin-right:6px}.tab.on{color:var(--ink);font-weight:500;border-bottom-color:transparent}
button:focus-visible{outline:2px solid var(--blue)}

:root{--amber:#E0A662;--good:#8fe3a8}
.wrap{padding:0 20px}
.title{margin-top:8px}
.card{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.08);border-radius:28px;padding:18px;margin-bottom:12px}
.src{text-transform:none;letter-spacing:0;font-size:13px;font-weight:400;color:var(--mut)}
.ttl{font-size:21px;font-weight:500;letter-spacing:-.025em;margin:6px 0 14px}
.chip{background:rgba(255,255,255,.06);border:0;border-radius:16px;padding:10px}.chip b{font-size:16px;font-weight:500}
.empty{border-color:rgba(255,255,255,.16);border-radius:24px}
body{padding-bottom:48px}

.bt{display:flex;flex-direction:column;gap:1px;border-left:0;padding-left:0;background:none;border-radius:0}
.list .bt+.bt{border-top:1px solid rgba(255,255,255,.08);padding-top:10px}

.cal{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.08);border-radius:28px;padding:14px 12px 12px;margin:6px 0 14px}
.cal-h{display:flex;align-items:center;justify-content:space-between;padding:0 4px 8px}
.cal-h b{font-size:16px;font-weight:500}
.cal-h button{background:rgba(255,255,255,.08);border:0;color:var(--ink);width:34px;height:34px;border-radius:50%;font-size:16px;cursor:pointer}
.cal-h button:disabled{opacity:.3;cursor:default}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal-g .dow{font-size:11px;color:var(--faint);padding:4px 0}
.cal-g button{position:relative;background:transparent;border:0;border-radius:50%;aspect-ratio:1;color:var(--faint);font:inherit;font-size:14px;cursor:default}
.cal-g button.has{color:var(--ink);cursor:pointer}
.cal-g button.has:after{content:"";position:absolute;left:50%;bottom:5px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--amber)}
.cal-g button.today{box-shadow:inset 0 0 0 1px var(--faint)}
.cal-g button.sel{background:var(--blue);color:#0c0905;font-weight:600}
.cal-g button.sel:after{background:#0c0905}
.cal-g button:focus-visible{outline:2px solid var(--blue)}
</style>
</head>
<body>
<div id="hub-bar"><div class="sw"><a href="/">⚽ Soccer</a><a href="/nhl">🏒 NHL</a><a href="/brew" class="on">☕ Brew</a></div></div>
<div class="wrap">
  <div class="title" id="title"></div>
  <div class="sub" id="sub">Quick read of your Brew Markets and Morning Brew emails.</div>
  <div class="cal" id="cal"></div>
  <div id="view"><div class="empty">Loading…</div></div>
</div>
<script>
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ago = iso => { if (!iso) return ''; const m = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60000)); return m < 1 ? 'just now' : m < 60 ? `${m} min ago` : m < 2880 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} days ago`; };
const chip = m => { const c = Number(m.change), flat = c === 0 || (Math.abs(c) < 0.05 && !m.unit); return `<div class="chip"><small>${esc(m.label)}</small><b>${esc(m.value)}</b><span class="${flat ? 'fl' : c > 0 ? 'up' : 'dn'}">${c > 0 ? '▲' : c < 0 ? '▼' : ''} ${Math.abs(c)}${m.unit ? ' ' + esc(m.unit) : '%'}</span></div>`; };
const card = i => `<div class="card"><div class="src">${esc(i.source || '')} · ${esc(i.date || '')}</div><div class="ttl">${esc(i.title || '')}</div>
  ${(i.markets || []).length ? `<div class="strip">${i.markets.map(chip).join('')}</div>` : ''}
  <div class="list">${(i.takeaways || []).map(t => typeof t === 'string' ? `<div class="bt"><span>${esc(t)}</span></div>` : `<div class="bt"><b>${esc(t.h)}</b><span>${esc(t.t)}</span></div>`).join('')}</div>${i.note ? `<div class="note">${esc(i.note)}</div>` : ''}</div>`;
{ const d = new Date(); const $t = document.getElementById('title'); $t.innerHTML = `<span class="wd">Brew · ${d.toLocaleDateString('en-US',{weekday:'long',timeZone:'America/Chicago'})}</span><span class="dt2">${d.toLocaleDateString('en-US',{month:'short',day:'numeric',timeZone:'America/Chicago'})}</span>`; }
const MN = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const ymd = (y, m, d) => `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
const today = new Date().toLocaleDateString('en-CA', { timeZone: 'America/Chicago' });
let issues = [], byDate = {}, sel = today, vy = 0, vm = 0, minM = 0, maxM = 0;
const mIdx = (y, m) => y * 12 + m;
function drawCal() {
  const first = new Date(Date.UTC(vy, vm, 1)).getUTCDay(), n = new Date(Date.UTC(vy, vm + 1, 0)).getUTCDate();
  let h = ['S','M','T','W','T','F','S'].map(d => `<div class="dow">${d}</div>`).join('') + '<span></span>'.repeat(first);
  for (let d = 1; d <= n; d++) { const k = ymd(vy, vm, d), has = !!byDate[k]; h += `<button data-d="${k}" class="${has ? 'has' : ''}${k === today ? ' today' : ''}${k === sel ? ' sel' : ''}" ${has ? '' : 'tabindex="-1"'} aria-label="${k}${has ? ', has summaries' : ''}">${d}</button>`; }
  document.getElementById('cal').innerHTML = `<div class="cal-h"><button id="pm" aria-label="Previous month" ${mIdx(vy, vm) <= minM ? 'disabled' : ''}>‹</button><b>${MN[vm]} ${vy}</b><button id="nm" aria-label="Next month" ${mIdx(vy, vm) >= maxM ? 'disabled' : ''}>›</button></div><div class="cal-g">${h}</div>`;
}
function drawView() {
  const list = byDate[sel] || [];
  document.getElementById('view').innerHTML = list.length ? list.map(card).join('') : `<div class="empty">No newsletter summaries for ${esc(new Date(sel + 'T12:00:00Z').toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric', timeZone: 'UTC' }))}.</div>`;
}
function draw() { drawCal(); drawView(); }
document.getElementById('cal').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'pm' || b.id === 'nm') { const i = mIdx(vy, vm) + (b.id === 'pm' ? -1 : 1); if (i < minM || i > maxM) return; vy = Math.floor(i / 12); vm = i % 12; drawCal(); return; }
  if (b.dataset.d && byDate[b.dataset.d]) { sel = b.dataset.d; draw(); }
});
(async () => {
  try {
    const r = await fetch('/api/brew'); if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    if (j.updated) document.getElementById('sub').textContent = `Quick read of your Brew Markets and Morning Brew emails. Updated ${ago(j.updated)}.`;
    issues = j.issues || [];
    if (!issues.length) { document.getElementById('cal').remove(); document.getElementById('view').innerHTML = '<div class="empty">No newsletter summaries yet.</div>'; return; }
    for (const i of issues) if (i.date) (byDate[i.date] = byDate[i.date] || []).push(i);
    const dates = Object.keys(byDate).sort();
    if (!byDate[sel]) sel = dates[dates.length - 1]; // today has nothing yet: show the newest day
    const ym = k => [Number(k.slice(0, 4)), Number(k.slice(5, 7)) - 1];
    minM = mIdx(...ym(dates[0])); maxM = Math.max(mIdx(...ym(dates[dates.length - 1])), mIdx(...ym(today)));
    [vy, vm] = ym(sel); draw();
  } catch (e) { document.getElementById('cal').remove(); document.getElementById('view').innerHTML = '<div class="empty">Could not load the summaries. Pull to refresh.</div>'; }
})();
</script>
</body>
</html>
