    const st = c.lean ? (L.hit == null ? '<span class="mbs">Push</span>' : L.hit ? '<span class="mbs hit">Hit ✓</span>' : '<span class="mbs miss">Missed ✗</span>') : `<span class="mbs">${c.kickoff && new Date(c.kickoff) <= Date.now() ? 'In play' : 'Pending'}</span>`;
    return `<div class="mbg"><div class="mbt"><b>${esc(leanName(c, L))}</b>${st}</div><div class="note">${esc(c.away)} at ${esc(c.home)} · ${esc(c.ko || '')}${c.final ? ' · ' + c.final.a + '–' + c.final.h : ''}</div>
      <div class="note"><span class="mbk ${L.k}">${LEAN_KIND[L.k]}</span>${L.p != null ? ` ${L.p}%` : ''} · ${agreeText(L)}</div></div>`;
  }).join('');
}
// bet365 early payout: a winner pick counts as won once that team led by 3 goals at any point (shootout not counted). Beside the
// normal record, never instead of it; only games whose goal order ESPN's game summary gave are counted.
function earlyLine(T) {
  const E = T.ep, pc = (h, n) => (n ? Math.round(100 * h / n) : 0);
  if (!E || !E.n) return `<div class="mbsec">bet365 early payout<small>Winner picks count as won once the team goes 3 goals ahead. Nothing graded with goal times yet.</small></div>`;
  return `<div class="mbsec">bet365 early payout<small>Winner picks, counted as won once the team led by 3 goals at any point (${E.n} with goal times).</small></div><div class="mbh">Normal: <b>${E.plain}</b> of ${E.n} won (${pc(E.plain, E.n)}%) · With early payout: <b>${E.hits}</b> of ${E.n} (${pc(E.hits, E.n)}%)${E.saved ? ` · <b>${E.saved}</b> paid early that did not win` : ''}</div>`;
}
function mbetsView() {
  if (!tally) return `<div class="empty">Loading…</div>`;
  const T = tally.leans || { n: 0, hits: 0, push: 0, byKind: {}, byKey: {}, byBack: {}, base: {}, recent: [] }, pct = (h, n) => n ? Math.round(100 * h / n) : null;
  const kinds = ['best', 'lean', 'split', 'solo'].filter(k => T.byKind[k]), keys = ['H', 'A', 'O', 'U'].filter(k => T.byKey[k]), B = T.base || {};
  const overP = B.overN ? pct(B.over, B.overN) : null, homeP = T.n ? pct(B.home || 0, T.n) : null;
  const chance = { H: homeP, A: homeP == null ? null : 100 - homeP, O: overP, U: overP == null ? null : 100 - overP };
  const expect = x => { if (!x || !x.ks || !x.n) return null; let t = 0, c = 0; for (const [k, q] of Object.entries(x.ks)) if (chance[k] != null) { t += q * chance[k]; c += q; } return c ? t / c : null; };
  const backs = Object.keys(T.byBack).sort((a, b) => { const [ay, aa] = a.split(' of ').map(Number), [by, ba] = b.split(' of ').map(Number); return (ay === aa ? 0 : 1) - (by === ba ? 0 : 1) || ba - aa || by - ay; });
  const head = T.n ? `<div class="mbh"><b>${T.hits}</b> of <b>${T.n}</b> model bets hit (<b>${pct(T.hits, T.n)}%</b>${moe(T.hits, T.n) != null ? ` ± ${moe(T.hits, T.n)}` : ''}). One pick per game, graded when it ends${T.push ? `; ${T.push} push${T.push === 1 ? '' : 'es'} not counted` : ''}.</div>` : `<div class="mbh">No model bets are graded yet. Each game's headline pick is recorded when the game is graded, so the record starts with the next games that finish.</div>`;
  const recent = (T.recent || []).slice(0, 15).map(r => `<div class="mbg"><div class="mbt"><b>${esc(r.key === 'H' ? r.home + ' to win' : r.key === 'A' ? r.away + ' to win' : (r.key === 'O' ? 'Over ' : 'Under ') + r.line)}</b><span class="mbs ${r.hit || r.ep ? 'hit' : 'miss'}">${r.hit ? 'Hit ✓' : r.ep ? 'Paid early ✓' : 'Missed ✗'}</span></div><div class="note">${esc(r.away)} at ${esc(r.home)} · ${r.final.a}–${r.final.h}${r.final.last && r.final.last !== 'REG' ? ' ' + esc(r.final.last) : ''}</div><div class="note"><span class="mbk ${r.k}">${LEAN_KIND[r.k]}</span>${r.p != null ? ` ${r.p}%` : ''}${r.k === 'best' || r.k === 'lean' ? ` · ${r.y === r.a ? 'all ' + r.a + ' agree' : r.y + ' of ' + r.a + ' back it'}` : ''}</div></div>`).join('');
  return `<div class="pad"><div class="note" style="margin:0 0 10px">Every game's headline pick (the side most of v2, v4 and Forebet back: the winner, or Over/Under at that game's DraftKings line) is one fixed bet. It is recorded when the game is graded and scored on the final score, so you can see which kinds of picks are actually strongest. No odds are used. Over/Under needs a real line; a total exactly on the line is a push.</div>${head}
    ${earlyLine(T)}
    <div class="mbsec">Today's model bets<small>${esc(S.date)}. Picks still update until the game starts.</small></div><div class="mbx">${mbetsToday()}</div>
    ${T.n ? `<div class="mbsec">By strength<small>Best pick: all three models agree. Lean: two of three. Split: no majority.</small></div><div class="mbx">${kinds.map(k => mbRow(LEAN_KIND[k], '', T.byKind[k], expect(T.byKind[k]))).join('')}</div>
    <div class="mbsec">By kind of pick<small>Chance = how often it happens in all these games. Edge = the hit rate minus chance.</small></div><div class="mbx">${keys.map(k => mbRow(MB_PLAIN[k], '', T.byKey[k], chance[k])).join('')}</div>
    ${backs.length ? `<div class="mbsec">By how many models agree</div><div class="mbx">${backs.map(k => mbRow(k, 'models back it', T.byBack[k], expect(T.byBack[k]))).join('')}</div>` : ''}
    <div class="mbsec">Recent model bets</div><div class="mbx">${recent}</div>
    <div class="note" style="margin-top:10px"><b>Proven edge</b>: beats chance with the whole ± range above it and 30+ picks. <b>Promising</b>: beats chance but is not certain yet. <b>No edge</b>: at or below chance. <b>Too early</b>: under 5 picks. For strength and agreement rows, chance is what the same mix of bets would score on average. ± is the 95% margin.</div>` : ''}</div>`;
}
function statusView() {
  if (!status) return `<div class="empty">Loading…</div>`;
  const fb = status.forebet;
  return `<div class="pad"><div class="card"><div class="kv"><span>Ratings include games through</span><span>${esc(status.through)}</span></div>
  <div class="kv"><span>2026-27 games in the ratings</span><span>${status.gamesThisSeason}</span></div>
  <div class="kv"><span>Teams rated</span><span>${status.teams}</span></div>
  <div class="kv"><span>Forebet last read</span><span>${fb ? (fb.ok ? `${fb.rows} games, ${fb.saved} saved` : 'failed') : 'not yet'}</span></div>
  ${fb && fb.msg ? `<div class="note">${esc(fb.msg)}</div>` : ''}
  <div class="note">Backtest on 2,428 games from 3 seasons: winner picks hit about 55% (v2) and 56% (v4) against 54% for always picking the home team. Over/Under at 5.5 only beat the 55% Over rate when the model was confident. Goalie ratings did not help, so they are not used yet.</div>
  <div class="note" style="${nbAge() == null || nbAge() >= 7 ? 'color:#e0a040' : ''}">${nbLine()}</div>
  ${pushBox()}
  <button type="button" class="btn" id="xp" style="margin-top:12px">Export hockey data</button><div class="note">Downloads every saved hockey day (cards with v2, v4 and Forebet picks and results) plus the totals, as one file.</div></div></div>`;
}
function renderDays() {
  { const d = new Date(S.date + 'T12:00:00Z'); $('#title').innerHTML = `<span class="wd">NHL · ${d.toLocaleDateString('en-US',{weekday:'long',timeZone:'UTC'})}</span><span class="dt2">${d.toLocaleDateString('en-US',{month:'short',day:'numeric',timeZone:'UTC'})}</span>`; }
  const t = fmt(new Date()), list = [[addDays(t, -1), 'Yesterday'], [t, 'Today'], [addDays(t, 1), 'Tomorrow']];
  $('#days').innerHTML = list.map(([d, l]) => `<button type="button" class="day${d === S.date ? ' on' : ''}" data-d="${d}">${l}<b>${+d.slice(8)}</b></button>`).join('');
  $('#tabs').innerHTML = [['board', 'Board'], ['top', 'Top'], ['results', 'Results'], ['moves', 'Movement'], ['mbets', 'Model bets'], ['status', 'Status']].map(([k, l]) => `<button type="button" class="tab${S.tab === k ? ' on' : ''}" data-tab="${k}">${l}</button>`).join('');
}
function updDots() { const g = document.getElementById('bgrid'); if (!g) return; const t = g.firstElementChild, step = t ? t.getBoundingClientRect().width + 8 : 1, i = Math.round(g.scrollLeft / step / 2 * 2);
  document.querySelectorAll('.bdots i').forEach((d, k) => d.classList.toggle('on', k === Math.min(i, document.querySelectorAll('.bdots i').length - 1))); }
document.addEventListener('scroll', e => { if (e.target && e.target.id === 'bgrid') updDots(); }, true);
function render() { renderDays(); $('#view').innerHTML = S.tab === 'board' ? board() : S.tab === 'top' ? topView() : S.tab === 'results' ? results() : S.tab === 'mbets' ? mbetsView() : S.tab === 'moves' ? movesView() : statusView(); updDots(); }
async function load() {
  try { day = await api('/api/nhl/day?date=' + S.date); } catch (e) { day = { cards: [] }; $('#st').textContent = e.message; }
  render();
  loadTop().then(() => { if (S.tab === 'top') render(); });
  try { tally = await api('/api/nhl/tally'); status = await api('/api/nhl/status'); render(); } catch (e) { /* shown as Loading */ }
}
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-d],[data-tab],[data-sc],#run,#xp,[data-push],[data-setln],[data-saveln],[data-clrln],[data-tf],[data-sel],[data-mvf],[data-getclose]'); if (!t) return;
  if (t.dataset.getclose) {
    if (t.disabled) return; const t0 = t.textContent; t.disabled = true; t.textContent = 'Reading the price…';
    try { const r = await (await fetch('/api/nhl/close', { method: 'POST', body: JSON.stringify({ date: S.date, id: t.dataset.getclose }) })).json(); if (r.error) throw new Error(r.error); await load(); }
    catch (er) { t.disabled = false; t.textContent = er.message.length > 70 ? er.message.slice(0, 67) + '…' : er.message; t.title = er.message; setTimeout(() => { if (t.isConnected) t.textContent = t0; }, 6000); }
    return;
  }
  if (t.dataset.mvf) { S.mvf = t.dataset.mvf; return render(); }
  if (t.dataset.push) return pushAct(t.dataset.push);
  if (t.dataset.sel) { // tap a game: its card opens below and the page scrolls to it; tap it again to close and go back where you were
    const sc = document.getElementById('bgrid'), x = sc ? sc.scrollLeft : 0, closing = S.sel === t.dataset.sel;
    if (closing) { S.sel = null; S.ln = null; } else { if (!S.sel) S.back = window.scrollY; S.sel = t.dataset.sel; S.ln = null; }
    render(); const n = document.getElementById('bgrid'); if (n) n.scrollLeft = x;
    requestAnimationFrame(() => { if (closing) { window.scrollTo({ top: S.back || 0, behavior: 'smooth' }); S.back = null; } else { const d = document.getElementById('dt'); if (d) d.scrollIntoView({ behavior: 'smooth', block: 'start' }); } });
    return; }
  if (t.dataset.tf) { S.tf = t.dataset.tf; return render(); }
  if (t.dataset.setln !== undefined) { S.ln = t.dataset.setln || null; return render(); }
  if (t.dataset.saveln || t.dataset.clrln) {
    const id = t.dataset.saveln || t.dataset.clrln, v = t.dataset.clrln ? null : document.getElementById('ln-' + id).value;
    t.disabled = true;
    try { const r = await (await fetch('/api/nhl/line', { method: 'POST', body: JSON.stringify({ date: S.date, id, line: v }) })).json(); if (r.error) throw new Error(r.error); S.ln = null; $('#st').textContent = v == null ? 'Back to the ESPN line.' : 'Line saved: the Over/Under ratings now use ' + v + '.'; await load(); }
    catch (er) { $('#st').textContent = er.message; t.disabled = false; }
    return;
  }
  if (t.dataset.d) { S.date = t.dataset.d; await load(); }
  else if (t.dataset.tab) { S.tab = t.dataset.tab; if (S.tab === 'status') pushCheck(); render(); }
  else if (t.dataset.sc) { S.scope = t.dataset.sc; render(); }
  else if (t.id === 'xp') { // the server sends the file itself, which also works on phones that block script downloads
    $('#st').textContent = 'Preparing the hockey export… the file should download in a moment.';
    try { localStorage.setItem('hubBackupNhl', new Date().toISOString()); } catch (e) { /* ignore */ }
    if (S.tab === 'status') render();
    window.location.href = '/api/nhl/export';
  }
  else if (t.id === 'run') {
    t.disabled = true; $('#st').textContent = 'Updating…';
    try { const r = await (await fetch('/api/nhl/run', { method: 'POST' })).json();
      $('#st').textContent = r.error ? r.error : `${r.created || 0} new, ${r.graded || 0} graded${r.priced ? `, ${r.priced} price${r.priced === 1 ? '' : 's'} read` : ''}${r.goalies ? `, ${r.goalies} goalie update${r.goalies === 1 ? '' : 's'}` : ''}${r.closed ? `, ${r.closed} closing price${r.closed === 1 ? '' : 's'} from ESPN` : ''}${r.forebet ? ', Forebet ' + (r.forebet.error || r.forebet.note || r.forebet.saved + ' saved') : ''}`;
      await load(); } catch (err) { $('#st').textContent = err.message; }
    t.disabled = false;
  }
});
load();
try { if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js'); } catch (e) { /* installing is optional */ }
</script>
