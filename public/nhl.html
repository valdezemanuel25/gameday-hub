<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f17">
<title>Game Day Hub · NHL</title>
<style>
:root{--bg:#0b0f17;--bar:#0f141c;--s:#141b27;--s2:#1b2433;--ink:#eef2f8;--mut:#9aa6b8;--faint:#6c7a90;--line:#2a3546;--blue:#4c8dff;--chip:#1f2a3b;--good:#5ee08f;--bad:#ff7b6b;--amber:#f0c35a}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;font-feature-settings:"tnum" 1;-webkit-font-smoothing:antialiased;padding-top:56px;padding-bottom:100px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#hub-bar{position:fixed;top:0;left:0;right:0;z-index:1000;height:56px;display:flex;align-items:center;justify-content:center;padding:0 16px;background:var(--bar);border-bottom:1px solid var(--line)}
#hub-bar .sw{display:flex;gap:4px;background:var(--s2);border-radius:999px;padding:4px;width:100%;max-width:360px}
#hub-bar a{flex:1;text-align:center;text-decoration:none;border-radius:999px;padding:8px 12px;font-weight:700;font-size:14px;color:var(--mut)}
#hub-bar a.on{background:var(--blue);color:#fff}
.wrap{max-width:520px;margin:0 auto}
.top{padding:20px 18px 4px}
.title{font-size:26px;font-weight:700;letter-spacing:-.02em}.title span{color:var(--blue)}
.sub{font-size:13px;color:var(--mut);margin-top:2px;line-height:1.45}
.days{display:flex;gap:8px;margin:16px 0 2px}
.day{flex:1;text-align:center;padding:8px 0 7px;border-radius:12px;background:var(--s);border:1px solid var(--line);font-size:12px;color:var(--mut)}
.day b{display:block;font-size:17px;color:var(--ink);font-weight:650;margin:1px 0}
.day.on{background:var(--blue);border-color:var(--blue);color:#dbe8ff}.day.on b{color:#fff}
.tabs{display:flex;gap:6px;padding:0 18px;margin-top:10px;border-bottom:1px solid var(--line)}
.tab{padding:9px 6px;font-size:13.5px;color:var(--mut);margin-right:10px;border-bottom:2px solid transparent}
.tab.on{color:var(--ink);border-bottom-color:var(--blue);font-weight:600}
.pad{padding:14px 18px 0}
.card{background:var(--s);border:1px solid var(--line);border-radius:14px;padding:13px 13px 11px;margin-bottom:10px}
.hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.hd h3{font-size:18px;font-weight:700;letter-spacing:-.01em}
.hd span{font-size:12.5px;color:var(--mut)}
.g{display:grid;grid-template-columns:66px minmax(0,1fr) minmax(0,1fr);gap:6px;align-items:center}
.g.h{margin:10px 0 4px;font-size:11px;color:var(--faint)}
.g.r{padding:5px 0;border-top:1px solid var(--line)}
.g .n{font-size:12px;color:var(--mut);font-weight:600}
.p{background:var(--chip);border-radius:8px;padding:6px 8px;font-size:13px;color:var(--mut);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p b{font-size:14.5px;color:var(--ink);font-weight:650}
.p.hi{background:rgba(76,141,255,.2);box-shadow:inset 0 0 0 1px rgba(76,141,255,.55)}
.y{color:var(--good);font-weight:700}.x{color:var(--bad);font-weight:700}
.note{font-size:11.5px;color:var(--faint);margin-top:7px;line-height:1.4}
.rail{position:relative;margin:14px 18px 0;padding-left:64px}
.rail:before{content:"";position:absolute;left:52px;top:0;bottom:0;width:2px;background:var(--line);border-radius:2px}
.slot{position:relative;margin-bottom:12px}
.slot .t{position:absolute;left:-64px;top:2px;width:44px;text-align:right;font-size:12px;font-weight:600;color:var(--mut)}
.slot .t small{display:block;font-weight:500;color:var(--faint);font-size:10.5px}
.slot:before{content:"";position:absolute;left:-16px;top:7px;width:9px;height:9px;border-radius:50%;background:var(--bg);border:2px solid #3b5688}
.slot.done:before{background:#3b5688}
.now{position:relative;margin:2px 0 14px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--blue);font-weight:600}
.now:before{content:"";position:absolute;left:-17px;top:50%;width:11px;height:11px;margin-top:-5px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 4px rgba(76,141,255,.2)}
.now:after{content:"";flex:1;height:1px;background:rgba(76,141,255,.4)}
.rail .card{padding:11px 10px 9px;margin-bottom:8px}
.rail .g{grid-template-columns:62px minmax(0,1fr) minmax(0,1.15fr);gap:5px}
.rail .g .n{font-size:11.5px;white-space:nowrap}.rail .p{padding:6px 6px;font-size:12px}.rail .p b{font-size:13px}
.rail .hd h3{font-size:16px}
.empty{padding:26px 18px;text-align:center;color:var(--mut);font-size:13.5px;line-height:1.5}
.seg{display:flex;gap:6px;padding:12px 18px 0}
.seg button{font-size:12.5px;padding:7px 12px;border-radius:99px;border:1px solid var(--line);color:var(--mut)}
.seg button.on{background:var(--blue);border-color:var(--blue);color:#fff}
table{width:calc(100% - 36px);margin:12px 18px 0;border-collapse:collapse;background:var(--s);border:1px solid var(--line);border-radius:14px;overflow:hidden;font-variant-numeric:tabular-nums}
th,td{padding:11px 10px;text-align:left;border-bottom:1px solid var(--line);font-size:14px}
tr:last-child td{border-bottom:0}
th{font-size:11px;color:var(--mut);font-weight:600}
td small{display:block;color:var(--faint);font-size:11px;margin-top:1px}
td.best{color:var(--blue);font-weight:700}
.nt{margin:10px 18px 0;font-size:11.5px;color:var(--faint);line-height:1.5}
h4{margin:20px 18px 6px;font-size:14px}
.rg{display:grid;grid-template-columns:minmax(0,1.15fr) 52px minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);gap:4px;padding:9px 12px;border-top:1px solid var(--line);font-size:11.5px;align-items:start;color:var(--mut)}
.rg b{color:var(--ink);font-weight:600;font-size:12.5px}
.rl{margin:0 18px;border:1px solid var(--line);border-radius:14px;background:var(--s);overflow:hidden}
.rl .rg:first-child{border-top:0;color:var(--faint)}
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--bar);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.dock .in{max-width:520px;margin:0 auto;display:flex;gap:10px;align-items:center}
.btn{flex:none;padding:11px 16px;border-radius:12px;background:var(--blue);color:#fff;font-weight:650;font-size:14px}
.btn[disabled]{opacity:.55}
#st{flex:1;min-width:0;font-size:12px;color:var(--mut);line-height:1.35}
.kv{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:13px}.kv span:first-child{color:var(--mut)}

.rail .card{padding:12px 11px 10px;margin-bottom:10px;position:relative;overflow:hidden;background:linear-gradient(180deg,#172033 0%,#131a27 100%)}
.card.all{border-color:rgba(76,141,255,.7);box-shadow:0 0 0 1px rgba(76,141,255,.45),0 0 18px rgba(76,141,255,.22)}
.mu{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:6px}
.tm{display:flex;align-items:center;gap:8px;min-width:0}.tm.r{justify-content:flex-end;text-align:right}
.tm b{display:block;font-size:19px;font-weight:750;letter-spacing:-.01em;line-height:1.05}
.tm small{display:block;font-size:11px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:92px}
.cr{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:11.5px;font-weight:800;letter-spacing:.02em;color:#fff;background:radial-gradient(circle at 30% 25%,color-mix(in srgb,var(--tc) 100%,#fff 18%),color-mix(in srgb,var(--tc) 70%,#000));box-shadow:0 0 0 2px var(--s),0 0 0 3px color-mix(in srgb,var(--tc) 55%,transparent)}
.mid{text-align:center;font-size:12px;color:var(--faint);font-weight:600;min-width:34px}
.mid.sc{font-size:22px;color:var(--ink);font-weight:750;letter-spacing:-.02em;line-height:1}.mid.sc small{display:block;font-size:10.5px;color:var(--blue);font-weight:700;margin-top:3px;letter-spacing:.04em}
.sp{margin:11px 0 2px}
.sp .nums{display:flex;justify-content:space-between;font-size:12px;color:var(--faint);margin-bottom:4px}.sp .nums b{font-size:15px;color:var(--ink);font-weight:700}.sp .nums .dim b{color:var(--faint);font-weight:600}
.sp .bar{display:flex;gap:3px;height:8px}.sp .bar i{display:block;border-radius:99px;background:var(--c);opacity:.38}.sp .bar i.fav{opacity:1;box-shadow:0 0 10px color-mix(in srgb,var(--c) 55%,transparent)}
.ag{display:inline-flex;align-items:center;gap:6px;margin:10px 0 8px;font-size:11.5px;font-weight:650;padding:4px 9px;border-radius:99px;background:rgba(240,195,90,.12);color:var(--amber)}
.ag.y{background:rgba(76,141,255,.16);color:#9ec1ff}.ag:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.ml{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.mt{background:var(--chip);border-radius:10px;padding:7px 8px 8px;min-width:0}
.mt .lb{font-size:10.5px;color:var(--faint);font-weight:650;margin-bottom:5px;letter-spacing:.02em}
.mt .w{font-size:12px;color:var(--mut);white-space:nowrap}.mt .w b{font-size:15px;color:var(--ink);font-weight:750}
.mt.hi{background:rgba(76,141,255,.16);box-shadow:inset 0 0 0 1px rgba(76,141,255,.5)}
.mt .cf{height:3px;border-radius:9px;background:rgba(255,255,255,.08);margin:5px 0 6px;overflow:hidden}.mt .cf i{display:block;height:100%;background:var(--blue);border-radius:9px}
.mt .o{font-size:11.5px;color:var(--mut);white-space:nowrap;border-top:1px solid rgba(255,255,255,.07);padding-top:5px}.mt .o b{color:var(--ink);font-weight:650;font-size:12.5px}.mt .o.hi b{color:#9ec1ff}
.mt .sc2{font-size:12.5px;color:var(--ink);font-weight:700;white-space:nowrap}
.mt.none{opacity:.55}
.xh{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;font-size:10.5px;color:var(--faint)}
.xh .cfx{font-size:11px;font-weight:750;padding:3px 10px;border-radius:99px;border:1px solid var(--line);color:var(--mut)}
.xh .cfx.s{background:rgba(56,182,255,.14);border-color:#38b6ff;color:#38b6ff;box-shadow:0 0 10px rgba(56,182,255,.55),inset 0 0 6px rgba(56,182,255,.2);text-shadow:0 0 6px rgba(56,182,255,.6)}
.xh .cfx.sp{background:rgba(255,230,0,.12);border-color:#ffe600;color:#ffe600;box-shadow:0 0 10px rgba(255,230,0,.5),inset 0 0 6px rgba(255,230,0,.18);text-shadow:0 0 6px rgba(255,230,0,.55)}
.cr.win{box-shadow:0 0 0 2px var(--s),0 0 0 4px #38b6ff,0 0 14px rgba(56,182,255,.7)}
.ag.gl{background:rgba(56,182,255,.14);color:#8fd4ff}
.mt .o .sc3{color:var(--faint);font-size:11px;margin-left:3px}
.sp+.ml{margin-top:11px}</style>
</head>
<body>
<div id="hub-bar"><div class="sw"><a href="/">⚽ Soccer</a><a href="/nhl" class="on">🏒 NHL</a></div></div>
<div class="wrap">
  <div class="top">
    <div class="title">NHL <span>Model</span></div>
    <div class="sub">Winner and Over/Under 5.5 only. Overtime and shootout wins count. Times are Central.</div>
    <div class="days" id="days"></div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div id="view"></div>
</div>
<div class="dock"><div class="in"><div id="st"></div><button type="button" class="btn" id="run">Update NHL now</button></div></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const TZ = 'America/Chicago';
const fmt = d => new Intl.DateTimeFormat('en-CA', { timeZone: TZ }).format(d);
const addDays = (d, n) => new Date(new Date(d + 'T12:00:00Z').getTime() + n * 86400000).toISOString().slice(0, 10);
const S = { date: fmt(new Date()), tab: 'board', scope: 'same' };
let day = { cards: [] }, tally = null, status = null;
const api = async p => { const r = await fetch(p); const t = await r.text(); try { return JSON.parse(t); } catch (e) { throw new Error('Server replied ' + r.status); } };
const pct = (h, n) => n ? Math.round(100 * h / n) : null;
const mark = v => v == null ? '' : v ? ' <span class="y">✓</span>' : ' <span class="x">✗</span>';

function pickWin(m, c) { const h = m.w >= 50; return { team: h ? c.hAbbr : c.aAbbr, p: h ? m.w : 100 - m.w, strong: Math.abs(m.w - 50) >= 8 }; }
function pickOu(m) { const o = m.o >= 50; return { side: o ? 'Over' : 'Under', p: o ? m.o : 100 - m.o, strong: Math.abs(m.o - 50) >= 7 }; }
function modelRow(label, m, c, g) {
  if (!m) return `<div class="g r"><div class="n">${label}</div><div class="p">No pick</div><div class="p">No pick</div></div>`;
  const w = pickWin(m, c), o = pickOu(m);
  return `<div class="g r"><div class="n">${label}</div><div class="p${w.strong ? ' hi' : ''}"><b>${esc(w.team)} ${w.p}%</b>${mark(g && g.win)}</div><div class="p${o.strong ? ' hi' : ''}"><b>${o.side} ${o.p}%</b>${mark(g && g.ou)}</div></div>`;
}
function fbRow(c, g) {
  const f = c.fb;
  if (!f) return `<div class="g r"><div class="n">Forebet</div><div class="p">Not read yet</div><div class="p">Not read yet</div></div>`;
  const w = f.pick ? `<b>${esc(f.pick === 'H' ? c.hAbbr : c.aAbbr)}${f.p ? ' ' + (f.pick === 'H' ? f.p[0] : f.p[1]) + '%' : ''}</b>${mark(g && g.win)}` : 'No pick';
  const sc = f.score ? `<b>${esc(c.aAbbr)} ${f.score.a} – ${f.score.h} ${esc(c.hAbbr)}</b>` : 'No score';
  return `<div class="g r"><div class="n">Forebet</div><div class="p${f.pick ? ' hi' : ''}">${w}</div><div class="p">${sc}</div></div>`;
}
const LINE = 5.5;
const TC={ANA:'#F47A38',BOS:'#FFB81C',BUF:'#3f7be0',CGY:'#D2001C',CAR:'#E0202e',CHI:'#E0283f',COL:'#9a3f66',CBJ:'#2f64b8',DAL:'#1c9a6a',DET:'#E0283f',EDM:'#FF6a1f',FLA:'#D8203e',LAK:'#8f979a',MIN:'#2f8a64',MTL:'#C0283a',NSH:'#FFB81C',NJD:'#E0283f',NYI:'#2f78c8',NYR:'#3469d8',OTT:'#D03045',PHI:'#F76a2b',PIT:'#E8AE1c',SJS:'#1a8f98',SEA:'#6fc3c9',STL:'#3a6bd0',TBL:'#3a6bc9',TOR:'#3a68c4',UTA:'#6CACE4',VAN:'#1c9a58',VGK:'#B4975A',WSH:'#D8203e',WPG:'#3f67aa'};
const tcol = a => TC[a] || '#4c8dff';
const crest = (a, win) => `<i class="cr${win ? ' win' : ''}" style="--tc:${tcol(a)}">${esc(a)}</i>`;
function sideOf(m, c, kind) { return kind === 'fb' ? m.pick : (m.w >= 50 ? 'H' : 'A'); }
function tile(label, m, c, g, kind) {
  if (!m) return `<div class="mt none"><div class="lb">${label}</div><div class="w">${kind === 'fb' ? 'Not read yet' : 'No pick'}</div></div>`;
  if (kind === 'fb') {
    const side = m.pick, p = m.p && side ? (side === 'H' ? m.p[0] : m.p[1]) : null;
    return `<div class="mt${side ? ' hi' : ''}"><div class="lb">${label}</div><div class="w"><b>${side ? esc(side === 'H' ? c.hAbbr : c.aAbbr) : '–'}${p ? ' ' + p + '%' : ''}</b>${mark(g && g.win)}</div>
      <div class="cf"><i style="width:${p ? Math.max(0, (p - 50) * 2) : 0}%"></i></div>
      <div class="o">${m.score ? (() => { const tot = m.score.a + m.score.h, ov = tot > LINE; return `<b>${ov ? 'Over' : 'Under'}</b><span class="sc3">${m.score.a}–${m.score.h}</span>${mark(g && g.ou)}`; })() : 'No score'}</div></div>`;
  }
  const w = pickWin(m, c), o = pickOu(m);
  return `<div class="mt${w.strong ? ' hi' : ''}"><div class="lb">${label}</div><div class="w"><b>${esc(w.team)} ${w.p}%</b>${mark(g && g.win)}</div>
    <div class="cf"><i style="width:${Math.max(0, (w.p - 50) * 2)}%"></i></div>
    <div class="o${o.strong ? ' hi' : ''}"><b>${o.side} ${o.p}%</b>${mark(g && g.ou)}</div></div>`;
}
function sidesOf(c) { return [c.v2 && sideOf(c.v2, c), c.v4 && sideOf(c.v4, c), c.fb && c.fb.pick].filter(Boolean); }
function consensus(c) { const p = sidesOf(c); return { n: p.length, same: p.length >= 3 && p.every(x => x === p[0]), side: p[0], split: p.length >= 2 && !p.every(x => x === p[0]) }; }
function goalsPill(c) {
  const vals = [c.v2 ? c.v2.o >= 50 : null, c.v4 ? c.v4.o >= 50 : null, c.fb && c.fb.score ? (c.fb.score.a + c.fb.score.h) > LINE : null].filter(x => x !== null);
  if (vals.length < 3) return '';
  return vals.every(Boolean) ? '<div class="ag gl">All say Over 5.5</div>' : vals.every(x => !x) ? '<div class="ag gl">All say Under 5.5</div>' : '';
}
function card(c) {
  const g = c.grade || {}, f = c.final, m0 = c.v2 || c.v4;
  const hp = m0 ? m0.w : null, ap = hp == null ? null : 100 - hp;
  const hf = hp != null && hp >= 50;
  const mid = f ? `<div class="mid sc">${f.a}–${f.h}${f.last !== 'REG' ? `<small>${esc(f.last)}</small>` : '<small>FINAL</small>'}</div>` : `<div class="mid">@</div>`;
  const split = hp == null ? '' : `<div class="sp"><div class="nums"><span class="${hf ? 'dim' : ''}"><b>${ap}%</b> ${esc(c.aAbbr)}</span><span class="${hf ? '' : 'dim'}">${esc(c.hAbbr)} <b>${hp}%</b></span></div>
    <div class="bar"><i class="${hf ? '' : 'fav'}" style="flex:${ap};--c:${tcol(c.aAbbr)}"></i><i class="${hf ? 'fav' : ''}" style="flex:${hp};--c:${tcol(c.hAbbr)}"></i></div></div>`;
  const all = c.v2 && c.v4 && c.fb, cs = consensus(c);
  const lab = cs.same ? '<span class="cfx s">Consensus</span>' : cs.split ? '<span class="cfx sp">Split</span>' : '';
  return `<div class="card${all ? ' all' : ''}"><div class="xh"><span>NHL</span>${lab}</div><div class="mu"><div class="tm">${crest(c.aAbbr, cs.same && cs.side === 'A')}<div><b>${esc(c.aAbbr)}</b><small>${esc(c.away)}</small></div></div>${mid}<div class="tm r"><div><b>${esc(c.hAbbr)}</b><small>${esc(c.home)}</small></div>${crest(c.hAbbr, cs.same && cs.side === 'H')}</div></div>
  ${split}${goalsPill(c)}
  <div class="ml">${tile('v2', c.v2, c, g.v2)}${tile('v4 shadow', c.v4, c, g.v4)}${tile('Forebet', c.fb, c, g.fb, 'fb')}</div>
  <div class="note">${f ? `Total ${f.total} · graded at 5.5` : c.skipped ? esc(c.skipped) : 'Top row: winner pick. Bottom row: Over/Under 5.5 (Forebet: predicted score). Blue marks a confident pick.'}</div></div>`;
}
function board() {
  const list = day.cards.slice().sort((a, b) => a.kickoff.localeCompare(b.kickoff));
  if (!list.length) return `<div class="empty">No NHL games saved for this day yet.<br>The Hub checks the schedule in the background, or press Update NHL now.</div>`;
  const slots = new Map();
  for (const c of list) { if (!slots.has(c.kickoff)) slots.set(c.kickoff, []); slots.get(c.kickoff).push(c); }
  const isToday = S.date === fmt(new Date()), now = Date.now(), ct = new Intl.DateTimeFormat('en-US', { timeZone: TZ, hour: 'numeric', minute: '2-digit' }).format(new Date());
  let nowDone = !isToday, html = '';
  for (const [iso, cs] of slots) {
    const t = new Date(iso).getTime(), done = cs.every(c => c.final);
    if (!nowDone && t > now) { nowDone = true; if (html) html += `<div class="now">Now, ${esc(ct)}</div>`; }
    const [hm, ap] = String(cs[0].ko).split(' ');
    html += `<div class="slot${done ? ' done' : ''}"><div class="t">${esc(hm)}<small>${esc(ap || '')}</small></div>${cs.map(card).join('')}</div>`;
  }
  return `<div class="rail">${html}</div>`;
}
function cell(m, key, other) {
  const v = pct(m.hit, m.n);
  return v == null ? '<td>–</td>' : `<td${other}>${v}%<small>${m.hit}/${m.n}</small></td>`;
}
function bestOf(models, key) {
  const v = ['v2', 'v4', 'fb'].map(k => { const m = models[k]; return m.n ? m.hit / m.n : -1; }), mx = Math.max(...v);
  return v.map(x => x === mx && mx >= 0 && v.filter(y => y === mx).length < v.filter(y => y >= 0).length ? ' class="best"' : '');
}
function results() {
  if (!tally) return `<div class="empty">Loading…</div>`;
  const B = tally[S.scope];
  const seg = `<div class="seg"><button data-sc="same" class="${S.scope === 'same' ? 'on' : ''}">Same games</button><button data-sc="all" class="${S.scope === 'all' ? 'on' : ''}">All games</button></div>`;
  if (!tally.graded) return seg + `<div class="empty">No graded NHL games yet. Results appear here once finished games are graded.</div>`;
  const bw = bestOf(B.win, 'win'), bo = bestOf(B.ou, 'ou');
  const bb = B.brier.n ? (B.brier.v4 < B.brier.v2 ? [ '', ' class="best"', '' ] : B.brier.v2 < B.brier.v4 ? [' class="best"', '', ''] : ['', '', '']) : ['', '', ''];
  return `${seg}<table><tr><th></th><th>v2</th><th>v4 shadow</th><th>Forebet</th></tr>
  <tr><td>Winner</td>${['v2', 'v4', 'fb'].map((k, i) => cell(B.win[k], 'win', bw[i])).join('')}</tr>
  <tr><td>Over/Under 5.5</td>${['v2', 'v4', 'fb'].map((k, i) => cell(B.ou[k], 'ou', bo[i])).join('')}</tr>
  <tr><td>Brier (winner)</td><td${bb[0]}>${B.brier.v2 ?? '–'}</td><td${bb[1]}>${B.brier.v4 ?? '–'}</td><td>–</td></tr></table>
  <div class="nt">${S.scope === 'same' ? 'Only games all three models picked.' : 'Every graded game, each model on its own games.'} Blue marks the best in a row. Forebet's Over/Under is taken from its predicted score: a total of 6 or more counts as Over 5.5. Market odds are never used.</div>
  <h4>Recent games</h4><div class="rl"><div class="rg"><span>Game</span><span>Score</span><span>v2</span><span>v4</span><span>Forebet</span></div>${tally.recent.map(r => {
    const f = r.final, gr = r.grade, one = (m, g, c) => m ? `${esc(m.w >= 50 ? c.h : c.a)}${mark(g && g.win)}<br>${m.o >= 50 ? 'Over' : 'Under'}${mark(g && g.ou)}` : '–';
    const c = { h: r.hAbbr, a: r.aAbbr };
    const fb = r.fb ? `${r.fb.pick ? esc(r.fb.pick === 'H' ? r.hAbbr : r.aAbbr) + mark(gr.fb && gr.fb.win) : '–'}<br>${r.fb.score ? r.fb.score.a + '–' + r.fb.score.h + ' ' + (r.fb.score.a + r.fb.score.h > 5.5 ? 'Over' : 'Under') + mark(gr.fb && gr.fb.ou) : '–'}` : '–';
    return `<div class="rg"><b>${esc(r.aAbbr)} @ ${esc(r.hAbbr)}</b><span>${f.a}–${f.h}${f.last !== 'REG' ? ' ' + f.last : ''}</span><span>${one(r.v2, gr.v2, c)}</span><span>${one(r.v4, gr.v4, c)}</span><span>${fb}</span></div>`;
  }).join('')}</div>`;
}
function statusView() {
  if (!status) return `<div class="empty">Loading…</div>`;
  const fb = status.forebet;
  return `<div class="pad"><div class="card"><div class="kv"><span>Ratings include games through</span><span>${esc(status.through)}</span></div>
  <div class="kv"><span>2026-27 games in the ratings</span><span>${status.gamesThisSeason}</span></div>
  <div class="kv"><span>Teams rated</span><span>${status.teams}</span></div>
  <div class="kv"><span>Forebet last read</span><span>${fb ? (fb.ok ? `${fb.rows} games, ${fb.saved} saved` : 'failed') : 'not yet'}</span></div>
  ${fb && fb.msg ? `<div class="note">${esc(fb.msg)}</div>` : ''}
  <div class="note">Backtest on 2,428 games from 3 seasons: winner picks hit about 55% (v2) and 56% (v4) against 54% for always picking the home team. Over/Under 5.5 only beats the 55% Over rate when the model is confident. Goalie ratings did not help, so they are not used yet.</div></div></div>`;
}
function renderDays() {
  const t = fmt(new Date()), list = [[addDays(t, -1), 'Yesterday'], [t, 'Today'], [addDays(t, 1), 'Tomorrow']];
  $('#days').innerHTML = list.map(([d, l]) => `<button type="button" class="day${d === S.date ? ' on' : ''}" data-d="${d}">${l}<b>${+d.slice(8)}</b></button>`).join('');
  $('#tabs').innerHTML = [['board', 'Board'], ['results', 'Results'], ['status', 'Status']].map(([k, l]) => `<button type="button" class="tab${S.tab === k ? ' on' : ''}" data-tab="${k}">${l}</button>`).join('');
}
function render() { renderDays(); $('#view').innerHTML = S.tab === 'board' ? board() : S.tab === 'results' ? results() : statusView(); }
async function load() {
  try { day = await api('/api/nhl/day?date=' + S.date); } catch (e) { day = { cards: [] }; $('#st').textContent = e.message; }
  render();
  try { tally = await api('/api/nhl/tally'); status = await api('/api/nhl/status'); render(); } catch (e) { /* shown as Loading */ }
}
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-d],[data-tab],[data-sc],#run'); if (!t) return;
  if (t.dataset.d) { S.date = t.dataset.d; await load(); }
  else if (t.dataset.tab) { S.tab = t.dataset.tab; render(); }
  else if (t.dataset.sc) { S.scope = t.dataset.sc; render(); }
  else if (t.id === 'run') {
    t.disabled = true; $('#st').textContent = 'Updating…';
    try { const r = await (await fetch('/api/nhl/run', { method: 'POST' })).json();
      $('#st').textContent = r.error ? r.error : `${r.created || 0} new, ${r.graded || 0} graded${r.forebet ? ', Forebet ' + (r.forebet.error || r.forebet.note || r.forebet.saved + ' saved') : ''}`;
      await load(); } catch (err) { $('#st').textContent = err.message; }
    t.disabled = false;
  }
});
load();
</script>
</body>
</html>
