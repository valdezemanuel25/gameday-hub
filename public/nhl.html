<body>
<div id="hub-bar"><div class="sw"><a href="/">⚽ Soccer</a><a href="/nhl" class="on">🏒 NHL</a><a href="/brew">☕ Brew</a></div></div>
<div class="wrap">
  <div class="top">
    <div class="title">NHL <span>Model</span></div>
    <div class="sub">Winner and Over/Under at the sportsbook line (5.5 when no line is known). Overtime and shootout wins count. Times are Central.</div>
    <div class="days" id="days"></div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div id="view"></div>
</div>
<div class="dock"><div class="in"><div id="st"></div><button type="button" class="btn" id="run">Update NHL now</button></div></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const TZ = 'America/Chicago';
const fmt = d => new Intl.DateTimeFormat('en-CA', { timeZone: TZ }).format(d);
const addDays = (d, n) => new Date(new Date(d + 'T12:00:00Z').getTime() + n * 86400000).toISOString().slice(0, 10);
const S = { date: fmt(new Date()), tab: 'board', scope: 'same', tf: 'all' };
let day = { cards: [] }, tally = null, status = null, topCards = null;
const api = async p => { const r = await fetch(p); const t = await r.text(); try { return JSON.parse(t); } catch (e) { throw new Error('Server replied ' + r.status); } };

  }).join('')}</div>`;
}
// ---------- notifications on this device ----------
const PUSH_OK = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
const PUSH_B64 = s => { s = s.replace(/-/g, '+').replace(/_/g, '/'); s += '='.repeat((4 - (s.length % 4)) % 4); return Uint8Array.from(atob(s), c => c.charCodeAt(0)); };
let pushSt = { s: 'checking', msg: '' };
async function pushCheck() {
  try {
    if (!PUSH_OK()) pushSt.s = 'unsupported';
    else if (Notification.permission === 'denied') pushSt.s = 'denied';
    else { const reg = await navigator.serviceWorker.ready, sub = await reg.pushManager.getSubscription(); pushSt.s = sub ? 'on' : 'off'; }
  } catch (e) { pushSt.s = 'unsupported'; }

}
async function pushAct(what) {
  const post = (u, b) => fetch(u, { method: 'POST', body: JSON.stringify(b) }).then(r => r.json());
  pushSt.msg = ''; const was = pushSt.s; pushSt.s = 'busy'; render();
  try {
    const reg = await navigator.serviceWorker.ready;
    if (what === 'on') {
      if ((await Notification.requestPermission()) !== 'granted') { pushSt.s = Notification.permission === 'denied' ? 'denied' : 'off'; return render(); }
      const k = await (await fetch('/api/push/key')).json();
      const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: PUSH_B64(k.key) });
      const r = await post('/api/push/subscribe', { sub: sub.toJSON(), label: (navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || '' });
      if (r.error) throw new Error(r.error);
      pushSt.msg = 'Notifications are on for this device.';
    } else if (what === 'off') {
      const sub = await reg.pushManager.getSubscription();
      if (sub) { await post('/api/push/unsubscribe', { endpoint: sub.endpoint }); await sub.unsubscribe(); }
      pushSt.msg = 'Notifications are off for this device.';
    } else { const r = await post('/api/push/test', {}); pushSt.msg = r.sent ? 'Test sent. It should arrive in a few seconds.' : 'No device received it. Turn notifications off and on again.'; }
  } catch (e) { pushSt.msg = 'Could not do that: ' + e.message; }
  await pushCheck();
}
function pushBox() {
  const iosTab = /iPhone|iPad|iPod/.test(navigator.userAgent) && !(navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches));
  const b = (k, t, cls) => `<button type="button" class="${cls || 'btn'}" data-push="${k}" style="margin-top:8px;margin-right:8px">${t}</button>`;
  const body = pushSt.s === 'checking' ? '<div class="note">Checking…</div>'
    : pushSt.s === 'unsupported' ? `<div class="note">${iosTab ? 'On iPhone, add the Hub to your Home Screen (Share, then Add to Home Screen) and open it from there. Notifications only work in the installed app.' : 'This browser cannot show notifications from the Hub.'}</div>`

    : pushSt.s === 'on' ? `<div class="note">On for this device.</div>${b('test', 'Send a test')}${b('off', 'Turn off')}`

  return `<div class="note" style="margin-top:14px"><b>Notifications</b><br>A heads-up about 45 minutes before a game where every model agrees on its best pick: soccer Best picks (all models agree at 60% or more) and hockey games where v2, v4 and Forebet agree.</div>
    <div>${body}${pushSt.msg ? `<div class="note" style="margin-top:6px">${esc(pushSt.msg)}</div>` : ''}</div>`;
}
// ---------- Model bets: each card's headline pick, tracked as one fixed bet ----------
// (hockeyPick and hockeyHit are the same code the server uses to lock and score the pick; test/pick.mjs keeps the two copies identical.)
function hockeyPick(c) {
  if (!c || !c.v2 || c.skipped || c.v2.w == null) return null;
  const f = c.fb || {}, line = c.ln ? c.ln.v : null, tot = f.score ? f.score.h + f.score.a : null;
  const M = [{ n: 'v2', w: c.v2.w >= 50 ? 'H' : 'A', ph: c.v2.w, o: line != null ? c.v2.o : null }];
  if (c.v4 && c.v4.w != null) M.push({ n: 'v4', w: c.v4.w >= 50 ? 'H' : 'A', ph: c.v4.w, o: line != null ? c.v4.o : null });
  if (f.pick) M.push({ n: 'Forebet', w: f.pick, ph: f.p ? f.p[0] : null, o: line != null && tot != null && tot !== line ? (tot > line ? 100 : 0) : null, fbo: true });
  const O = [['H', m => m.w === 'H', m => m.ph], ['A', m => m.w === 'A', m => (m.ph == null ? null : 100 - m.ph)],
    ['O', m => m.o != null && m.o > 50, m => (m.fbo ? null : m.o)], ['U', m => m.o != null && m.o < 50, m => (m.fbo || m.o == null ? null : 100 - m.o)]];
  const asked = k => M.filter(m => (k === 'H' || k === 'A') ? true : m.o != null);
  const rows = O.map(([key, back, pr]) => { const a = asked(key), yes = a.filter(back), ps = a.map(pr).filter(x => typeof x === 'number'); return { key, a, yes, no: a.filter(m => !back(m)), p: ps.length ? Math.round(ps.reduce((x, y) => x + y, 0) / ps.length) : null }; });
  const score = r => [r.a.length ? r.yes.length / r.a.length : 0, r.yes.length, r.p == null ? 0 : r.p];
  const best = rows.filter(r => r.a.length >= 2).sort((x, y) => { const a = score(x), b = score(y); return b[0] - a[0] || b[1] - a[1] || b[2] - a[2]; })[0];
  const ln = key => (key === 'O' || key === 'U' ? { line } : {});
  const own = c.v2.w >= 50 ? ['H', c.v2.w] : ['A', 100 - c.v2.w];
  if (!best) return { k: 'solo', key: own[0], p: Math.round(own[1]), y: 1, a: 1, by: ['v2'], no: [] };
  const maj = best.yes.length * 2 > best.a.length, all = best.yes.length === best.a.length;
  if (!maj) return { k: 'split', key: own[0], p: Math.round(own[1]), y: best.yes.length, a: best.a.length, by: ['v2'], no: [] };
  return { k: all && best.a.length >= 3 ? 'best' : 'lean', key: best.key, p: best.p, y: best.yes.length, a: best.a.length, by: best.yes.map(m => m.n), no: best.no.map(m => m.n), ...ln(best.key) };
}
// true / false, or null when an Over/Under pick lands exactly on a whole-number line (a push: no result).
function hockeyHit(key, f, line) {
  const t = f.total != null ? f.total : f.h + f.a;
  return key === 'H' ? f.h > f.a : key === 'A' ? f.h < f.a : t === line ? null : key === 'O' ? t > line : t < line;
}

const LEAN_KIND = { best: 'Best pick', lean: 'Lean', split: 'Split', solo: 'v2 alone' };
const leanName = (c, L) => ({ H: `${c.home} to win`, A: `${c.away} to win`, O: `Over ${L.line} goals`, U: `Under ${L.line} goals` })[L.key];
const MB_PLAIN = { H: 'Home win', A: 'Away win', O: 'Over', U: 'Under' };
const moe = (h, n) => (n >= 5 ? Math.round(196 * Math.sqrt((h / n) * (1 - h / n) / n)) : null);
function mbRow(label, sub, x, base) {
  const n = x ? x.n : 0, h = x ? x.hits : 0, m = n ? moe(h, n) : null;
  return `<div class="mbr"><div class="mbl">${label}${sub ? `<small>${sub}</small>` : ''}</div><div class="mbv">${n ? `<b>${Math.round(100 * h / n)}%</b><small>${h} of ${n}${m != null ? ` · ±${m}` : ''}${base != null ? ` · happens ${base}% overall` : ''}</small>` : '<small>none yet</small>'}</div></div>`;
}
function agreeText(L) { return L.k === 'split' ? 'no majority, v2\'s own pick' : L.k === 'solo' ? 'only v2 had numbers' : L.y === L.a ? `all ${L.a} models agree` : `${L.y} of ${L.a} back it (${esc(L.by.join(', '))})`; }
function mbetsToday() {
  const rows = (day.cards || []).filter(c => c.v2 && !c.skipped).map(c => ({ c, L: c.lean || (c.final ? null : hockeyPick(c)) })).filter(x => x.L || x.c.final).sort((a, b) => new Date(a.c.kickoff) - new Date(b.c.kickoff));
  if (!rows.length) return `<div class="note">No picks for this day yet.</div>`;
  return rows.map(({ c, L }) => {
    if (!L) return `<div class="mbg"><div class="mbt"><b>${esc(c.home)} vs ${esc(c.away)}</b><span class="mbs">No pick recorded</span></div><div class="note">This game was already over when the Hub first saw it.</div></div>`;
    const st = c.lean ? (L.hit == null ? '<span class="mbs">Push</span>' : L.hit ? '<span class="mbs hit">Hit ✓</span>' : '<span class="mbs miss">Missed ✗</span>') : `<span class="mbs">${c.kickoff && new Date(c.kickoff) <= Date.now() ? 'In play' : 'Pending'}</span>`;
    return `<div class="mbg"><div class="mbt"><b>${esc(leanName(c, L))}</b>${st}</div><div class="note">${esc(c.away)} at ${esc(c.home)} · ${esc(c.ko || '')}${c.final ? ' · ' + c.final.a + '–' + c.final.h : ''}</div>
      <div class="note"><span class="mbk ${L.k}">${LEAN_KIND[L.k]}</span>${L.p != null ? ` ${L.p}%` : ''} · ${agreeText(L)}</div></div>`;

}
function mbetsView() {
  if (!tally) return `<div class="empty">Loading…</div>`;
  const T = tally.leans || { n: 0, hits: 0, push: 0, byKind: {}, byKey: {}, byBack: {}, base: {}, recent: [] }, pct = (h, n) => n ? Math.round(100 * h / n) : null;
  const kinds = ['best', 'lean', 'split', 'solo'].filter(k => T.byKind[k]), keys = ['H', 'A', 'O', 'U'].filter(k => T.byKey[k]), B = T.base || {};

  const head = T.n ? `<div class="mbh"><b>${T.hits}</b> of <b>${T.n}</b> model bets hit (<b>${pct(T.hits, T.n)}%</b>${moe(T.hits, T.n) != null ? ` ± ${moe(T.hits, T.n)}` : ''}). One pick per game, graded when it ends${T.push ? `; ${T.push} push${T.push === 1 ? '' : 'es'} not counted` : ''}.</div>` : `<div class="mbh">No model bets are graded yet. Each game's headline pick is recorded when the game is graded, so the record starts with the next games that finish.</div>`;
  const recent = (T.recent || []).slice(0, 15).map(r => `<div class="mbg"><div class="mbt"><b>${esc(r.key === 'H' ? r.home + ' to win' : r.key === 'A' ? r.away + ' to win' : (r.key === 'O' ? 'Over ' : 'Under ') + r.line)}</b><span class="mbs ${r.hit ? 'hit' : 'miss'}">${r.hit ? 'Hit ✓' : 'Missed ✗'}</span></div><div class="note">${esc(r.away)} at ${esc(r.home)} · ${r.final.a}–${r.final.h}${r.final.last && r.final.last !== 'REG' ? ' ' + esc(r.final.last) : ''}</div><div class="note"><span class="mbk ${r.k}">${LEAN_KIND[r.k]}</span>${r.p != null ? ` ${r.p}%` : ''}${r.k === 'best' || r.k === 'lean' ? ` · ${r.y === r.a ? 'all ' + r.a + ' agree' : r.y + ' of ' + r.a + ' back it'}` : ''}</div></div>`).join('');
  return `<div class="pad"><div class="note" style="margin:0 0 10px">Every game's headline pick (the side most of v2, v4 and Forebet back: the winner, or Over/Under at that game's DraftKings line) is one fixed bet. It is recorded when the game is graded and scored on the final score, so you can see which kinds of picks are actually strongest. No odds are used. Over/Under needs a real line; a total exactly on the line is a push.</div>${head}
    <div class="mbsec">Today's model bets<small>${esc(S.date)}. Picks still update until the game starts.</small></div><div class="mbx">${mbetsToday()}</div>
    ${T.n ? `<div class="mbsec">By strength<small>Best pick: all three models agree. Lean: two of three. Split: no majority.</small></div><div class="mbx">${kinds.map(k => mbRow(LEAN_KIND[k], '', T.byKind[k])).join('')}</div>
    <div class="mbsec">By kind of pick<small>Compare each to how often it happens in all these games.</small></div><div class="mbx">${keys.map(k => mbRow(MB_PLAIN[k], '', T.byKey[k], k === 'H' ? pct(B.home || 0, T.n) : k === 'A' ? 100 - pct(B.home || 0, T.n) : k === 'O' ? overP : overP == null ? null : 100 - overP)).join('')}</div>
    ${backs.length ? `<div class="mbsec">By how many models agree</div><div class="mbx">${backs.map(k => mbRow(k, 'models back it', T.byBack[k])).join('')}</div>` : ''}

function statusView() {

function renderDays() {

  $('#days').innerHTML = list.map(([d, l]) => `<button type="button" class="day${d === S.date ? ' on' : ''}" data-d="${d}">${l}<b>${+d.slice(8)}</b></button>`).join('');
  $('#tabs').innerHTML = [['board', 'Board'], ['top', 'Top'], ['results', 'Results'], ['mbets', 'Model bets'], ['status', 'Status']].map(([k, l]) => `<button type="button" class="tab${S.tab === k ? ' on' : ''}" data-tab="${k}">${l}</button>`).join('');

function updDots() { const g = document.getElementById('bgrid'); if (!g) return; const t = g.firstElementChild, step = t ? t.getBoundingClientRect().width + 8 : 1, i = Math.round(g.scrollLeft / step / 2 * 2);
  document.querySelectorAll('.bdots i').forEach((d, k) => d.classList.toggle('on', k === Math.min(i, document.querySelectorAll('.bdots i').length - 1))); }
document.addEventListener('scroll', e => { if (e.target && e.target.id === 'bgrid') updDots(); }, true);
function render() { renderDays(); $('#view').innerHTML = S.tab === 'board' ? board() : S.tab === 'top' ? topView() : S.tab === 'results' ? results() : S.tab === 'mbets' ? mbetsView() : statusView(); updDots(); }
async function load() {
  try { day = await api('/api/nhl/day?date=' + S.date); } catch (e) { day = { cards: [] }; $('#st').textContent = e.message; }
  render();
  loadTop().then(() => { if (S.tab === 'top') render(); });
  try { tally = await api('/api/nhl/tally'); status = await api('/api/nhl/status'); render(); } catch (e) { /* shown as Loading */ }
}
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-d],[data-tab],[data-sc],#run,#xp,[data-push],[data-setln],[data-saveln],[data-clrln],[data-tf],[data-sel]'); if (!t) return;
  if (t.dataset.push) return pushAct(t.dataset.push);

    const sc = document.getElementById('bgrid'), x = sc ? sc.scrollLeft : 0, closing = S.sel === t.dataset.sel;

    catch (er) { $('#st').textContent = er.message; t.disabled = false; }

      $('#st').textContent = r.error ? r.error : `${r.created || 0} new, ${r.graded || 0} graded${r.forebet ? ', Forebet ' + (r.forebet.error || r.forebet.note || r.forebet.saved + ' saved') : ''}`;
      await load(); } catch (err) { $('#st').textContent = err.message; }

  }
});
load();
