<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0B1210">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Game Day">
<title>Game Day Hub</title>
<style>
:root{--bg:#0B1210;--panel:#121C18;--panel2:#17241F;--line:#22332C;--ink:#E8EEE4;--dim:#8FA399;--faint:#5F746B;--grass:#58B27A;--sm:#7FA6D9;--amber:#F0B54A;--miss:#E07A5F}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;font-feature-settings:"tnum" 1;-webkit-font-smoothing:antialiased;padding-bottom:120px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{max-width:520px;margin:0 auto}
.top{padding:22px 18px 6px}
.title{font-size:26px;font-weight:700;letter-spacing:-.02em}
.sub{font-size:13px;color:var(--dim);margin-top:2px}
.days{display:flex;gap:8px;margin:16px 0 2px}
.day{flex:1;text-align:center;padding:8px 0 7px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:12px;color:var(--dim)}
.day b{display:block;font-size:17px;color:var(--ink);font-weight:650;margin:1px 0}
.day small{font-size:10.5px;color:var(--faint)}
.day.on{background:var(--ink);border-color:var(--ink);color:#3a4a42}.day.on b{color:#0B1210}.day.on small{color:#53665d}
.day:focus-visible,.chip:focus-visible,.tab:focus-visible,.btn:focus-visible,.m .hd:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.tabs{display:flex;gap:6px;padding:0 18px;margin-top:10px;border-bottom:1px solid var(--line)}
.tab{padding:9px 6px;font-size:13.5px;color:var(--dim);margin-right:10px;border-bottom:2px solid transparent}
.tab.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
.chips{display:flex;gap:8px;padding:12px 18px 6px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y;overscroll-behavior-x:contain;scroll-padding:0 18px;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent)}
.chips::after{content:'';flex:0 0 14px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;white-space:nowrap;font-size:12.5px;padding:7px 12px;border-radius:99px;border:1px solid var(--line);color:var(--dim)}
.chip.on{background:var(--panel2);color:var(--ink);border-color:#35514a}
.chip i{font-style:normal;color:var(--faint);margin-left:5px}
.chip.amber{border-color:#5b4a22;color:var(--amber)}
.chip.amber.on{background:rgba(240,181,74,.12)}
.rail{position:relative;margin:10px 18px 0;padding-left:64px}
.rail:before{content:"";position:absolute;left:52px;top:0;bottom:0;width:2px;background:var(--line);border-radius:2px}
.slot{position:relative;margin-bottom:12px}
.slot .t{position:absolute;left:-64px;top:2px;width:44px;text-align:right;font-size:12px;font-weight:600;color:var(--dim)}
.slot .t small{display:block;font-weight:500;color:var(--faint);font-size:10.5px}
.slot:before{content:"";position:absolute;left:-16px;top:7px;width:9px;height:9px;border-radius:50%;background:var(--bg);border:2px solid #35514a}
.slot.done:before{background:#35514a}
.now{position:relative;margin:2px 0 14px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--amber);font-weight:600}
.now:before{content:"";position:absolute;left:-17px;top:50%;width:11px;height:11px;margin-top:-5px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 4px rgba(240,181,74,.18)}
.now:after{content:"";flex:1;height:1px;background:rgba(240,181,74,.35)}
.m{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:8px}
.m.open{background:var(--panel2);border-color:#35514a}
.m.all,.m.open.all{border-color:#ffb81c;box-shadow:0 0 0 1px #ffb81c,0 0 14px rgba(255,150,0,.38)}
.m .hd{display:block;width:100%;text-align:left;padding:11px 12px;border-radius:14px}
.tag{font-size:10.5px;color:var(--faint);margin-bottom:5px}
.row{display:flex;align-items:center;gap:10px}
.teams{flex:1;min-width:0}
.tm{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-size:14.5px;font-weight:560;line-height:1.45}
.tm .n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tm .n em{font-style:normal;color:var(--faint);font-weight:500;font-size:11.5px;margin-left:6px}
.tm .p{font-size:12.5px;color:var(--dim);font-weight:500}
.tm.lose{color:var(--dim)}
.bar{display:flex;height:5px;border-radius:5px;overflow:hidden;gap:2px;margin-top:8px}
.bar i{display:block;height:100%}.bar .h{background:var(--grass)}.bar .d{background:#2f443b}.bar .a{background:#7d9388}
.side{width:96px;text-align:right;flex:none}
.score{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1}
.mark{font-size:12px;font-weight:600;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ok{color:var(--grass)}.no{color:var(--miss)}.mut{color:var(--dim)}.fnt{color:var(--faint)}
.pick{display:inline-block;max-width:100%;font-size:12px;font-weight:600;background:#1e3a2d;border:1px solid #2c5a42;border-radius:8px;padding:4px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick.lean{background:transparent;border-color:#35514a;color:var(--dim)}
.bb{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding:8px 10px;border-radius:10px;background:rgba(240,181,74,.1);border:1px solid rgba(240,181,74,.35);font-size:12.5px}
.bb b{color:var(--amber);font-weight:650}
.ex{padding:0 12px 12px}
.ex .in{border-top:1px solid var(--line);padding-top:12px}
.kv,.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.two,.box.f{margin-top:8px}
.box{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:12px;color:var(--dim)}
.box b{display:block;color:var(--ink);font-size:14px;margin-top:2px;font-weight:600}
.box small{display:block;color:var(--faint);font-size:11.5px;margin-top:1px}
.src{border-radius:10px;padding:9px 10px;font-size:12px}
.src.m1{background:rgba(88,178,122,.1);border:1px solid rgba(88,178,122,.35)}
.src.s1{background:rgba(127,166,217,.1);border:1px solid rgba(127,166,217,.4)}
.src.s0{border:1px dashed var(--line);color:var(--faint)}
.src small{display:block;color:var(--dim);font-size:11px}
.src b{font-size:19px;letter-spacing:-.02em;display:block}
.src.m1 b{color:var(--grass)}.src.s1 b{color:var(--sm)}
.hits{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.hit{font-size:10.5px;padding:2px 7px;border-radius:99px;font-weight:600}
.hit.y{background:rgba(88,178,122,.18);color:var(--grass)}.hit.n{background:rgba(224,122,95,.18);color:var(--miss)}
.small{font-size:12px;color:var(--dim);line-height:1.5;margin-top:10px}
.small b{color:var(--ink);font-weight:600}
details.how{margin-top:10px;font-size:12px;color:var(--dim)}
details.how summary{cursor:pointer;color:var(--dim);padding:4px 0}
details.how p{margin-top:6px;line-height:1.5}
details.how h5.hw{margin:14px 0 2px;font-size:12px;font-weight:650;color:var(--dim)}
.empty{margin:22px 18px;padding:22px;border:1px dashed var(--line);border-radius:14px;color:var(--dim);font-size:14px;line-height:1.6;text-align:center}
.st{font-size:11.5px;color:var(--faint);text-align:center;padding:4px 16px 0;min-height:18px}
.st.ready{color:var(--grass)}
.dock{-webkit-transform:translateZ(0);transform:translateZ(0);position:fixed;left:0;right:0;bottom:0;z-index:10;padding:10px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 72%,rgba(11,18,16,0))}
.dock .in{max-width:520px;margin:0 auto}
.dock .btns{display:flex;gap:10px;margin-top:6px}
.btn{flex:1;text-align:center;padding:12px 4px;line-height:1.2;border-radius:12px;font-weight:650;font-size:14px;background:var(--ink);color:#0B1210}
.btn.g{background:transparent;color:var(--ink);border:1px solid #35514a}
.btn:disabled{opacity:.5;cursor:not-allowed}
.sec{padding:16px 18px 2px;font-size:14px;font-weight:650}
.mbx,.mbl2{margin:6px 18px 0}.mbr{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:13px}.mbr:first-child{border-top:0}
.mbl small,.mbv small{display:block;color:var(--faint);font-size:11.5px}.mbv{text-align:right}.mbv b{font-size:16px}
.mbg{padding:10px 0;border-top:1px solid var(--line)}.mbg:first-child{border-top:0}.mbt{display:flex;justify-content:space-between;gap:10px;font-size:13.5px}.mbg small{display:block;color:var(--faint);font-size:11.5px;margin-top:2px}
.mbs{font-size:11.5px;font-weight:700;color:var(--dim)}.mbs.hit{color:var(--grass)}.mbs.miss{color:#e07a6a}.mbk{font-weight:700;color:var(--dim)}.mbk.best{color:#d9b85c}.mbk.lean{color:var(--grass)}
.sec small{display:block;font-weight:400;color:var(--dim);font-size:12.5px;margin-top:2px}
.pair{padding:12px 18px 2px}
.pair .lab{display:flex;justify-content:space-between;font-size:13px;margin-bottom:7px}
.pair .lab span{color:var(--dim)}
.pb{display:flex;align-items:center;gap:10px;margin-bottom:5px;font-size:12px;color:var(--dim)}
.pb .n{width:78px}.pb .v{width:92px;text-align:right;color:var(--ink)}.pb .v u{text-decoration:none;color:var(--faint);font-weight:400}
.pb .tr{flex:1;height:9px;background:var(--panel2);border-radius:6px;overflow:hidden}
.pb .tr i{display:block;height:100%;border-radius:6px}
.pb.lead .v{font-weight:700}
.banner{margin:14px 18px 0;padding:12px 14px;border:1px dashed var(--line);border-radius:12px;font-size:12.5px;color:var(--dim);line-height:1.55}
.dots{display:flex;gap:4px;margin-top:3px;flex-wrap:wrap}
.dots i{width:14px;height:14px;border-radius:4px;display:block}
.dots .y{background:var(--grass)}.dots .n{background:#3a2a26;border:1px solid #6b3e33}.dots.s .y{background:var(--sm)}
.lst{padding:4px 18px 10px}
.li{padding:11px 0;border-top:1px solid var(--line);font-size:13px}
.li .a{display:flex;justify-content:space-between;gap:10px;font-weight:560;font-size:14px}
.li .b{display:flex;gap:10px;margin-top:5px;font-size:12px;color:var(--dim)}.li .b span{flex:1;min-width:0}
details.old{margin:8px 18px 0}details.old summary{cursor:pointer;font-size:12.5px;color:var(--dim);padding:8px 0}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:10px 18px 0}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center}
.tile .l{font-size:11px;color:var(--dim)}.tile .v{font-size:24px;font-weight:700;letter-spacing:-.02em;margin:3px 0 1px}.tile .f{font-size:11.5px;color:var(--faint)}

/* pick-first game row */
.pk{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.pk b{font-size:20px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.pk b i{font-style:normal;margin-left:6px;color:var(--grass)}
.pk.lean b i{color:var(--amber)}.pk.toss b i{color:var(--dim)}
.cf{font-size:11px;font-weight:650;padding:2px 8px;border-radius:20px;white-space:nowrap}
.cf.s{background:#1e3a2d;color:#7fd3a0;border:1px solid #2c5a42}
.cf.ln{color:var(--amber);border:1px solid #6b5420}
.cf.tu{color:var(--dim);border:1px dashed #45594f}
.vs{font-size:12.5px;color:var(--dim);margin:3px 0 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vs em{font-style:normal;color:var(--faint);font-size:11px}
.nums{display:flex;justify-content:space-between;gap:6px;font-size:10.5px;color:var(--faint);margin-top:4px}
.nums span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt{width:92px;flex:none;text-align:right;display:flex;flex-direction:column;justify-content:center;align-items:flex-end;gap:4px}
.rt .big{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1}
.rt .sm{font-size:11.5px;color:var(--dim)}
.rt .small2{font-size:18px;font-weight:700;letter-spacing:-.02em;line-height:1}
.live{font-size:12px;font-weight:650;color:var(--amber);display:flex;align-items:center;gap:6px}
.live:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--amber)}
.pend{font-size:11.5px;font-weight:600;color:var(--dim);border:1px dashed #45594f;border-radius:8px;padding:4px 7px;text-align:center;line-height:1.25}
.m.pn{border-style:dashed}
.unc{margin:14px 18px 4px;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;font-size:12.5px;color:var(--dim)}
.unc summary{cursor:pointer;font-weight:600}
.unc .u{padding:7px 0 0;border-top:1px solid var(--line);margin-top:8px}
.unc .u small{display:block;color:var(--faint);font-size:11px}
.meter{height:10px;border-radius:10px;background:var(--panel2);overflow:hidden;margin:8px 0 6px}
.meter i{display:block;height:100%;background:var(--grass)}.meter.w i{background:var(--amber)}.meter.x i{background:var(--miss)}
.lg{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.lg small{display:block;color:var(--miss);font-size:11px;margin-top:2px}
.lg .when{color:var(--dim);font-size:12px;white-space:nowrap}
.lg.bad .nm{color:var(--miss)}
.xbtn{display:block;width:100%;margin-top:10px;padding:12px;border-radius:12px;border:1px solid #35514a;font-weight:650;font-size:14px;text-align:center}

.tod{float:right;margin-top:2px;font-size:12px;font-weight:650;padding:5px 11px;border-radius:20px;border:1px solid #35514a;color:var(--ink)}
.why{font-size:11.5px;color:var(--dim);margin-top:6px}
.nt{color:var(--amber)}.you{color:#9ec5e8}
.note textarea{width:100%;min-height:64px;margin-top:6px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:9px 10px;font:inherit;font-size:13px;resize:vertical}
.note .rw{display:flex;gap:8px;margin-top:8px;align-items:center}
.note select{flex:1;min-width:0;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:9px 8px;font:inherit;font-size:13px}
.note .sv{padding:9px 16px;border-radius:10px;background:var(--ink);color:#0B1210;font-weight:650;font-size:13px}
.alert{margin:12px 18px 0;padding:10px 12px;border-radius:12px;background:rgba(240,181,74,.1);border:1px solid rgba(240,181,74,.35);font-size:12.5px;color:var(--ink);line-height:1.5}
.alert b{color:var(--amber)}
.pend.late{color:var(--amber);border-color:#6b5420}
.cal{padding:9px 0;border-top:1px solid var(--line);font-size:13px}
.cal .h2{display:flex;justify-content:space-between;gap:8px}
.cal .tr2{height:6px;border-radius:6px;background:var(--panel2);margin-top:5px;overflow:hidden}.cal .tr2 i{display:block;height:100%}
.cal.few{opacity:.55}
.cal small{display:block;color:var(--faint);font-size:11.5px;margin-top:3px}
.dotm{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--amber);margin-left:5px;vertical-align:middle}

.seg{display:flex;gap:6px;padding:12px 18px 0}
.seg button{font-size:12.5px;padding:7px 12px;border-radius:99px;border:1px solid var(--line);color:var(--dim)}
.seg button.on{background:var(--panel2);color:var(--ink);border-color:#35514a}
.bd{margin:12px 18px 0;border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden}
.bd .r{display:grid;grid-template-columns:84px repeat(3,minmax(0,1fr));gap:6px;padding:13px 12px;border-top:1px solid var(--line);align-items:center}
.bd .r.h{border-top:0;padding:10px 12px 8px;font-size:11.5px;color:var(--dim);align-items:end}
.bd .r.h b{display:block;color:var(--ink);font-size:13px;font-weight:650}.bd .r.h .fb b{color:var(--sm)}
.bd .lab{font-size:13px;font-weight:600}.bd .lab small{display:block;font-weight:400;font-size:11px;color:var(--faint);margin-top:1px}
.bd .c .p{font-size:21px;font-weight:700;letter-spacing:-.02em;color:var(--dim)}
.bd .c .f{font-size:11.5px;color:var(--faint);margin-top:1px}
.bd .c .tr{height:4px;border-radius:4px;background:#1c2b25;margin-top:6px;overflow:hidden}.bd .c .tr i{display:block;height:100%;background:#4a6157}
.bd .c.best .p{color:var(--grass)}.bd .c.best .tr i{background:var(--grass)}
.bd .r.bs{grid-template-columns:84px minmax(0,1fr) 2fr;background:rgba(255,255,255,.02)}.bd .r.bs .lab small{display:block;font-size:10.5px;color:var(--faint);margin-top:2px;line-height:1.3}.bd .r.bs .c .p{color:var(--dim);font-size:18px}.bd .r.bs .bsn{font-size:11px;color:var(--faint)}
.bd .r.br{font-size:12px;color:var(--dim);padding:10px 12px}.bd .r.br b{color:var(--ink);font-weight:600}.bd .r.br b.best{color:var(--grass)}
.bdn{margin:10px 18px 0;font-size:11.5px;color:var(--faint);line-height:1.45}
.tri{display:grid;grid-template-columns:84px repeat(3,minmax(0,1fr));gap:4px 6px;margin-top:7px;font-size:12px;color:var(--dim)}
.tri span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tri .hh{color:var(--faint)}
.cand{border-color:#5b4a22}.cand small{display:block;color:var(--amber);font-size:11.5px;margin-bottom:2px}
.cr{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink);margin-top:5px}.cr span{flex:1;min-width:0;overflow-wrap:anywhere}
.cr button{flex:none;padding:5px 11px;border-radius:99px;border:1px solid #35514a;font-size:12px;font-weight:650}.cr button.no{padding:5px 8px;color:var(--dim)}
#hub-bar{-webkit-transform:translateZ(0);transform:translateZ(0);position:fixed;top:0;left:0;right:0;z-index:1000;height:56px;display:flex;align-items:center;justify-content:center;padding:0 16px;background:#0f1612;border-bottom:1px solid var(--line)}
#hub-bar .sw{display:flex;gap:4px;background:var(--panel2);border-radius:999px;padding:4px;width:100%;max-width:360px}
#hub-bar a{flex:1;text-align:center;text-decoration:none;border-radius:999px;padding:8px 12px;font-weight:700;font-size:14px;color:var(--dim)}
#hub-bar a.on{background:var(--grass);color:#0B1210}
body{padding-top:56px}

.m.x{background:linear-gradient(180deg,#15211c 0%,#111b17 100%)}
.xh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:9px;font-size:10.5px;color:var(--faint)}
.xh .cfx{font-size:11px;font-weight:650;padding:3px 9px;border-radius:99px;border:1px solid #35514a;color:var(--dim)}
.xh .cfx.s{background:rgba(57,255,136,.14);border-color:#39ff88;color:#39ff88;font-weight:750;box-shadow:0 0 10px rgba(57,255,136,.55),inset 0 0 6px rgba(57,255,136,.2);text-shadow:0 0 6px rgba(57,255,136,.6)}.xh .cfx.ln{color:var(--amber);border-color:rgba(240,181,74,.4)}
.xt{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center}
.xk{display:flex;align-items:center;gap:8px;min-width:0}.xk.r{flex-direction:row-reverse;text-align:right}

</style>
</head>
<body>
<div id="hub-bar"><div class="sw"><a href="/" class="on">⚽ Soccer</a><a href="/nhl">🏒 NHL</a><a href="/brew">☕ Brew</a></div></div>
<div class="wrap">
  <div class="top">
    <div class="title" id="title"></div>
    <div class="sub" id="sub"></div>
    <div class="days" id="days"></div>
  </div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div id="view"></div>
</div>
<div class="dock"><div class="in">
  <div class="st" id="status"></div>
  <div class="btns"><button type="button" class="btn" id="btn-analyze">Analyze this day</button><button type="button" class="btn g" id="btn-left">Analyze leftover games</button><button type="button" class="btn g" id="btn-grade">Update results</button></div>
</div></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const OUT = { H: 'home win', D: 'draw', A: 'away win' };
const TZ = 'America/Chicago';
let cfg = null, day = { cards: [] }, tally = null, cands = [];
const S = { date: '', tab: 'board', league: 'all', top: false, open: null, fin: false, tm: 'all', more: {} };
try { const f = JSON.parse(localStorage.getItem('hubFilter') || 'null'); if (f) { S.league = f.league || 'all'; S.top = !!f.top; if (f.tm) S.tm = f.tm; } } catch (e) {}
const keepFilter = () => { try { localStorage.setItem('hubFilter', JSON.stringify({ league: S.league, top: S.top, tm: S.tm })); } catch (e) {} };
const counts = {};
try { const v = JSON.parse(localStorage.getItem('hubView') || '{}'); if (['board', 'results', 'compare', 'status'].includes(v.tab)) S.tab = v.tab; if (typeof v.league === 'string') S.league = v.league; } catch (e) { /* first visit */ }
const saveView = () => { try { localStorage.setItem('hubView', JSON.stringify({ tab: S.tab, league: S.league })); } catch (e) { /* ignore */ } };

/* ---------- admin token (protects Analyze / Update so strangers can't use your free quota) ---------- */
/* The browser's own login box (shown once per device) is the password; every request carries it automatically. */
async function parse(r) { const t = await r.text(); try { return JSON.parse(t); } catch (e) { throw new Error(`Server replied ${r.status}: ${t.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 140) || 'empty response'}`); } }
async function api(path) { return parse(await fetch(path)); }
async function post(path, body) {
  const r = await fetch(path, body ? { method: 'POST', body: JSON.stringify(body) } : { method: 'POST' });
  if (r.status === 401) throw new Error('Signed out. Reload the page and sign in again.');
  return parse(r);
}
const say = (m, ready) => { const s = $('#status'); s.textContent = m; s.className = 'st' + (ready ? ' ready' : ''); };

/* ---------- helpers ---------- */
const ord = n => { if (!n) return ''; const s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); };
const sideName = (c, side) => side === 'H' ? c.home : side === 'A' ? c.away : 'Draw';
const pickText = c => c.v2.pick === 'D' ? 'Draw' : sideName(c, c.v2.pick);
const addDays = (d, n) => { const x = new Date(d + 'T12:00:00Z'); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); };
const pill = (ok, l) => `<span class="hit ${ok ? 'y' : 'n'}">${l}</span>`;
const isTop = c => c.v2 && (c.v2.best.p >= 62 || Math.max(...c.v2.p) >= 55);
// What makes a game a top pick: v2's winner at 55%+ and/or a goals market at 62%+, with what v4 and Forebet say about the same pick.
function topPicks(c) {
  const v = c.v2, out = [], f = c.fb || {}, v4 = c.v4 || {}, mx = Math.max(...v.p), i = v.p.indexOf(mx);
  if (mx >= 55) out.push({ label: `${i === 0 ? c.home : i === 2 ? c.away : 'Draw'} to ${i === 1 ? 'draw' : 'win'}`, p: mx, v4: v4.p ? v4.p[i] : null, fb: f.p ? f.p[i] : null });
  const mk = (label, p, a, b, flip) => { if (p >= 62) out.push({ label, p, v4: a == null ? null : flip ? 100 - a : a, fb: b == null ? null : flip ? 100 - b : b }); };
  mk('Over 2.5 goals', v.over, v4.over, f.over); mk('Under 2.5 goals', 100 - v.over, v4.over, f.over, true);
  mk('Both teams score', v.btts, v4.btts, f.btts); mk('Not both teams score', 100 - v.btts, v4.btts, f.btts, true);
  return out.sort((a, b) => b.p - a.p);
}
function topBox(c) {
  const t = topPicks(c); if (!t.length) return '';
  const pc = n => n == null ? '' : `<span class="${n >= 55 ? 'hi' : ''}">${n}%</span>`;
  return `<div class="tpk"><div class="tl">Top ${t.length === 1 ? 'pick' : 'picks'}</div>${t.map(x => `<div class="tr"><b>${esc(x.label)}</b><span class="tm"><u>v2</u>${pc(x.p)}${x.v4 != null ? `<u>v4</u>${pc(x.v4)}` : ''}${x.fb != null ? `<u>FB</u>${pc(x.fb)}` : ''}</span></div>`).join('')}</div>`;
}

// Top picks view: one ranked list per market (winner, over/under, both teams score), highest probability first.
const TMK = [['win', 'Winner', 55], ['ou', 'Over/Under', 62], ['btts', 'Both teams score', 62]];
function topRows(c, m) {
  const v = c.v2, f = c.fb || {}, v4 = c.v4 || {}, g = c.grade && c.grade.v2;
  if (m === 'win') { const mx = Math.max(...v.p), i = v.p.indexOf(mx); return { p: mx, label: i === 1 ? 'Draw' : `${strip(i === 0 ? c.home : c.away)} to win`, v4: v4.p ? v4.p[i] : null, fb: f.p ? f.p[i] : null, hit: g ? g.outcomeHit : null }; }
  const ov = m === 'ou', raw = ov ? v.over : v.btts, yes = raw >= 50, a = ov ? v4.over : v4.btts, b = ov ? f.over : f.btts, fl = x => x == null ? null : yes ? x : 100 - x;
  return { p: yes ? raw : 100 - raw, label: ov ? (yes ? 'Over 2.5' : 'Under 2.5') : (yes ? 'BTTS yes' : 'BTTS no'), v4: fl(a), fb: fl(b), hit: g ? (ov ? g.ouHit : g.bttsHit) : null };
}
function topView(cs) {
  const m = S.tm, cols = TMK.filter(([k]) => m === 'all' || m === k);
  const body = cols.map(([k, name, thr]) => {
    const all = cs.map(c => ({ c, ...topRows(c, k) })).sort((x, y) => y.p - x.p), q = all.filter(x => x.p >= thr), rest = all.filter(x => x.p < thr), more = !!S.more[k];
    const row = (x, i, low) => `<div class="trw ${low ? 'low' : ''} ${!low && i === 0 ? 'top1' : ''}"><button type="button" class="hd tr2" data-id="${esc(x.c.id)}" aria-expanded="${S.open === x.c.id}"><span class="pp">${x.p}<small>%</small></span><span class="tx"><b>${esc(x.label)}</b><small>${esc(strip(x.c.home))} vs ${esc(strip(x.c.away))}</small><small class="mt">${esc(LCODE[x.c.leagueKey] || '')} · ${esc(x.c.ko)}</small></span><span class="ag">${x.hit != null ? `<span class="${x.hit ? 'ok' : 'no'}">${x.hit ? '✓' : '✗'}</span> ` : ''}${x.v4 != null ? `<u>v4</u>${x.v4}%` : ''}${x.fb != null ? `<br><u>FB</u>${x.fb}%` : ''}</span></button>${S.open === x.c.id ? `<div class="m x open">${expanded(x.c)}</div>` : ''}</div>`;
    return `<section class="tcol"><h3>${name}<small>${thr}%+ · ${q.length} ${q.length === 1 ? 'game' : 'games'}</small></h3>${q.length ? q.map((x, i) => row(x, i, false)).join('') : `<div class="tnone">Nothing at ${thr}% or more today.</div>`}${rest.length ? `<button type="button" class="tmore" data-more="${k}">${more ? 'Hide' : 'Show'} ${rest.length} below ${thr}%</button>${more ? rest.map(x => row(x, 1, true)).join('') : ''}` : ''}</section>`;
  }).join('');
  const cnt = k => { const thr = TMK.find(t => t[0] === k)[2]; return cs.filter(c => topRows(c, k).p >= thr).length; };
  const seg = `<div class="tseg"><button type="button" class="tall ${m === 'all' ? 'on' : ''}" data-tm="all">All three</button>${TMK.map(([k, n]) => `<button type="button" class="${m === k ? 'on' : ''}" data-tm="${k}">${k === 'btts' ? 'BTTS' : n}<i>${cnt(k)}</i></button>`).join('')}</div>`;
  return seg + `<div class="tcols ${m === 'all' ? 'all' : ''}">${body}</div>`;
}
/* ---------- assign tab: first-division games still waiting for a Forebet or SportsMole prediction ---------- */
const FIRST = new Set(['eng.1', 'ger.1', 'esp.1', 'ita.1', 'fra.1', 'ned.1', 'usa.1', 'mex.1', 'bra.1']);
let asg = null;
async function loadAssign() {
  const ds = [0, 1, 2].map(o => addDays(S.date, o)), days = [], items = [];
  await Promise.all([...ds.map(async d => {
    try { days.push({ date: d, cards: (await api('/api/day?date=' + d)).cards || [] }); } catch (e) { /* skipped */ }
    try { items.push(...((await api('/api/candidates?date=' + d)).items || [])); } catch (e) { /* skipped */ }
  }), (async () => { try { stat = await api('/api/status'); } catch (e) { /* the notes just say less */ } })()]);
  asg = { days: days.sort((a, b) => a.date.localeCompare(b.date)), items };
}
function asgWhy(c, kinds) { // what the last Forebet read of this league said, for the tables this game is still missing
  const l = (stat && stat.leagues || []).find(x => x.slug === c.league), out = [];
  if (!l || !l.fb) return '';
  for (const k of kinds) { const m = l.fb[k]; out.push(!m ? `${KN[k]} table not read yet` : m.ok ? `${KN[k]} table read ${ago(m.at)}, this game was not in it` : `${KN[k]} table blocked (${esc(errCode(m.msg))})`); }
  return out.join(' · ');
}
function asgView() {
  if (!asg) return `<div class="empty">Loading…</div>`;
  const now = Date.now(), f = S.af || 'all', rows = [];
  for (const d of asg.days) for (const c of d.cards) {
    if (!FIRST.has(c.league) || c.final || new Date(c.kickoff).getTime() <= now) continue;
    const have = { '1x2': !!(c.fb && c.fb.p), ou: !!(c.fb && c.fb.over != null), btts: !!(c.fb && c.fb.btts != null) }, miss = Object.keys(have).filter(k => !have[k]), smMiss = !c.sm;
    if (!miss.length && !smMiss) continue;
    rows.push({ d: d.date, c, have, miss, smMiss, cs: asg.items.filter(i => i.cardId === c.id && i.date === d.date) });
  }
  const shown = rows.filter(r => f === 'fb' ? r.miss.length : f === 'sm' ? r.smMiss : true);
  const nF = rows.filter(r => r.miss.length).length, nS = rows.filter(r => r.smMiss).length;
  const seg = `<div class="tseg"><button type="button" class="${f === 'all' ? 'on' : ''}" data-af="all">All<i>${rows.length}</i></button><button type="button" class="${f === 'fb' ? 'on' : ''}" data-af="fb">Forebet<i>${nF}</i></button><button type="button" class="${f === 'sm' ? 'on' : ''}" data-af="sm">SportsMole<i>${nS}</i></button></div>`;
  const head = `<div class="small" style="margin:8px 4px 0">First-division games that have not started and are still missing a Forebet or SportsMole prediction, for the next 3 days. Games where the Hub found a possible match are first: check the teams, then tap Use.</div>`;
  if (!shown.length) return head + seg + `<div class="empty">Nothing waiting. Every first-division game in the next 3 days has its ${f === 'fb' ? 'Forebet' : f === 'sm' ? 'SportsMole' : 'Forebet and SportsMole'} prediction.</div>`;
  shown.sort((a, b) => (b.cs.length ? 1 : 0) - (a.cs.length ? 1 : 0) || new Date(a.c.kickoff) - new Date(b.c.kickoff));
  const cbox = (r, list) => list.length ? `<div class="box cand">${list.map(i => `<div class="cr"><span>${i.src === 'fb' ? esc(KN[i.kind] || '') + ': ' : ''}${esc(i.title)}</span><button type="button" data-assign="${esc(i.key)}" data-card="${esc(r.c.id)}" data-date="${r.d}" data-lg="${esc(r.c.league)}">Use</button><button type="button" class="no" data-assign="${esc(i.key)}" data-card="${esc(r.c.id)}" data-date="${r.d}" data-lg="${esc(r.c.league)}" data-dismiss="1" aria-label="Not this game">✕</button></div>`).join('')}</div>` : '';
  const dayName = d => d === cfg.today ? 'Today' : d === addDays(cfg.today, 1) ? 'Tomorrow' : new Date(d + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
  let html = '', last = '';
  for (const r of shown) {
    const c = r.c, fbs = r.cs.filter(i => i.src === 'fb'), sms = r.cs.filter(i => i.src === 'sm');
    if (r.d !== last && !shown.some(x => x.cs.length)) { html += `<div class="asgd">${esc(dayName(r.d))}</div>`; last = r.d; }
    const fbLine = r.miss.length ? `<div class="src2"><div class="sl"><b>Forebet</b>${[['1x2', '1X2'], ['ou', 'O/U'], ['btts', 'Both']].map(([k, n]) => `<span class="pl ${r.have[k] ? 'y' : 'w'}">${n} ${r.have[k] ? '✓' : 'waiting'}</span>`).join('')}</div>${cbox(r, fbs)}${fbs.length ? '' : `<span class="why">${asgWhy(c, r.miss) || 'No Forebet table for this league.'}</span>`}</div>` : '';
    const smLine = r.smMiss ? `<div class="src2"><div class="sl"><b>SportsMole</b><span class="pl w">waiting</span></div>${cbox(r, sms)}${sms.length ? '' : `<span class="why">${stat && (stat.leagues.find(l => l.slug === c.league) || {}).sm && stat.leagues.find(l => l.slug === c.league).sm.tried ? `Last looked ${ago(stat.leagues.find(l => l.slug === c.league).sm.tried)}, no page found for this game yet.` : 'Not looked for yet.'}</span>`}</div>` : '';
    html += `<div class="trw asg ${r.cs.length ? 'has' : ''}"><div class="ah"><b>${esc(strip(c.home))} vs ${esc(strip(c.away))}</b><small>${esc(LCODE[c.leagueKey] || '')} · ${shown.some(x => x.cs.length) ? esc(dayName(r.d)) + ', ' : ''}${esc(c.ko)}</small></div>${fbLine}${smLine}</div>`;
  }
  return head + seg + `<div class="tcols" style="display:block">${html}</div>`;
}

/* ---------- bets tab: analyze a straight or parlay, track it, and let the finished games grade it ---------- */
const BS = { sport: null, lg: null, games: null, q: '', game: null, market: 'win', sel: null, line: 2.5, slip: [], an: null, cur: null, bets: null, sum: null, msg: '', busy: false, del: null };
const BIN_O = [['Under 40%', 0, 40], ['40 to 49%', 40, 50], ['50 to 59%', 50, 60], ['60 to 69%', 60, 70], ['70% and up', 70, 101]];
const bpost = async (path, body) => { const r = await fetch(path, { method: 'POST', body: JSON.stringify(body) }); const t = await r.text(); try { return JSON.parse(t); } catch (e) { throw new Error('Server replied ' + r.status); } };
const bpc = x => x == null ? '–' : Math.round(x * 100) + '%';
async function loadBets() {
  const ds = [-1, 0, 1, 2, 3, 4, 5, 6, 7].map(o => addDays(cfg.today, o)), games = [];
  await Promise.all([...ds.map(async d => { try { for (const c of (await api('/api/day?date=' + d)).cards || []) if (c.v2 && !c.final) games.push({ date: d, c }); } catch (e) { /* skipped */ }
    try { for (const c of (await api('/api/nhl/day?date=' + d)).cards || []) if (c.v2 && !c.final && !c.skipped) games.push({ date: d, c: { ...c, league: 'nhl', leagueName: 'NHL', sport: 'nhl' } }); } catch (e) { /* skipped */ } }),
    (async () => { try { const r = await api('/api/bets'); BS.bets = r.items || []; BS.sum = r.summary || null; } catch (e) { BS.bets = BS.bets || []; } })(),
    (async () => { try { await ensureTally(); } catch (e) { /* the record notes are just left out */ } })()]);
  BS.games = games.sort((a, b) => new Date(a.c.kickoff) - new Date(b.c.kickoff));
}
const curLeg = () => { const g = BS.game; if (!g || !BS.sel) return null; const nhl = g.c.sport === 'nhl'; return { date: g.date, league: g.c.league, id: g.c.id, ...(nhl ? { sport: 'nhl' } : {}), market: BS.market, sel: BS.sel, ...(BS.market === 'ou' && !nhl ? { line: BS.line } : {}) }; };
async function bAnalyzeCur() {
  const l = curLeg(); BS.cur = null; if (!l) return render();
  const mine = l; BS.curKey = JSON.stringify(l); render();
  try { const r = await bpost('/api/bets/analyze', { legs: [l] }); if (BS.curKey === JSON.stringify(mine)) BS.cur = r; } catch (e) { BS.cur = { error: e.message }; }
  render();
}
async function bAnalyzeSlip() { BS.an = null; if (!BS.slip.length) return render(); try { BS.an = await bpost('/api/bets/analyze', { legs: BS.slip }); } catch (e) { BS.an = { error: e.message }; } render(); }
// What a model's record says about a number like this one, from the Hub's finished games.
function trackRec(l, m, p) {
  if (!tally || p == null || l.sport === 'nhl' || l.league === 'nhl') return null;
  const pc = p * 100;
  if ((l.market === 'ou' && Number(l.line) === 2.5) || l.market === 'btts') {
    const pos = l.market === 'ou' ? l.sel === 'O' : l.sel === 'Y', rows = tally.calGoals && tally.calGoals[l.market === 'ou' ? 'over' : 'btts'] && tally.calGoals[l.market === 'ou' ? 'over' : 'btts'][m];
    if (!rows) return null;
    const overP = pos ? pc : 100 - pc, bin = BIN_O.find(([, lo, hi]) => overP >= lo && overP < hi), r = bin && rows.find(x => x.label === bin[0]);
    if (!r || !r.n) return null;
    return { rate: Math.round(100 * (pos ? r.hits / r.n : 1 - r.hits / r.n)), n: r.n };
  }
  if (l.market === 'win' && m === 'v2' && pc >= 50) { const r = (tally.calibration || []).find(x => pc >= x.lo && pc < x.hi) || (tally.calibration || []).find(x => x.label === '60% and up' && pc >= 60); return r && r.n ? { rate: Math.round(100 * r.hits / r.n), n: r.n } : null; }
  return null;
}
function probRow(l) {
  const cell = (k, name) => `<span class="${l.p[k] == null ? 'zna' : ''}"><span class="zk">${name}</span><b>${l.p[k] == null ? 'n/a' : bpc(l.p[k])}</b></span>`;
  const recs = ['v2', 'v4'].map(m => { const r = trackRec(l, m, l.p[m]); return r ? `<span class="zrc ${r.n < 25 ? 'w' : ''}">${m} so far: picks like this landed ${r.rate}% (${r.n} finished games${r.n < 25 ? ', still a small sample' : ''})</span>` : ''; }).join('');
  return `<div class="zpr">${cell('v2', 'v2')}${cell('v4', 'v4 shadow')}${cell('fb', 'Forebet')}</div>${recs}${l.grid ? `<span class="zrc">At this line the number comes from each model's score grid, which tends to overstate goals markets. There is no track record for it yet.</span>` : ''}`;
}
const MK = [['win', 'Winner'], ['dc', 'Double chance'], ['ou', 'Over/Under'], ['btts', 'Both score']];
function selChips(g) {
  const c = g.c, ch = (v, t) => `<button type="button" class="zch ${BS.sel === v ? 'on' : ''}" data-bs="${v}">${esc(t)}</button>`;
  if (c.sport === 'nhl') return BS.market === 'win' ? ch('H', strip(c.home)) + ch('A', strip(c.away)) : ch('O', 'Over') + ch('U', 'Under');
  if (BS.market === 'win') return ch('H', strip(c.home)) + ch('D', 'Draw') + ch('A', strip(c.away));
  if (BS.market === 'dc') return ch('1X', `${strip(c.home)} or draw`) + ch('X2', `${strip(c.away)} or draw`) + ch('12', 'No draw');
  if (BS.market === 'ou') return ch('O', 'Over') + ch('U', 'Under');

const PUSH_OK = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
const PUSH_B64 = s => { s = s.replace(/-/g, '+').replace(/_/g, '/'); s += '='.repeat((4 - (s.length % 4)) % 4); return Uint8Array.from(atob(s), c => c.charCodeAt(0)); };

function forebetBox() {
  const opts = (cfg.leagues || []).map(l => `<option value="${esc(l.slug)}"${l.slug === (S.league !== 'all' ? S.league : 'uefa.europa') ? ' selected' : ''}>${esc(l.name)}</option>`).join('');
  return `<div class="sec" style="padding-top:16px">Forebet picks<small>The Hub reads Forebet's league pages by itself for games that have not started. If a page can't be read, copy the league table from forebet.com and paste it here. Do it once per tab on Forebet (1X2, Under/Over 2.5, Both teams to score). It is saved for ${esc(S.date)}, only for games that have not started, and only once per game for each table. Nothing uses it except the Results tab.</small></div>
    <div class="pair" style="padding-top:0">${forebetReads()}<select id="fb-league" style="width:100%;margin-bottom:8px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit">${opts}</select>
    <select id="fb-kind" style="width:100%;margin-bottom:8px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit"><option value="1x2">Table: 1X2 (win, draw, loss)</option><option value="ou">Table: Under/Over 2.5</option><option value="btts">Table: Both teams to score</option></select>
    <div class="note"><textarea id="fb-text" placeholder="Paste the table here"></textarea></div><button type="button" class="xbtn" id="btn-fb">Save pasted picks</button><div class="small" id="fb-msg" style="margin-top:6px"></div></div>`;
}
// Tracking only: whether ESPN gives shot counts for finished games. Nothing here feeds a prediction.
function shotsBlock() {
  const L = stat.leagues.filter(l => l.shots), cups = L.filter(l => /Champions|Europa/.test(l.name)), rest = L.filter(l => !cups.includes(l) && l.shots.checked > 0);
  const line = l => { const c = l.shots; return `<div class="lg"><div><span class="nm">${esc(l.name)}</span></div><div class="when">${c.checked ? `shots on ${c.withShots} of ${c.checked} finished games` : 'no finished games checked yet'}</div></div>`; };
  return `<div class="sec" style="padding-top:16px">Shot data from ESPN<small>Counts finished games saved since tracking started and how many came with shots and shots on target. This is only being recorded; no prediction uses it yet.</small></div>
    <div class="pair" style="padding-top:0">${cups.map(line).join('')}${rest.map(line).join('')}</div>`;
}
async function exportAll() {
  const b = $('#btn-export'); if (b) b.disabled = true;
  try {
    say('Exporting: listing saved days…');
    const list = (await api('/api/days')).days, days = [];
    for (let i = 0; i < list.length; i++) { say(`Exporting day ${i + 1} of ${list.length}…`); days.push(await api('/api/day?date=' + list[i])); }
    say('Exporting totals…');
    const data = { exportedAt: new Date().toISOString(), note: 'Game Day Hub backup. days = every saved day (cards with model picks, results, SportsMole picks); totals = results summary including carried-over history.', days, totals: await api('/api/tally') };
    const url = URL.createObjectURL(new Blob([JSON.stringify(data)], { type: 'application/json' }));
    const a = document.createElement('a'); a.href = url; a.download = `gameday-hub-backup-${new Date().toISOString().slice(0, 10)}.json`; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    try { localStorage.setItem('hubBackup', new Date().toISOString()); } catch (e) { /* ignore */ }
    say(`Backup downloaded: ${days.length} day${days.length === 1 ? "" : "s"}.`, true);
    if (S.tab === 'status') render();
  } catch (e) { say(e.message); }
  if (b) b.disabled = false;
}

/* ---------- page ---------- */
function renderHeader() {
  const d = new Date(S.date + 'T12:00:00');
  $('#title').innerHTML = esc(d.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' })) + (S.date !== cfg.today ? `<button type="button" class="tod" data-date="${cfg.today}">Today</button>` : '');
  const done = day.cards.filter(c => c.v2).length, need = day.cards.filter(c => !c.v2).length;
  $('#sub').textContent = day.cards.length ? `${done} games with a prediction${need ? `, ${need} not covered` : ''}` : 'Nothing analyzed for this day yet';
  $('#days').innerHTML = [-2, -1, 0, 1, 2].map(o => {
    const ds = addDays(S.date, o), x = new Date(ds + 'T12:00:00'), c = counts[ds];
    return `<button type="button" class="day ${o === 0 ? 'on' : ''}" data-date="${ds}">${x.toLocaleDateString('en-US', { weekday: 'short' })}<b>${x.getDate()}</b><small>${c == null ? '' : c}</small></button>`;
  }).join('');
  $('#tabs').innerHTML = [['board', 'Board'], ['results', 'Results'], ['compare', 'Compare'], ['status', 'Status'], ['assign', 'Assign'], ['bets', 'Bets'], ['mbets', 'Model bets']].map(([k, n]) =>
    `<button type="button" role="tab" class="tab ${S.tab === k ? 'on' : ''}" data-tab="${k}" aria-selected="${S.tab === k}">${n}${k === 'status' && alerts().length ? '<span class="dotm"></span>' : ''}</button>`).join('');
}
function updSDots() { const g = document.getElementById('sgrid'), ds = document.querySelectorAll('.sdots i'); if (!g || !ds.length) return; const t = g.firstElementChild, step = t ? t.getBoundingClientRect().width + 8 : 1, i = Math.round(g.scrollLeft / step / 2);
  ds.forEach((d, k) => d.classList.toggle('on', k === Math.min(i, ds.length - 1))); }
document.addEventListener('scroll', e => { if (e.target && e.target.id === 'sgrid') updSDots(); }, true);
function render() {
  keepFilter();
  renderHeader();
  $('#view').innerHTML = S.tab === 'board' ? board() : S.tab === 'results' ? results() : S.tab === 'status' ? statusView() : S.tab === 'assign' ? asgView() : S.tab === 'bets' ? betsView() : S.tab === 'mbets' ? mbetsView() : compare();
  updSDots();
}
async function loadCounts() {
  const ds = [-2, -1, 0, 1, 2].map(o => addDays(S.date, o)).filter(d => counts[d] == null || d === S.date);
  await Promise.all(ds.map(async d => { try { const j = await api('/api/day?date=' + d); counts[d] = j.cards.length; if (d === S.date) day = j; } catch (e) {} }));
  try { cands = (await api('/api/candidates?date=' + S.date)).items || []; } catch (e) { cands = []; }
}
async function loadDay(date) {
  if (date) S.date = date;
  S.open = null; day = { cards: [] };
  render();
  await loadCounts();
  render();
  warmTally();
  say(day.analyzedAt ? 'Updated ' + new Date(day.analyzedAt).toLocaleString('en-US', { timeZone: TZ, month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '');
}
let tallyTry = false;
async function warmTally() { if (tally || tallyTry) return; tallyTry = true; try { tally = await api('/api/tally'); if (S.tab === 'board') render(); } catch (e) {} }
document.addEventListener('input', e => { if (e.target && e.target.id === 'bq') { BS.q = e.target.value; const el = document.getElementById('bglist'); if (el) el.innerHTML = gameArea(); } });
async function ensureTally() { if (!tally) { tally = await api('/api/tally'); } }

/* ---------- Analyze / Update: one league at a time ---------- */
let failed = [];
async function syncUntilCaughtUp(slug, name, i, n) {
  for (let k = 0; k < 10; k++) {
    say(`Loading ${name} results (${i}/${n})…`);
    const r = await post('/api/sync?league=' + slug);
    if (r.error) { failed.push(name); return; } // a league ESPN won't load must not stop the whole run
    if (r.caughtUp) return;
  }
}
async function runAll(kind) {
  const buttons = ['#btn-analyze', '#btn-left', '#btn-grade'].map($); buttons.forEach(b => b.disabled = true);
  const date = S.date; let done = 0, skipped = 0, graded = 0, smFound = 0; failed = [];
  try {
    let list = cfg.leagues;
    if (kind === 'leftover') {
      const need = new Set(day.cards.filter(c => !c.v2).map(c => c.league)), seen = day.analyzed || {};
      list = cfg.leagues.filter(l => need.has(l.slug) || !seen[l.slug]);
      if (!list.length) { say('Every game for this day already has a prediction.', true); buttons.forEach(b => b.disabled = false); return; }
    }
    for (let i = 0; i < list.length; i++) {
      const lg = list[i], at = `${i + 1}/${list.length}`;
      if (kind !== 'grade') {
        const lo = kind === 'leftover' ? '&leftover=1' : '';
        say(`Analyzing ${lg.name} (${at})…`);
        let r = await post(`/api/analyze?league=${lg.slug}&date=${date}${lo}`);
        if (r.error) throw new Error(r.error);
        if (r.needsSync) {
          for (const slug of r.needsSync) { const m = cfg.leagues.find(l => l.slug === slug); await syncUntilCaughtUp(slug, m ? m.name : slug, at.split('/')[0], list.length); }
          r = await post(`/api/analyze?league=${lg.slug}&date=${date}&partial=1${lo}`);
        }
        if (r.feedError) failed.push(lg.name + ' (games feed)');
        done += r.cards || 0; skipped += r.skipped || 0;
        if (r.cards) { try { say(`SportsMole predictions: ${lg.name} (${at})…`); const s = await post(`/api/sm?league=${lg.slug}&date=${date}`); smFound += s.found || 0; } catch (e) { /* optional */ } }
      } else {
        say(`Checking ${lg.name} results (${at})…`);
        const r = await post(`/api/grade?league=${lg.slug}&date=${date}`);
        if (r.error) throw new Error(r.error);
        graded += r.graded || 0;
      }
    }
    delete counts[date]; tally = null;
    await loadDay();
    say(kind !== 'grade' ? `Done: ${done} matches${kind === 'leftover' ? ' checked' : ''}${skipped ? ` (${skipped} skipped, not enough form data)` : ''}.${smFound ? ` SportsMole predictions found: ${smFound}.` : ''}${failed.length ? ` Couldn't load: ${[...new Set(failed)].join(', ')}.` : ''}` : `Graded ${graded} match${graded === 1 ? '' : 'es'}.`, true);
  } catch (err) { say(err.message); }
  buttons.forEach(b => b.disabled = false);
}

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  const rf = e.target.closest('[data-refetch]'); if (rf) return fbModal(rf.dataset.refetch);
  const fm = e.target.closest('[data-fbm]');
  if (fm) { const a = fm.dataset.fbm; if (a === 'go') return fbRun(fm.dataset.slug); const m = $('#fbm'); if (m && !m.dataset.busy) m.remove(); return; }
  if (e.target.closest('#btn-export')) return exportAll();
  if (e.target.closest('#btn-fb')) {
    const msg = $('#fb-msg'), text = $('#fb-text').value, lg = $('#fb-league').value, kind = $('#fb-kind').value; if (!text.trim()) { msg.textContent = 'Paste the table first.'; return; }
    msg.textContent = 'Saving…';
    try {
      const r = await post(`/api/forebet?league=${encodeURIComponent(lg)}&date=${S.date}&kind=${kind}`, { text }); if (r.error) throw new Error(r.error);
      msg.textContent = `Saved ${r.saved}. ${r.alreadyHad ? r.alreadyHad + ' already had a pick. ' : ''}${r.started ? r.started + ' already started (skipped). ' : ''}${r.notFound.length ? "Couldn't match: " + r.notFound.join(', ') + '.' : ''}`;
      if (r.saved) { delete counts[S.date]; tally = null; await loadDay(); }
    } catch (er) { msg.textContent = er.message; }
    return;
  }
  const as = e.target.closest('[data-assign]');
  if (as) {
    const onAsg = S.tab === 'assign', dt = as.dataset.date || S.date, c = onAsg ? { id: as.dataset.card, league: as.dataset.lg } : day.cards.find(x => x.id === as.dataset.card); if (!c) return;
    as.disabled = true;
    try { const r = await post('/api/assign', { date: dt, league: c.league, id: c.id, key: as.dataset.assign, dismiss: !!as.dataset.dismiss }); if (r.error) throw new Error(r.error);
      say(r.dismissed ? 'Suggestion removed.' : `Assigned: ${r.title}`, true); delete counts[dt]; tally = null;
      if (onAsg) { await loadAssign(); return render(); }
      await loadDay(); S.open = c.id; render(); }
    catch (er) { say(er.message); as.disabled = false; }
    return;
  }
  const sv = e.target.closest('[data-save]');
  if (sv) {
    const id = sv.dataset.save, c = day.cards.find(x => x.id === id); if (!c) return;
    const note = document.getElementById('note-' + id).value, mine = document.getElementById('mine-' + id).value;
    sv.disabled = true;
    try { const r = await post(`/api/note?league=${c.league}&date=${S.date}`, { id, note, mine }); if (r.error) throw new Error(r.error); c.note = r.note || undefined; c.mine = r.mine || undefined; delete counts[S.date]; tally = null; say('Note saved.', true); render(); }
    catch (er) { say(er.message); sv.disabled = false; }
    return;
  }
  const t = e.target.closest('[data-date],[data-tab],[data-league],[data-top],[data-rb],[data-fin],[data-tm],[data-af],[data-more],[data-bg],[data-bm],[data-bs],[data-bl],[data-badd],[data-brm],[data-bclear],[data-btrack],[data-bdel],[data-bvoid],[data-bchg],[data-bsp],[data-blg],[data-bback],[data-ssel],[data-push],.hd'); if (!t) return;
  if (t.dataset.bg !== undefined) { const [d, id] = t.dataset.bg.split('|'); BS.game = BS.games.find(x => x.date === d && x.c.id === id) || null; if (BS.game && BS.game.c.sport === 'nhl' && !['win','ou'].includes(BS.market)) BS.market = 'win'; BS.sel = null; BS.cur = null; BS.msg = ''; return render(); }
  if (t.dataset.push) return pushAct(t.dataset.push);
  if (t.dataset.bsp) { BS.sport = t.dataset.bsp; BS.lg = BS.sport === 'nhl' ? 'nhl' : null; return render(); }
  if (t.dataset.blg) { BS.lg = t.dataset.blg; return render(); }
  if (t.dataset.bback) { if (t.dataset.bback === 'sport') { BS.sport = null; BS.lg = null; } else BS.lg = null; return render(); }
  if (t.dataset.bchg) { BS.game = null; BS.sel = null; BS.cur = null; return render(); }
  if (t.dataset.bm) { BS.market = t.dataset.bm; BS.sel = null; BS.cur = null; return render(); }
  if (t.dataset.bl) { BS.line = Number(t.dataset.bl); return bAnalyzeCur(); }
  if (t.dataset.bs) { BS.sel = t.dataset.bs; return bAnalyzeCur(); }
  if (t.dataset.badd) { const l = curLeg(); if (!l) return; if (BS.slip.length >= 12) { BS.msg = 'A bet can have up to 12 picks.'; return render(); } BS.slip.push(l); BS.sel = null; BS.cur = null; BS.msg = 'Added. Pick another market on this game, or change game.'; return bAnalyzeSlip(); }
  if (t.dataset.brm) { BS.slip.splice(Number(t.dataset.brm), 1); return bAnalyzeSlip(); }
  if (t.dataset.bclear) { BS.slip = []; BS.an = null; BS.msg = ''; return render(); }
  if (t.dataset.btrack) {
    BS.busy = true; render();
    try { const r = await bpost('/api/bets', { legs: BS.slip }); if (r.error) throw new Error(r.error); BS.slip = []; BS.an = null; BS.msg = 'Tracked. It will be marked hit or missed after the games finish and are graded.'; const l = await api('/api/bets'); BS.bets = l.items || []; BS.sum = l.summary || null; }
    catch (er) { BS.msg = er.message; }
    BS.busy = false; return render();
  }
  if (t.dataset.bvoid || t.dataset.bdel) {
    const id = t.dataset.bvoid || t.dataset.bdel, del = !!t.dataset.bdel;
    if (del && BS.del !== id) { BS.del = id; return render(); }
    BS.del = null;
    try { const r = await bpost(del ? '/api/bets/delete' : '/api/bets/void', { id }); if (r.error) throw new Error(r.error); const l = await api('/api/bets'); BS.bets = l.items || []; BS.sum = l.summary || null; BS.msg = del ? 'Removed.' : 'Marked void.'; }
    catch (er) { BS.msg = er.message; }
    return render();
  }
  if (t.dataset.af) { S.af = t.dataset.af; return render(); }
  if (t.dataset.tm) { S.tm = t.dataset.tm; keepFilter(); return render(); }
  if (t.dataset.more) { S.more[t.dataset.more] = !S.more[t.dataset.more]; return render(); }
  if (t.dataset.ssel) { // tap a game: its card opens below and the page scrolls to it; tap it again to close and go back where you were
    const g = document.getElementById('sgrid'), x = g ? g.scrollLeft : 0, closing = S.sel === t.dataset.ssel;
    if (closing) S.sel = null; else { if (!S.sel) S.back = window.scrollY; S.sel = t.dataset.ssel; }
    S.open = closing ? null : S.sel; render(); const n = document.getElementById('sgrid'); if (n) n.scrollLeft = x;
    requestAnimationFrame(() => { if (closing) { window.scrollTo({ top: S.back || 0, behavior: 'smooth' }); S.back = null; } else { const d = document.getElementById('sdt'); if (d) d.scrollIntoView({ behavior: 'smooth', block: 'start' }); } });
    return; }
  if (t.dataset.fin) { S.fin = !S.fin; return render(); }
  if (t.dataset.rb) { S.rb = t.dataset.rb; return render(); }
  if (t.dataset.date) { S.tab = 'board'; saveView(); return loadDay(t.dataset.date); }
  if (t.dataset.tab) { S.tab = t.dataset.tab; S.open = null; saveView();
    if (S.tab === 'status') { pushCheck(); stat = null; render(); try { stat = await api('/api/status'); } catch (er) { say(er.message); } } else if (S.tab === 'assign') { asg = null; render(); await loadAssign(); } else if (S.tab === 'bets') { BS.games = null; render(); await loadBets(); } else if (S.tab !== 'board') { render(); await ensureTally(); } return render(); }
  if (t.dataset.league) { S.league = t.dataset.league; S.top = false; S.open = null; saveView(); return render(); }
  if (t.dataset.top) { S.top = !S.top; if (S.top) S.league = 'all'; S.open = null; return render(); }
  if (t.classList.contains('hd') && t.closest('#sdt')) { // tapping the opened game's header closes it and returns to the grid
    const g = document.getElementById('sgrid'), x = g ? g.scrollLeft : 0; S.sel = null; S.open = null; render();
    const n = document.getElementById('sgrid'); if (n) n.scrollLeft = x;
    requestAnimationFrame(() => { window.scrollTo({ top: S.back || 0, behavior: 'smooth' }); S.back = null; });
    return; }
  if (t.classList.contains('hd')) { S.open = S.open === t.dataset.id ? null : t.dataset.id; return render(); }
});
$('#btn-analyze').onclick = () => {
  if (day.cards.some(c => c.v2) && !confirm('This redoes every game for this day, including ones that already have a prediction, and uses up more of your free daily saves.\n\nTo fill in only the missing games, use Analyze leftover games instead.\n\nRedo the whole day?')) return;
  runAll('analyze');
};
$('#btn-left').onclick = () => runAll('leftover');
$('#btn-grade').onclick = () => runAll('grade');

(async () => {
  cfg = await api('/api/config'); S.date = cfg.today; await loadDay();
  if (S.tab === 'results' || S.tab === 'compare' || S.tab === 'mbets') { await ensureTally(); render(); }
  try { stat = await api('/api/status'); if (!document.activeElement || document.activeElement.tagName !== 'TEXTAREA') render(); } catch (e) { /* alerts are optional */ }
})();
try { if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js'); } catch (e) { /* installing is optional */ }
</script>
