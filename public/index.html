<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0B1210">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Game Day">
<title>Game Day Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap">
<style>
:root{--acc-rgb:88,178,122;--acc-line:#35514a;--pick-bg:#1e3a2d;--pick-bd:#2c5a42;--acc-hi:#9ddcb4;--acc-hi2:#7fd3a0;--bg:#0B1210;--panel:#121C18;--panel2:#17241F;--line:#22332C;--ink:#E8EEE4;--dim:#8FA399;--faint:#5F746B;--grass:#58B27A;--sm:#7FA6D9;--amber:#F0B54A;--miss:#E07A5F}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;font-feature-settings:"tnum" 1;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{max-width:520px;margin:0 auto}
.top{padding:22px 18px 6px}
.title{font-size:26px;font-weight:700;letter-spacing:-.02em}
.sub{font-size:13px;color:var(--dim);margin-top:2px}
.days{display:flex;gap:8px;margin:16px 0 2px}
.day{flex:1;text-align:center;padding:8px 0 7px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:12px;color:var(--dim)}
.day b{display:block;font-size:17px;color:var(--ink);font-weight:650;margin:1px 0}
.day small{font-size:10.5px;color:var(--faint)}
.day.on{background:var(--ink);border-color:var(--ink);color:#3a4a42}.day.on b{color:#0B1210}.day.on small{color:#53665d}
.day:focus-visible,.chip:focus-visible,.tab:focus-visible,.btn:focus-visible,.m .hd:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.tabs{display:flex;gap:6px;padding:0 18px;margin-top:10px;border-bottom:1px solid var(--line)}
.tab{padding:9px 6px;font-size:13.5px;color:var(--dim);margin-right:10px;border-bottom:2px solid transparent}
.tab.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
.chips{display:flex;gap:8px;padding:12px 18px 6px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y;overscroll-behavior-x:contain;scroll-padding:0 18px;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent)}
.chips::after{content:'';flex:0 0 14px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;white-space:nowrap;font-size:12.5px;padding:7px 12px;border-radius:99px;border:1px solid var(--line);color:var(--dim)}
.chip.on{background:var(--panel2);color:var(--ink);border-color:var(--acc-line)}
.chip i{font-style:normal;color:var(--faint);margin-left:5px}
.chip.amber{border-color:#5b4a22;color:var(--amber)}
.chip.amber.on{background:rgba(240,181,74,.12)}
.rail{position:relative;margin:10px 18px 0;padding-left:64px}
.rail:before{content:"";position:absolute;left:52px;top:0;bottom:0;width:2px;background:var(--line);border-radius:2px}
.slot{position:relative;margin-bottom:12px}
.slot .t{position:absolute;left:-64px;top:2px;width:44px;text-align:right;font-size:12px;font-weight:600;color:var(--dim)}
.slot .t small{display:block;font-weight:500;color:var(--faint);font-size:10.5px}
.slot:before{content:"";position:absolute;left:-16px;top:7px;width:9px;height:9px;border-radius:50%;background:var(--bg);border:2px solid var(--acc-line)}
.slot.done:before{background:var(--acc-line)}
.now{position:relative;margin:2px 0 14px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--amber);font-weight:600}
.now:before{content:"";position:absolute;left:-17px;top:50%;width:11px;height:11px;margin-top:-5px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 4px rgba(240,181,74,.18)}
.now:after{content:"";flex:1;height:1px;background:rgba(240,181,74,.35)}
.m{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:8px}
.m.open{background:var(--panel2);border-color:var(--acc-line)}
.m.all,.m.open.all{border-color:#ffb81c;box-shadow:0 0 0 1px #ffb81c,0 0 14px rgba(255,150,0,.38)}
.m .hd{display:block;width:100%;text-align:left;padding:11px 12px;border-radius:14px}
.tag{font-size:10.5px;color:var(--faint);margin-bottom:5px}
.row{display:flex;align-items:center;gap:10px}
.teams{flex:1;min-width:0}
.tm{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-size:14.5px;font-weight:560;line-height:1.45}
.tm .n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tm .n em{font-style:normal;color:var(--faint);font-weight:500;font-size:11.5px;margin-left:6px}
.tm .p{font-size:12.5px;color:var(--dim);font-weight:500}
.tm.lose{color:var(--dim)}
.bar{display:flex;height:5px;border-radius:5px;overflow:hidden;gap:2px;margin-top:8px}
.bar i{display:block;height:100%}.bar .h{background:var(--grass)}.bar .d{background:#2f443b}.bar .a{background:#7d9388}
.side{width:96px;text-align:right;flex:none}
.score{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1}
.mark{font-size:12px;font-weight:600;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ok{color:var(--grass)}.no{color:var(--miss)}.mut{color:var(--dim)}.fnt{color:var(--faint)}
.pick{display:inline-block;max-width:100%;font-size:12px;font-weight:600;background:var(--pick-bg);border:1px solid var(--pick-bd);border-radius:8px;padding:4px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick.lean{background:transparent;border-color:var(--acc-line);color:var(--dim)}
.bb{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding:8px 10px;border-radius:10px;background:rgba(240,181,74,.1);border:1px solid rgba(240,181,74,.35);font-size:12.5px}
.bb b{color:var(--amber);font-weight:650}
.ex{padding:0 12px 12px}
.ex .in{border-top:1px solid var(--line);padding-top:12px}
.kv,.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.two,.box.f{margin-top:8px}
.box{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:12px;color:var(--dim)}
.box b{display:block;color:var(--ink);font-size:14px;margin-top:2px;font-weight:600}
.box small{display:block;color:var(--faint);font-size:11.5px;margin-top:1px}
.src{border-radius:10px;padding:9px 10px;font-size:12px}
.src.m1{background:rgba(var(--acc-rgb),.1);border:1px solid rgba(var(--acc-rgb),.35)}
.src.s1{background:rgba(127,166,217,.1);border:1px solid rgba(127,166,217,.4)}
.src.s0{border:1px dashed var(--line);color:var(--faint)}
.src small{display:block;color:var(--dim);font-size:11px}
.src b{font-size:19px;letter-spacing:-.02em;display:block}
.src.m1 b{color:var(--grass)}.src.s1 b{color:var(--sm)}
.hits{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.hit{font-size:10.5px;padding:2px 7px;border-radius:99px;font-weight:600}
.hit.y{background:rgba(var(--acc-rgb),.18);color:var(--grass)}.hit.n{background:rgba(224,122,95,.18);color:var(--miss)}
.small{font-size:12px;color:var(--dim);line-height:1.5;margin-top:10px}
.small b{color:var(--ink);font-weight:600}
details.how{margin-top:10px;font-size:12px;color:var(--dim)}
details.how summary{cursor:pointer;color:var(--dim);padding:4px 0}
details.how p{margin-top:6px;line-height:1.5}
details.how h5.hw{margin:14px 0 2px;font-size:12px;font-weight:650;color:var(--dim)}
.empty{margin:22px 18px;padding:22px;border:1px dashed var(--line);border-radius:14px;color:var(--dim);font-size:14px;line-height:1.6;text-align:center}
.st{font-size:11.5px;color:var(--faint);text-align:center;padding:4px 16px 0;min-height:18px}
.st.ready{color:var(--grass)}
.dock{position:-webkit-sticky;position:sticky;bottom:0;flex:none;margin-top:auto;z-index:10;padding:10px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 72%,rgba(11,18,16,0))}
.dock .in{max-width:520px;margin:0 auto}
.dock .btns{display:flex;gap:10px;margin-top:6px}
.btn{flex:1;text-align:center;padding:12px 4px;line-height:1.2;border-radius:12px;font-weight:650;font-size:14px;background:var(--ink);color:#0B1210}
.btn.g{background:transparent;color:var(--ink);border:1px solid var(--acc-line)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.sec{padding:16px 18px 2px;font-size:14px;font-weight:650}
.mbx,.mbl2{margin:6px 18px 0}.mbr{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:13px}.mbr:first-child{border-top:0}
.oddsbar{margin:6px 18px 0;display:flex;align-items:center;gap:12px}.oddsbar .btn{flex:none;width:auto;padding:9px 14px;font-size:13px}.oddsbar small{color:var(--faint);font-size:11.5px;line-height:1.35}
.mbl2 small.pr{color:var(--dim)}small.pr b{color:var(--ink)}small.pr.none{color:var(--faint)}.pv{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:99px;border:1px solid var(--line);margin-left:4px}.pv.val{color:#0B1210;background:var(--grass);border-color:var(--grass)}.pv.no{color:var(--miss);border-color:rgba(224,122,95,.45)}.pv.fair{color:var(--amber);border-color:rgba(240,181,74,.5)}.up{color:var(--grass)}.dn{color:var(--miss)}
.edg{display:inline-block;margin:4px 0 0 8px;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:99px;border:1px solid var(--line);color:var(--faint)}.mbl small+.edg{margin-left:0}.edg.proven{color:#0B1210;background:var(--grass);border-color:var(--grass)}.edg.prom{color:var(--amber);border-color:rgba(240,181,74,.5)}.edg.none{color:var(--miss);border-color:rgba(224,122,95,.45)}
.mbl small,.mbv small{display:block;color:var(--faint);font-size:11.5px}.mbv{text-align:right}.mbv b{font-size:16px}
.mbg{padding:10px 0;border-top:1px solid var(--line)}.mbg:first-child{border-top:0}.mbt{display:flex;justify-content:space-between;gap:10px;font-size:13.5px}.mbg small{display:block;color:var(--faint);font-size:11.5px;margin-top:2px}
.mbs{font-size:11.5px;font-weight:700;color:var(--dim)}.mbs.hit{color:var(--grass)}.mbs.miss{color:#e07a6a}.mbk{font-weight:700;color:var(--dim)}.mbk.best{color:#d9b85c}.mbk.lean{color:var(--grass)}
.sec small{display:block;font-weight:400;color:var(--dim);font-size:12.5px;margin-top:2px}
.pair{padding:12px 18px 2px}
.pair .lab{display:flex;justify-content:space-between;font-size:13px;margin-bottom:7px}
.pair .lab span{color:var(--dim)}
.pb{display:flex;align-items:center;gap:10px;margin-bottom:5px;font-size:12px;color:var(--dim)}
.pb .n{width:78px}.pb .v{width:92px;text-align:right;color:var(--ink)}.pb .v u{text-decoration:none;color:var(--faint);font-weight:400}
.pb .tr{flex:1;height:9px;background:var(--panel2);border-radius:6px;overflow:hidden}
.pb .tr i{display:block;height:100%;border-radius:6px}
.pb.lead .v{font-weight:700}
.banner{margin:14px 18px 0;padding:12px 14px;border:1px dashed var(--line);border-radius:12px;font-size:12.5px;color:var(--dim);line-height:1.55}
.dots{display:flex;gap:4px;margin-top:3px;flex-wrap:wrap}
.dots i{width:14px;height:14px;border-radius:4px;display:block}
.dots .y{background:var(--grass)}.dots .n{background:#3a2a26;border:1px solid #6b3e33}.dots.s .y{background:var(--sm)}
.lst{padding:4px 18px 10px}
.li{padding:11px 0;border-top:1px solid var(--line);font-size:13px}
.li .a{display:flex;justify-content:space-between;gap:10px;font-weight:560;font-size:14px}
.li .b{display:flex;gap:10px;margin-top:5px;font-size:12px;color:var(--dim)}.li .b span{flex:1;min-width:0}
details.old{margin:8px 18px 0}details.old summary{cursor:pointer;font-size:12.5px;color:var(--dim);padding:8px 0}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:10px 18px 0}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center}
.tile .l{font-size:11px;color:var(--dim)}.tile .v{font-size:24px;font-weight:700;letter-spacing:-.02em;margin:3px 0 1px}.tile .f{font-size:11.5px;color:var(--faint)}

/* pick-first game row */
.pk{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.pk b{font-size:20px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.pk b i{font-style:normal;margin-left:6px;color:var(--grass)}
.pk.lean b i{color:var(--amber)}.pk.toss b i{color:var(--dim)}
.cf{font-size:11px;font-weight:650;padding:2px 8px;border-radius:20px;white-space:nowrap}
.cf.s{background:var(--pick-bg);color:var(--acc-hi2);border:1px solid var(--pick-bd)}
.cf.ln{color:var(--amber);border:1px solid #6b5420}
.cf.tu{color:var(--dim);border:1px dashed #45594f}
.vs{font-size:12.5px;color:var(--dim);margin:3px 0 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vs em{font-style:normal;color:var(--faint);font-size:11px}
.nums{display:flex;justify-content:space-between;gap:6px;font-size:10.5px;color:var(--faint);margin-top:4px}
.nums span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt{width:92px;flex:none;text-align:right;display:flex;flex-direction:column;justify-content:center;align-items:flex-end;gap:4px}
.rt .big{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1}
.rt .sm{font-size:11.5px;color:var(--dim)}
.rt .small2{font-size:18px;font-weight:700;letter-spacing:-.02em;line-height:1}
.live{font-size:12px;font-weight:650;color:var(--amber);display:flex;align-items:center;gap:6px}
.live:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--amber)}
.pend{font-size:11.5px;font-weight:600;color:var(--dim);border:1px dashed #45594f;border-radius:8px;padding:4px 7px;text-align:center;line-height:1.25}
.m.pn{border-style:dashed}
.unc{margin:14px 18px 4px;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;font-size:12.5px;color:var(--dim)}
.unc summary{cursor:pointer;font-weight:600}
.unc .u{padding:7px 0 0;border-top:1px solid var(--line);margin-top:8px}
.unc .u small{display:block;color:var(--faint);font-size:11px}
.meter{height:10px;border-radius:10px;background:var(--panel2);overflow:hidden;margin:8px 0 6px}
.meter i{display:block;height:100%;background:var(--grass)}.meter.w i{background:var(--amber)}.meter.x i{background:var(--miss)}
.lg{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.lg small{display:block;color:var(--miss);font-size:11px;margin-top:2px}
.lg .when{color:var(--dim);font-size:12px;white-space:nowrap}
.lg.bad .nm{color:var(--miss)}
.xbtn{display:block;width:100%;margin-top:10px;padding:12px;border-radius:12px;border:1px solid var(--acc-line);font-weight:650;font-size:14px;text-align:center}

.tod{float:right;margin-top:2px;font-size:12px;font-weight:650;padding:5px 11px;border-radius:20px;border:1px solid var(--acc-line);color:var(--ink)}
.why{font-size:11.5px;color:var(--dim);margin-top:6px}
.nt{color:var(--amber)}.you{color:#9ec5e8}
.note textarea{width:100%;min-height:64px;margin-top:6px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:9px 10px;font:inherit;font-size:13px;resize:vertical}
.note .rw{display:flex;gap:8px;margin-top:8px;align-items:center}
.note select{flex:1;min-width:0;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:9px 8px;font:inherit;font-size:13px}
.note .sv{padding:9px 16px;border-radius:10px;background:var(--ink);color:#0B1210;font-weight:650;font-size:13px}
.alert{margin:12px 18px 0;padding:10px 12px;border-radius:12px;background:rgba(240,181,74,.1);border:1px solid rgba(240,181,74,.35);font-size:12.5px;color:var(--ink);line-height:1.5}
.alert b{color:var(--amber)}
.pend.late{color:var(--amber);border-color:#6b5420}
.cal{padding:9px 0;border-top:1px solid var(--line);font-size:13px}
.cal .h2{display:flex;justify-content:space-between;gap:8px}
.cal .tr2{height:6px;border-radius:6px;background:var(--panel2);margin-top:5px;overflow:hidden}.cal .tr2 i{display:block;height:100%}
.cal.few{opacity:.55}
.cal small{display:block;color:var(--faint);font-size:11.5px;margin-top:3px}
.dotm{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--amber);margin-left:5px;vertical-align:middle}

.seg{display:flex;gap:6px;padding:12px 18px 0}
.seg button{font-size:12.5px;padding:7px 12px;border-radius:99px;border:1px solid var(--line);color:var(--dim)}
.seg button.on{background:var(--panel2);color:var(--ink);border-color:var(--acc-line)}
.bd{margin:12px 18px 0;border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden}
.bd .r{display:grid;grid-template-columns:84px repeat(2,minmax(0,1fr));gap:6px;padding:13px 12px;border-top:1px solid var(--line);align-items:center}
.bd .r.h{border-top:0;padding:10px 12px 8px;font-size:11.5px;color:var(--dim);align-items:end}
.bd .r.h b{display:block;color:var(--ink);font-size:13px;font-weight:650}.bd .r.h .fb b{color:var(--sm)}
.bd .lab{font-size:13px;font-weight:600}.bd .lab small{display:block;font-weight:400;font-size:11px;color:var(--faint);margin-top:1px}
.bd .c .p{font-size:21px;font-weight:700;letter-spacing:-.02em;color:var(--dim)}
.bd .c .f{font-size:11.5px;color:var(--faint);margin-top:1px}
.bd .c .tr{height:4px;border-radius:4px;background:#1c2b25;margin-top:6px;overflow:hidden}.bd .c .tr i{display:block;height:100%;background:#4a6157}
.bd .c.best .p{color:var(--grass)}.bd .c.best .tr i{background:var(--grass)}
.bd .r.bs{grid-template-columns:84px minmax(0,1fr) 2fr;background:rgba(255,255,255,.02)}.bd .r.bs .lab small{display:block;font-size:10.5px;color:var(--faint);margin-top:2px;line-height:1.3}.bd .r.bs .c .p{color:var(--dim);font-size:18px}.bd .r.bs .bsn{font-size:11px;color:var(--faint)}
.bd .r.br{font-size:12px;color:var(--dim);padding:10px 12px}.bd .r.br b{color:var(--ink);font-weight:600}.bd .r.br b.best{color:var(--grass)}
.bdn{margin:10px 18px 0;font-size:11.5px;color:var(--faint);line-height:1.45}
.tri{display:grid;grid-template-columns:84px repeat(2,minmax(0,1fr));gap:4px 6px;margin-top:7px;font-size:12px;color:var(--dim)}
.tri span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tri .hh{color:var(--faint)}
.cand{border-color:#5b4a22}.cand small{display:block;color:var(--amber);font-size:11.5px;margin-bottom:2px}
.cr{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink);margin-top:5px}.cr span{flex:1;min-width:0;overflow-wrap:anywhere}
.cr button{flex:none;padding:5px 11px;border-radius:99px;border:1px solid var(--acc-line);font-size:12px;font-weight:650}.cr button.no{padding:5px 8px;color:var(--dim)}
#hub-bar{position:-webkit-sticky;position:sticky;top:0;flex:none;z-index:1000;height:56px;display:flex;align-items:center;justify-content:center;padding:0 16px;background:#0f1612;border-bottom:1px solid var(--line)}
#hub-bar .sw{display:flex;gap:4px;background:var(--panel2);border-radius:999px;padding:4px;width:100%;max-width:360px}
#hub-bar a{flex:1;text-align:center;text-decoration:none;border-radius:999px;padding:8px 12px;font-weight:700;font-size:14px;color:var(--dim)}
#hub-bar a.on{background:var(--grass);color:#0B1210}
body{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}.wrap{flex:1 0 auto;width:100%}

.m.x{background:linear-gradient(180deg,#15211c 0%,#111b17 100%)}
.xh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:9px;font-size:10.5px;color:var(--faint)}
.xh .cfx{font-size:11px;font-weight:650;padding:3px 9px;border-radius:99px;border:1px solid var(--acc-line);color:var(--dim)}
.xh .cfx.s{background:rgba(57,255,136,.14);border-color:#39ff88;color:#39ff88;font-weight:750;box-shadow:0 0 10px rgba(57,255,136,.55),inset 0 0 6px rgba(57,255,136,.2);text-shadow:0 0 6px rgba(57,255,136,.6)}.xh .cfx.ln{color:var(--amber);border-color:rgba(240,181,74,.4)}
.xt{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center}
.xk{display:flex;align-items:center;gap:8px;min-width:0}.xk.r{flex-direction:row-reverse;text-align:right}
.xk div{min-width:0}.xk b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:14px;font-weight:700;line-height:1.15;overflow:hidden;white-space:normal;word-break:break-word}
.xk small{display:block;font-size:11px;color:var(--faint);margin-top:1px}
.xc{position:relative;flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:10.5px;font-weight:800;color:#fff;background:radial-gradient(circle at 30% 25%,hsl(var(--h) 55% 58%),hsl(var(--h) 55% 34%));box-shadow:0 0 0 2px var(--panel),0 0 0 3px hsl(var(--h) 50% 45% / .6)}
.xm{text-align:center;min-width:40px;font-size:11.5px;color:var(--faint);font-weight:600;line-height:1.25}
.xm.big{font-size:21px;color:var(--ink);font-weight:750;letter-spacing:-.02em;line-height:1}.xm.big small{display:block;font-size:10.5px;letter-spacing:0;margin-top:4px}
.xm .live{color:var(--miss);font-weight:700}
.xp{margin:11px 0 3px}
.xp .n{display:flex;justify-content:space-between;font-size:11.5px;color:var(--faint);margin-bottom:4px}.xp .n b{font-size:15px;color:var(--ink);font-weight:700}.xp .n .dm b{color:var(--faint);font-weight:600}.xp .n .mid{color:var(--faint)}.xp .n .mid b{font-size:12.5px;font-weight:600}
.xp .b{display:flex;gap:3px;height:8px}.xp .b i{display:block;border-radius:99px;opacity:.4}
.xp .b i.f{opacity:1;box-shadow:0 0 10px rgba(var(--acc-rgb),.45)}
.xp .b .h{background:var(--grass)}.xp .b .d{background:#6b7f75}.xp .b .a{background:#7FA6D9}.xp .b .a.f{box-shadow:0 0 10px rgba(127,166,217,.45)}
.xag{display:inline-flex;align-items:center;gap:6px;margin:10px 0 8px;font-size:11.5px;font-weight:650;padding:4px 9px;border-radius:99px;background:rgba(240,181,74,.12);color:var(--amber)}
.xag.y{background:rgba(var(--acc-rgb),.16);color:var(--acc-hi)}.xag:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.xl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
.xl.n2{grid-template-columns:repeat(2,minmax(0,1fr))}.xl.n4{grid-template-columns:repeat(4,minmax(0,1fr))}
.xq{background:#17241f;border-radius:10px;padding:6px 7px 7px;min-width:0}
.xq .l{font-size:10px;color:var(--faint);font-weight:650;margin-bottom:3px}
.xq b{display:block;font-size:13.5px;font-weight:750;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xq small{display:block;font-size:11px;color:var(--dim);margin-top:1px;white-space:nowrap}.xq small.sc{color:var(--faint);font-size:10.5px}.xq small.sc.xg{color:var(--dim)}
.xq .g{margin-top:6px;padding-top:5px;border-top:1px solid rgba(255,255,255,.07);font-size:11px;color:var(--faint);line-height:1.55}.xq .g span{display:flex;justify-content:space-between;gap:2px;white-space:nowrap}.xq .g b{display:inline;font-size:11.5px;font-weight:650;color:var(--dim)}.xq .g b.hi{color:var(--grass)}
.xags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 8px}.xags .xag{margin:0}
.xag.s{background:var(--grass);color:#07150d;font-weight:750}.xag.s:before{content:"✓";width:auto;height:auto;background:none;font-weight:800}
.xag.gl{background:rgba(127,166,217,.15);color:#b6cdf0}.xag.mv{background:rgba(201,168,255,.14);color:#d9c4ff}
.mvg{margin:10px 18px 0;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel);font-size:12px;color:var(--dim)}
.mvg .mvt{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:2px}.mvg .mvt b{color:var(--ink);font-size:13.5px;font-weight:650}
.mvg .cs{font-size:11px;font-weight:650;padding:2px 8px;border-radius:99px;white-space:nowrap}.cs.ok{background:rgba(var(--acc-rgb),.16);color:var(--acc-hi)}.cs.pend{background:rgba(255,255,255,.06);color:var(--dim)}.cs.due{background:rgba(240,181,74,.14);color:var(--amber)}.cs.miss{background:rgba(255,157,132,.12);color:#ff9d84}
.mvg .mvf{color:#d9c4ff;font-weight:600}.mvg .mvn{display:block;margin-top:4px;color:var(--faint);font-size:10.5px}
.mvx{width:100%;border-collapse:collapse;margin-top:6px;font-size:12px}.mvx th{font-size:10.5px;color:var(--faint);font-weight:650;text-align:right;padding:2px 4px}.mvx td{text-align:right;padding:4px;border-top:1px solid var(--line);color:var(--ink)}
.mvx td.n,.mvx th:first-child{text-align:left}.mvx td.bg b{color:#d9c4ff}.mvx tr.won td.n{color:var(--grass);font-weight:650}
.mvb{margin:8px 18px 0;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:rgba(201,168,255,.05);font-size:12px;color:var(--dim)}.mvb summary{cursor:pointer;color:var(--ink);font-weight:650;font-size:12.5px}
.mvb .mr{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--line)}.mvb .mr:first-of-type{border-top:0}.mvb .mr b{color:var(--ink);font-weight:600}.mvb .mr em{font-style:normal;color:#d9c4ff;font-weight:650;white-space:nowrap}
.xc.win{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--grass),0 0 14px rgba(var(--acc-rgb),.65)}
.xp .n b.cg{color:var(--grass)}
.scd{margin-top:8px;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.03);border:1px solid var(--line);font-size:12px;color:var(--dim)}
.scd .sh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:5px}.scd .sh b{color:var(--ink);font-size:12.5px;font-weight:650}.scd .sh small{color:var(--faint);font-size:10.5px;text-align:right}
.scd .sr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;margin-top:4px}.scd .sr span{background:rgba(255,255,255,.03);border-radius:7px;padding:4px 6px;min-width:0}
.scd .sr span b{display:block;color:var(--ink);font-size:13.5px;font-weight:650}.scd .sr span i{font-style:normal;font-size:10.5px;color:var(--faint)}.scd .sr.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.scd em{font-style:normal}.scd .ss{margin-top:5px;font-size:11.5px}.scd .ss b{color:var(--ink);font-weight:600}
.xq.sm b{color:var(--sm)}.xq.v5 .l{color:#c9a8ff}.xq.none{opacity:.5}.xq.none b{font-size:11.5px;font-weight:500;color:var(--faint)}
.xq .ck{font-size:11px;margin-left:3px}
.xb{display:flex;justify-content:space-between;align-items:center;margin-top:9px;padding:7px 10px;border-radius:10px;background:rgba(240,181,74,.1);border:1px solid rgba(240,181,74,.35);font-size:12.5px}.xb b{color:var(--amber);font-weight:650}

.sb{width:100%;border-collapse:separate;border-spacing:0 5px;margin-top:6px}
.sb th{font-size:10px;color:var(--faint);font-weight:650;text-align:center;padding:0 1px 2px}
.sb th.g{border-bottom:1px solid var(--line);padding-bottom:3px;color:var(--dim)}
.sb td.n{font-size:12.5px;font-weight:650;line-height:1.2;padding-right:6px;color:var(--ink)}
.sb td.n small{display:block;font-weight:500;font-size:10px;color:var(--faint);margin-top:1px}
.cl{display:block;border-radius:9px;padding:5px 1px 4px;text-align:center;font-size:11.5px;font-weight:650;line-height:1.15;border:1px solid transparent;background:none;color:inherit;width:100%}
.cl small{display:block;font-size:9.5px;font-weight:500;opacity:.8;margin-top:1px}
.cl.ok{background:rgba(var(--acc-rgb),.13);color:var(--acc-hi);border-color:rgba(var(--acc-rgb),.35)}
.cl.old{background:rgba(240,181,74,.12);color:var(--amber);border-color:rgba(240,181,74,.4)}
.cl.bad{background:rgba(224,122,95,.14);color:#ff9d84;border-color:rgba(224,122,95,.5)}
.cl.none{color:var(--faint);border:1px dashed var(--line)}
.cl.na{color:#3e4f47;border:0}
.sbl{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--dim);margin:10px 0 0}
.sbl i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.rc{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:13px}
.rc small{display:block;color:var(--miss);font-size:11px;margin-top:2px}
.rc button{flex:none;padding:7px 12px;border-radius:10px;border:1px solid var(--acc-line);font-size:12.5px;font-weight:650}
.cl.bad{cursor:pointer}.cl.bad:active{transform:scale(.97)}
.mo{position:fixed;inset:0;z-index:2000;background:rgba(5,9,7,.72);display:flex;align-items:flex-end;justify-content:center;padding:16px}
.mp{width:100%;max-width:420px;background:linear-gradient(var(--panel2),var(--panel2)),var(--bg);border:1px solid var(--acc-line);border-radius:18px;padding:18px 18px 16px;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.mp b{font-size:16px}.mp p{font-size:13px;color:var(--dim);line-height:1.5;margin:6px 0 12px}
.mr div{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}.mr em{font-style:normal;color:var(--faint);font-size:12.5px;text-align:right}
#fbm .mr{max-height:52vh;overflow:auto}
.mr .run em{color:var(--amber)}.mr .ok em{color:var(--grass)}.mr .bad em{color:#ff9d84}
.mb{display:flex;gap:10px;margin-top:14px}.mb button{flex:1;padding:12px;border-radius:12px;font-weight:650;font-size:14px;border:1px solid var(--acc-line)}
.mb .mgo{background:var(--grass);border-color:var(--grass);color:#06130c}.mb button:disabled{opacity:.6}
.sb td.n.pt{border-left:3px solid var(--grass);padding-left:8px;border-radius:8px 0 0 8px;background:linear-gradient(90deg,rgba(var(--acc-rgb),.16),rgba(var(--acc-rgb),0))}
.sb td.n.pt small{color:var(--acc-hi);font-weight:600}
.sb tr.off td{opacity:.42}
.sb tr.sep td{padding:8px 0 2px;font-size:10.5px;color:var(--faint);font-weight:650;opacity:1}
/* leagues in a list down the left: a slim code strip on phones, full names on wide screens */
.bdy{display:grid;grid-template-columns:54px minmax(0,1fr);gap:8px;align-items:start;padding:0 10px 0 8px}
.bdy .chips{display:none}
.lsb{position:sticky;top:8px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:5px 3px;margin-top:12px}
.lsb .it{display:flex;flex-direction:column;align-items:center;gap:1px;width:100%;padding:7px 0;border-radius:10px;color:var(--dim);font-size:11px;font-weight:650;letter-spacing:.02em}
.lsb .it i{font-style:normal;font-size:10.5px;color:var(--faint);font-weight:500}
.lsb .it .nm{display:none}
.lsb .it.on{background:var(--panel2);color:var(--ink);box-shadow:inset 3px 0 0 var(--grass)}
.lsb .it.amber{color:var(--amber)}
.lsb .it.off{opacity:.35;cursor:default}
.lsb .lsp{height:1px;background:var(--line);margin:5px 6px;font-size:0;padding:0}
.bdy .xl.n4{grid-template-columns:repeat(2,minmax(0,1fr))}
.bdy .rail{margin:10px 0 0;padding-left:0}.bdy .rail:before,.bdy .slot:before{display:none}
.bdy .slot .t{position:static;width:auto;text-align:left;margin:0 0 4px 4px;font-size:11.5px}.bdy .slot .t small{display:inline;margin-left:3px}
@media(min-width:900px){
  .wrap:has(.bdy){max-width:960px}
  .bdy{grid-template-columns:210px minmax(0,1fr);gap:18px;padding:0 18px}
  .bdy .xl.n4{grid-template-columns:repeat(4,minmax(0,1fr))}
  .lsb{top:64px;padding:8px}
  .lsb .it{flex-direction:row;justify-content:space-between;text-align:left;padding:8px 11px;font-size:13.5px;font-weight:500;letter-spacing:0}
  .lsb .it .cd{display:none}.lsb .it .nm{display:inline}
  .lsb .it:hover{background:rgba(255,255,255,.03)}
  .lsb .lsp{height:auto;background:none;margin:0;padding:10px 11px 3px;font-size:11px;color:var(--faint);font-weight:650}
  .bdy .rail{margin:10px 0 0 0;padding-left:64px}.bdy .rail:before,.bdy .slot:before{display:block}
  .bdy .slot .t{position:absolute;left:-64px;width:44px;text-align:right;margin:0;font-size:12px}.bdy .slot .t small{display:block;margin:0}
}

.tpk{margin-top:9px;padding:8px 10px;border-radius:10px;background:rgba(var(--acc-rgb),.09);border:1px solid rgba(var(--acc-rgb),.35)}
.tpk .tl{font-size:10.5px;font-weight:700;color:var(--grass);margin-bottom:4px}
.tpk .tr{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:3px 0;font-size:13px}
.tpk .tr b{font-weight:700;color:var(--ink);min-width:0}
.tpk .tm{display:flex;align-items:baseline;gap:5px;white-space:nowrap;font-size:12px;color:var(--faint)}
.tpk .tm u{text-decoration:none;font-size:10px;margin-left:4px}.tpk .tm span{color:var(--dim);font-weight:600}.tpk .tm span.hi{color:var(--grass)}
.tpk .tr:first-of-type b{color:var(--acc-hi2)}

.tseg{display:flex;gap:6px;margin:10px 0 4px 4px;flex-wrap:wrap}
.tseg button{flex:1 1 0;min-width:0;padding:9px 8px;border-radius:11px;border:1px solid var(--line);background:var(--panel);color:var(--dim);font:inherit;font-size:13px;font-weight:650;cursor:pointer;text-align:center}
.tseg button i{font-style:normal;font-weight:500;color:var(--faint);margin-left:5px;font-size:12px}
.tseg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}.tseg button.on i{color:inherit;opacity:.65}
.tseg .tall{display:none}
.tcols{display:grid;gap:12px;margin:8px 0 0 4px}
.tcol{min-width:0}
.tcol h3{margin:2px 2px 6px;font-size:12px;font-weight:700;color:var(--grass);display:flex;justify-content:space-between;align-items:baseline}
.tcol h3 small{font-weight:500;color:var(--faint);font-size:11px}
.tcol[hidden]{display:none}
.trw{display:flex;flex-direction:column;border-radius:12px;background:var(--panel);border:1px solid var(--line);margin-bottom:6px;overflow:hidden}
.tr2{display:grid;grid-template-columns:48px 1fr auto;gap:2px 9px;align-items:center;width:100%;text-align:left;padding:9px 11px;border:0;background:none;color:inherit;font:inherit;cursor:pointer}
.tr2 .pp{font-size:20px;font-weight:800;color:var(--grass);line-height:1}.tr2 .pp small{font-size:11px;font-weight:700;margin-left:1px}
.tr2 .tx{min-width:0}.tr2 .tx b{display:block;font-size:13.5px;color:var(--ink);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr2 .tx small{display:block;font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tr2 .tx small.mt{color:var(--faint);font-size:11px}
.tr2 .ag{font-size:11px;color:var(--dim);white-space:nowrap;text-align:right;line-height:1.35}.tr2 .ag u{text-decoration:none;color:var(--faint);margin-right:3px}.tr2 .ag .ok{color:var(--grass);font-weight:700}.tr2 .ag .no{color:#e0786f;font-weight:700}
.trw.low .pp{color:var(--dim)}.trw.low{opacity:.78}.trw.top1{border-color:rgba(var(--acc-rgb),.5);background:rgba(var(--acc-rgb),.07)}
.tmore{display:block;width:100%;margin:2px 0 8px;padding:8px;border-radius:10px;border:1px dashed var(--line);background:none;color:var(--dim);font:inherit;font-size:12px;cursor:pointer}
.tnone{padding:12px;color:var(--faint);font-size:12.5px;border:1px dashed var(--line);border-radius:12px}
@media (min-width:900px){
  .tseg{max-width:560px}.tseg .tall{display:block}
  .tcols.all{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:899px){.tcols.all .tcol:not(:first-child){display:none}.tseg .tall{display:none}}

.asg{padding:10px 11px 8px}.asg .ah{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.asg .ah b{font-size:14px;color:var(--ink)}.asg .ah small{color:var(--faint);font-size:11.5px;white-space:nowrap}
.asg .src2{margin-top:8px;padding-top:7px;border-top:1px solid var(--line)}
.asg .sl{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--dim)}.asg .sl b{color:var(--ink);font-size:12px;min-width:68px}
.asg .pl{padding:2px 8px;border-radius:99px;border:1px solid var(--line);font-size:11px;font-weight:650;color:var(--faint)}.asg .pl.y{color:var(--grass);border-color:rgba(var(--acc-rgb),.45)}.asg .pl.w{color:var(--amber);border-color:#5b4a22}
.asg .why{display:block;font-size:11.5px;color:var(--faint);margin-top:3px}
.asg .box.cand{margin:6px 0 0}
.asg.has{border-color:#5b4a22}
.asgd{margin:14px 0 6px 4px;font-size:12px;font-weight:700;color:var(--grass)}

.zbox{margin:12px 0 0 4px;padding:12px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.zbox h3{margin:0 0 8px;font-size:12px;font-weight:700;color:var(--grass)}
.zbox .zrow{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.zbox .zch{padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--dim);font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.zbox .zch.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.zbox input[type=text]{width:100%;box-sizing:border-box;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:14px}
.xc img{position:absolute;left:4px;top:4px;width:calc(100% - 8px);height:calc(100% - 8px);object-fit:contain}.xc.lg{background:#e9eef7;color:transparent}
/* Board as a sideways grid: four games per column, swipe for more, tap one for its card below */
.sgrid{display:grid;grid-auto-flow:column;grid-template-rows:repeat(4,auto);grid-auto-columns:min(240px,66%);gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding:14px 18px 6px;scroll-padding-left:18px;-webkit-overflow-scrolling:touch;scrollbar-width:none}.sgrid::-webkit-scrollbar{display:none}
.sgt{scroll-snap-align:start;text-align:left;display:block;width:100%;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.sgt.on{border-color:var(--grass);box-shadow:0 0 0 1px var(--grass),0 0 14px rgba(var(--acc-rgb),.3)}

// Status of the closing price: captured (the lineup read, 30-20 minutes before kickoff), missed (locked with no lineup read, so the last

  if (ko - Date.now() <= 30 * 60000) return { k: 'due', t: 'Lineup read due now' };
  return { k: 'pend', t: `Pending · closing read ~${tmCT(new Date(ko - 30 * 60000).toISOString())}` };
}

function v5View(t) {

  const table = (cols, names) => {

    const row = (label, key, low, fmt) => { const b = best(key, low); return `<tr><td class="n">${label}</td>${cols.map((c, i) => `<td class="${b[i] ? 'bst' : ''}"><b>${fmt(c)}</b></td>`).join('')}</tr>`; };
    return `<table class="lgt"><tr><th></th>${names.map(n => `<th>${n}</th>`).join('')}</tr>${row('Winner', 'outcome', false, c => pc(c.outcome, c.n))}${row('Over/under', 'ou', false, c => pc(c.ou, c.n))}${row('Both score', 'btts', false, c => pc(c.btts, c.n))}${row('RPS', 'rps', true, c => f(c.rps))}${row('Log loss', 'll', true, c => f(c.ll))}</table>`;
  };

/* ---------- Analyze / Update: one league at a time ---------- */
let failed = [];
async function syncUntilCaughtUp(slug, name, i, n) {
  for (let k = 0; k < 10; k++) {
    say(`Loading ${name} results (${i}/${n})…`);
    const r = await post('/api/sync?league=' + slug);
    if (r.error) { failed.push(name); return; } // a league ESPN won't load must not stop the whole run
    if (r.caughtUp) return;
  }
}
async function runAll(kind) {
  const buttons = ['#btn-analyze', '#btn-left', '#btn-grade'].map($); buttons.forEach(b => b.disabled = true);
  const date = S.date; let done = 0, skipped = 0, graded = 0, smFound = 0; failed = [];
  try {
    let list = cfg.leagues;
    if (kind === 'leftover') {
      const need = new Set(day.cards.filter(c => !c.v2).map(c => c.league)), seen = day.analyzed || {};
      list = cfg.leagues.filter(l => need.has(l.slug) || !seen[l.slug]);
      if (!list.length) { say('Every game for this day already has a prediction.', true); buttons.forEach(b => b.disabled = false); return; }
    }
    for (let i = 0; i < list.length; i++) {
      const lg = list[i], at = `${i + 1}/${list.length}`;
      if (kind !== 'grade') {
        const lo = kind === 'leftover' ? '&leftover=1' : '';
        say(`Analyzing ${lg.name} (${at})…`);
        let r = await post(`/api/analyze?league=${lg.slug}&date=${date}${lo}`);
        if (r.error) throw new Error(r.error);
        if (r.needsSync) {
          for (const slug of r.needsSync) { const m = cfg.leagues.find(l => l.slug === slug); await syncUntilCaughtUp(slug, m ? m.name : slug, at.split('/')[0], list.length); }
          r = await post(`/api/analyze?league=${lg.slug}&date=${date}&partial=1${lo}`);
        }
        if (r.feedError) failed.push(lg.name + ' (games feed)');
        done += r.cards || 0; skipped += r.skipped || 0;
        if (r.cards) { try { say(`SportsMole predictions: ${lg.name} (${at})…`); const s = await post(`/api/sm?league=${lg.slug}&date=${date}`); smFound += s.found || 0; } catch (e) { /* optional */ } }
      } else {
        say(`Checking ${lg.name} results (${at})…`);
        const r = await post(`/api/grade?league=${lg.slug}&date=${date}`);
        if (r.error) throw new Error(r.error);
        graded += r.graded || 0;
      }
    }
    delete counts[date]; tally = null;
    await loadDay();
    say(kind !== 'grade' ? `Done: ${done} matches${kind === 'leftover' ? ' checked' : ''}${skipped ? ` (${skipped} skipped, not enough form data)` : ''}.${smFound ? ` SportsMole predictions found: ${smFound}.` : ''}${failed.length ? ` Couldn't load: ${[...new Set(failed)].join(', ')}.` : ''}` : `Graded ${graded} match${graded === 1 ? '' : 'es'}.`, true);
  } catch (err) { say(err.message); }
  buttons.forEach(b => b.disabled = false);
}

  if (t.dataset.badd) { const l = curLeg(); if (!l) return; if (BS.slip.length >= 12) { BS.msg = 'A bet can have up to 12 picks.'; return render(); } BS.slip.push(l); BS.sel = null; BS.cur = null; BS.msg = 'Added. Pick another market on this game, or change game.'; return bAnalyzeSlip(); }
  if (t.dataset.brm) { BS.slip.splice(Number(t.dataset.brm), 1); return bAnalyzeSlip(); }
  if (t.dataset.bclear) { BS.slip = []; BS.an = null; BS.msg = ''; return render(); }
  if (t.dataset.btrack) {
    BS.busy = true; render();
    try { const r = await bpost('/api/bets', { legs: BS.slip }); if (r.error) throw new Error(r.error); BS.slip = []; BS.an = null; BS.msg = 'Tracked. It will be marked hit or missed after the games finish and are graded.'; const l = await api('/api/bets'); BS.bets = l.items || []; BS.sum = l.summary || null; }
    catch (er) { BS.msg = er.message; }
    BS.busy = false; return render();
  }
  if (t.dataset.bvoid || t.dataset.bdel) {
    const id = t.dataset.bvoid || t.dataset.bdel, del = !!t.dataset.bdel;
    if (del && BS.del !== id) { BS.del = id; return render(); }
    BS.del = null;
    try { const r = await bpost(del ? '/api/bets/delete' : '/api/bets/void', { id }); if (r.error) throw new Error(r.error); const l = await api('/api/bets'); BS.bets = l.items || []; BS.sum = l.summary || null; BS.msg = del ? 'Removed.' : 'Marked void.'; }
    catch (er) { BS.msg = er.message; }
    return render();
  }
  if (t.dataset.af) { S.af = t.dataset.af; return render(); }
  if (t.dataset.tm) { S.tm = t.dataset.tm; keepFilter(); return render(); }
  if (t.dataset.more) { S.more[t.dataset.more] = !S.more[t.dataset.more]; return render(); }
  if (t.dataset.ssel) { // tap a game: its card opens below and the page scrolls to it; tap it again to close and go back where you were
    const g = document.getElementById('sgrid'), x = g ? g.scrollLeft : 0, closing = S.sel === t.dataset.ssel;
    if (closing) S.sel = null; else { if (!S.sel) S.back = window.scrollY; S.sel = t.dataset.ssel; }
    S.open = closing ? null : S.sel; render(); const n = document.getElementById('sgrid'); if (n) n.scrollLeft = x;
    requestAnimationFrame(() => { if (closing) { window.scrollTo({ top: S.back || 0, behavior: 'smooth' }); S.back = null; } else { const d = document.getElementById('sdt'); if (d) d.scrollIntoView({ behavior: 'smooth', block: 'start' }); } });
    return; }
  if (t.dataset.fin) { S.fin = !S.fin; return render(); }
  if (t.dataset.rb) { S.rb = t.dataset.rb; return render(); }
  if (t.dataset.date) { S.tab = 'board'; saveView(); return loadDay(t.dataset.date); }
  if (t.dataset.tab) { S.tab = t.dataset.tab; S.open = null; saveView();
    if (S.tab === 'status') { pushCheck(); stat = null; render(); try { stat = await api('/api/status'); } catch (er) { say(er.message); } } else if (S.tab === 'assign') { asg = null; render(); await loadAssign(); } else if (S.tab === 'bets') { BS.games = null; render(); await loadBets(); } else if (S.tab === 'analyst') { render(); await loadAnalyst(); } else if (S.tab !== 'board') { render(); await ensureTally(); } return render(); }
  if (t.dataset.league) { S.league = t.dataset.league; S.top = false; S.open = null; saveView(); return render(); }
  if (t.dataset.top) { S.top = !S.top; if (S.top) S.league = 'all'; S.open = null; return render(); }
  if (t.classList.contains('hd') && t.closest('#sdt')) { // tapping the opened game's header closes it and returns to the grid
    const g = document.getElementById('sgrid'), x = g ? g.scrollLeft : 0; S.sel = null; S.open = null; render();
    const n = document.getElementById('sgrid'); if (n) n.scrollLeft = x;
    requestAnimationFrame(() => { window.scrollTo({ top: S.back || 0, behavior: 'smooth' }); S.back = null; });
    return; }
  if (t.classList.contains('hd')) { S.open = S.open === t.dataset.id ? null : t.dataset.id; return render(); }
});
$('#btn-analyze').onclick = () => {
  if (day.cards.some(c => c.v2) && !confirm('This redoes every game for this day, including ones that already have a prediction, and uses up more of your free daily saves.\n\nTo fill in only the missing games, use Analyze leftover games instead.\n\nRedo the whole day?')) return;
  runAll('analyze');
};
$('#btn-left').onclick = () => runAll('leftover');
$('#btn-grade').onclick = () => runAll('grade');

(async () => {
  cfg = await api('/api/config'); S.date = cfg.today; await loadDay();
  if (S.tab === 'results' || S.tab === 'mbets') { await ensureTally(); render(); }
  try { stat = await api('/api/status'); if (!document.activeElement || document.activeElement.tagName !== 'TEXTAREA') render(); } catch (e) { /* alerts are optional */ }
})();
try { if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js'); } catch (e) { /* installing is optional */ }
</script>
