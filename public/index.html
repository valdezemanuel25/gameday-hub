<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0B1210">
<title>Game Day Hub</title>
<style>
:root{--bg:#0B1210;--panel:#121C18;--panel2:#17241F;--line:#22332C;--ink:#E8EEE4;--dim:#8FA399;--faint:#5F746B;--grass:#58B27A;--sm:#7FA6D9;--amber:#F0B54A;--miss:#E07A5F}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;font-feature-settings:"tnum" 1;-webkit-font-smoothing:antialiased;padding-bottom:120px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{max-width:520px;margin:0 auto}
.top{padding:22px 18px 6px}
.title{font-size:26px;font-weight:700;letter-spacing:-.02em}
.sub{font-size:13px;color:var(--dim);margin-top:2px}
.days{display:flex;gap:8px;margin:16px 0 2px}
.day{flex:1;text-align:center;padding:8px 0 7px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:12px;color:var(--dim)}
.day b{display:block;font-size:17px;color:var(--ink);font-weight:650;margin:1px 0}
.day small{font-size:10.5px;color:var(--faint)}
.day.on{background:var(--ink);border-color:var(--ink);color:#3a4a42}.day.on b{color:#0B1210}.day.on small{color:#53665d}
.day:focus-visible,.chip:focus-visible,.tab:focus-visible,.btn:focus-visible,.m .hd:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.tabs{display:flex;gap:6px;padding:0 18px;margin-top:10px;border-bottom:1px solid var(--line)}
.tab{padding:9px 6px;font-size:13.5px;color:var(--dim);margin-right:10px;border-bottom:2px solid transparent}
.tab.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
.chips{display:flex;gap:8px;padding:12px 18px 6px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;font-size:12.5px;padding:7px 12px;border-radius:99px;border:1px solid var(--line);color:var(--dim)}
.chip.on{background:var(--panel2);color:var(--ink);border-color:#35514a}
.chip i{font-style:normal;color:var(--faint);margin-left:5px}
.chip.amber{border-color:#5b4a22;color:var(--amber)}
.chip.amber.on{background:rgba(240,181,74,.12)}
.rail{position:relative;margin:10px 18px 0;padding-left:64px}
.rail:before{content:"";position:absolute;left:52px;top:0;bottom:0;width:2px;background:var(--line);border-radius:2px}
.slot{position:relative;margin-bottom:12px}
.slot .t{position:absolute;left:-64px;top:2px;width:44px;text-align:right;font-size:12px;font-weight:600;color:var(--dim)}
.slot .t small{display:block;font-weight:500;color:var(--faint);font-size:10.5px}
.slot:before{content:"";position:absolute;left:-16px;top:7px;width:9px;height:9px;border-radius:50%;background:var(--bg);border:2px solid #35514a}
.slot.done:before{background:#35514a}
.now{position:relative;margin:2px 0 14px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--amber);font-weight:600}
.now:before{content:"";position:absolute;left:-17px;top:50%;width:11px;height:11px;margin-top:-5px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 4px rgba(240,181,74,.18)}
.now:after{content:"";flex:1;height:1px;background:rgba(240,181,74,.35)}
.m{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:8px}
.m.open{background:var(--panel2);border-color:#35514a}
.m .hd{display:block;width:100%;text-align:left;padding:11px 12px;border-radius:14px}
.tag{font-size:10.5px;color:var(--faint);margin-bottom:5px}
.row{display:flex;align-items:center;gap:10px}
.teams{flex:1;min-width:0}
.tm{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-size:14.5px;font-weight:560;line-height:1.45}
.tm .n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tm .n em{font-style:normal;color:var(--faint);font-weight:500;font-size:11.5px;margin-left:6px}
.tm .p{font-size:12.5px;color:var(--dim);font-weight:500}
.tm.lose{color:var(--dim)}
.bar{display:flex;height:5px;border-radius:5px;overflow:hidden;gap:2px;margin-top:8px}
.bar i{display:block;height:100%}.bar .h{background:var(--grass)}.bar .d{background:#2f443b}.bar .a{background:#7d9388}
.side{width:96px;text-align:right;flex:none}
.score{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1}
.mark{font-size:12px;font-weight:600;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ok{color:var(--grass)}.no{color:var(--miss)}.mut{color:var(--dim)}.fnt{color:var(--faint)}
.pick{display:inline-block;max-width:100%;font-size:12px;font-weight:600;background:#1e3a2d;border:1px solid #2c5a42;border-radius:8px;padding:4px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick.lean{background:transparent;border-color:#35514a;color:var(--dim)}
.bb{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding:8px 10px;border-radius:10px;background:rgba(240,181,74,.1);border:1px solid rgba(240,181,74,.35);font-size:12.5px}
.bb b{color:var(--amber);font-weight:650}
.ex{padding:0 12px 12px}
.ex .in{border-top:1px solid var(--line);padding-top:12px}
.kv,.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.two,.box.f{margin-top:8px}
.box{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:12px;color:var(--dim)}
.box b{display:block;color:var(--ink);font-size:14px;margin-top:2px;font-weight:600}
.box small{display:block;color:var(--faint);font-size:11.5px;margin-top:1px}
.src{border-radius:10px;padding:9px 10px;font-size:12px}
.src.m1{background:rgba(88,178,122,.1);border:1px solid rgba(88,178,122,.35)}
.src.s1{background:rgba(127,166,217,.1);border:1px solid rgba(127,166,217,.4)}
.src.s0{border:1px dashed var(--line);color:var(--faint)}
.src small{display:block;color:var(--dim);font-size:11px}
.src b{font-size:19px;letter-spacing:-.02em;display:block}
.src.m1 b{color:var(--grass)}.src.s1 b{color:var(--sm)}
.hits{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.hit{font-size:10.5px;padding:2px 7px;border-radius:99px;font-weight:600}
.hit.y{background:rgba(88,178,122,.18);color:var(--grass)}.hit.n{background:rgba(224,122,95,.18);color:var(--miss)}
.small{font-size:12px;color:var(--dim);line-height:1.5;margin-top:10px}
.small b{color:var(--ink);font-weight:600}
details.how{margin-top:10px;font-size:12px;color:var(--dim)}
details.how summary{cursor:pointer;color:var(--dim);padding:4px 0}
details.how p{margin-top:6px;line-height:1.5}
.empty{margin:22px 18px;padding:22px;border:1px dashed var(--line);border-radius:14px;color:var(--dim);font-size:14px;line-height:1.6;text-align:center}
.st{font-size:11.5px;color:var(--faint);text-align:center;padding:4px 16px 0;min-height:18px}
.st.ready{color:var(--grass)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:10px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 72%,rgba(11,18,16,0))}
.dock .in{max-width:520px;margin:0 auto}
.dock .btns{display:flex;gap:10px;margin-top:6px}
.btn{flex:1;text-align:center;padding:12px 4px;line-height:1.2;border-radius:12px;font-weight:650;font-size:14px;background:var(--ink);color:#0B1210}
.btn.g{background:transparent;color:var(--ink);border:1px solid #35514a}
.btn:disabled{opacity:.5;cursor:not-allowed}
.sec{padding:16px 18px 2px;font-size:14px;font-weight:650}
.sec small{display:block;font-weight:400;color:var(--dim);font-size:12.5px;margin-top:2px}
.pair{padding:12px 18px 2px}
.pair .lab{display:flex;justify-content:space-between;font-size:13px;margin-bottom:7px}
.pair .lab span{color:var(--dim)}
.pb{display:flex;align-items:center;gap:10px;margin-bottom:5px;font-size:12px;color:var(--dim)}
.pb .n{width:78px}.pb .v{width:92px;text-align:right;color:var(--ink)}.pb .v u{text-decoration:none;color:var(--faint);font-weight:400}
.pb .tr{flex:1;height:9px;background:var(--panel2);border-radius:6px;overflow:hidden}
.pb .tr i{display:block;height:100%;border-radius:6px}
.pb.lead .v{font-weight:700}
.banner{margin:14px 18px 0;padding:12px 14px;border:1px dashed var(--line);border-radius:12px;font-size:12.5px;color:var(--dim);line-height:1.55}
.dots{display:flex;gap:4px;margin-top:3px;flex-wrap:wrap}
.dots i{width:14px;height:14px;border-radius:4px;display:block}
.dots .y{background:var(--grass)}.dots .n{background:#3a2a26;border:1px solid #6b3e33}.dots.s .y{background:var(--sm)}
.lst{padding:4px 18px 10px}
.li{padding:11px 0;border-top:1px solid var(--line);font-size:13px}
.li .a{display:flex;justify-content:space-between;gap:10px;font-weight:560;font-size:14px}
.li .b{display:flex;gap:10px;margin-top:5px;font-size:12px;color:var(--dim)}.li .b span{flex:1;min-width:0}
details.old{margin:8px 18px 0}details.old summary{cursor:pointer;font-size:12.5px;color:var(--dim);padding:8px 0}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:10px 18px 0}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center}
.tile .l{font-size:11px;color:var(--dim)}.tile .v{font-size:24px;font-weight:700;letter-spacing:-.02em;margin:3px 0 1px}.tile .f{font-size:11.5px;color:var(--faint)}

/* pick-first game row */
.pk{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.pk b{font-size:20px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.pk b i{font-style:normal;margin-left:6px;color:var(--grass)}
.pk.lean b i{color:var(--amber)}.pk.toss b i{color:var(--dim)}
.cf{font-size:11px;font-weight:650;padding:2px 8px;border-radius:20px;white-space:nowrap}
.cf.s{background:#1e3a2d;color:#7fd3a0;border:1px solid #2c5a42}
.cf.ln{color:var(--amber);border:1px solid #6b5420}
.cf.tu{color:var(--dim);border:1px dashed #45594f}
.vs{font-size:12.5px;color:var(--dim);margin:3px 0 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vs em{font-style:normal;color:var(--faint);font-size:11px}
.nums{display:flex;justify-content:space-between;gap:6px;font-size:10.5px;color:var(--faint);margin-top:4px}
.nums span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt{width:92px;flex:none;text-align:right;display:flex;flex-direction:column;justify-content:center;align-items:flex-end;gap:4px}
.rt .big{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1}
.rt .sm{font-size:11.5px;color:var(--dim)}
.rt .small2{font-size:18px;font-weight:700;letter-spacing:-.02em;line-height:1}
.live{font-size:12px;font-weight:650;color:var(--amber);display:flex;align-items:center;gap:6px}
.live:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--amber)}
.pend{font-size:11.5px;font-weight:600;color:var(--dim);border:1px dashed #45594f;border-radius:8px;padding:4px 7px;text-align:center;line-height:1.25}
.m.pn{border-style:dashed}
.unc{margin:14px 18px 4px;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;font-size:12.5px;color:var(--dim)}
.unc summary{cursor:pointer;font-weight:600}
.unc .u{padding:7px 0 0;border-top:1px solid var(--line);margin-top:8px}
.unc .u small{display:block;color:var(--faint);font-size:11px}
.meter{height:10px;border-radius:10px;background:var(--panel2);overflow:hidden;margin:8px 0 6px}
.meter i{display:block;height:100%;background:var(--grass)}.meter.w i{background:var(--amber)}.meter.x i{background:var(--miss)}
.lg{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.lg small{display:block;color:var(--miss);font-size:11px;margin-top:2px}
.lg .when{color:var(--dim);font-size:12px;white-space:nowrap}
.lg.bad .nm{color:var(--miss)}
.xbtn{display:block;width:100%;margin-top:10px;padding:12px;border-radius:12px;border:1px solid #35514a;font-weight:650;font-size:14px;text-align:center}

.tod{float:right;margin-top:2px;font-size:12px;font-weight:650;padding:5px 11px;border-radius:20px;border:1px solid #35514a;color:var(--ink)}
.why{font-size:11.5px;color:var(--dim);margin-top:6px}
.nt{color:var(--amber)}.you{color:#9ec5e8}
.note textarea{width:100%;min-height:64px;margin-top:6px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:9px 10px;font:inherit;font-size:13px;resize:vertical}
.note .rw{display:flex;gap:8px;margin-top:8px;align-items:center}
.note select{flex:1;min-width:0;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:9px 8px;font:inherit;font-size:13px}
.note .sv{padding:9px 16px;border-radius:10px;background:var(--ink);color:#0B1210;font-weight:650;font-size:13px}
.alert{margin:12px 18px 0;padding:10px 12px;border-radius:12px;background:rgba(240,181,74,.1);border:1px solid rgba(240,181,74,.35);font-size:12.5px;color:var(--ink);line-height:1.5}
.alert b{color:var(--amber)}
.pend.late{color:var(--amber);border-color:#6b5420}
.cal{padding:9px 0;border-top:1px solid var(--line);font-size:13px}
.cal .h2{display:flex;justify-content:space-between;gap:8px}
.cal .tr2{height:6px;border-radius:6px;background:var(--panel2);margin-top:5px;overflow:hidden}.cal .tr2 i{display:block;height:100%}
.cal.few{opacity:.55}
.cal small{display:block;color:var(--faint);font-size:11.5px;margin-top:3px}
.dotm{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--amber);margin-left:5px;vertical-align:middle}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="title" id="title"></div>
    <div class="sub" id="sub"></div>
    <div class="days" id="days"></div>
  </div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div id="view"></div>
</div>
<div class="dock"><div class="in">
  <div class="st" id="status"></div>
  <div class="btns"><button type="button" class="btn" id="btn-analyze">Analyze this day</button><button type="button" class="btn g" id="btn-left">Analyze leftover games</button><button type="button" class="btn g" id="btn-grade">Update results</button></div>
</div></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const OUT = { H: 'home win', D: 'draw', A: 'away win' };
const TZ = 'America/Chicago';
let cfg = null, day = { cards: [] }, tally = null;
const S = { date: '', tab: 'board', league: 'all', top: false, open: null };
const counts = {};
try { const v = JSON.parse(localStorage.getItem('hubView') || '{}'); if (['board', 'results', 'compare', 'status'].includes(v.tab)) S.tab = v.tab; if (typeof v.league === 'string') S.league = v.league; } catch (e) { /* first visit */ }
const saveView = () => { try { localStorage.setItem('hubView', JSON.stringify({ tab: S.tab, league: S.league })); } catch (e) { /* ignore */ } };

/* ---------- admin token (protects Analyze / Update so strangers can't use your free quota) ---------- */
/* The browser's own login box (shown once per device) is the password; every request carries it automatically. */
async function parse(r) { const t = await r.text(); try { return JSON.parse(t); } catch (e) { throw new Error(`Server replied ${r.status}: ${t.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 140) || 'empty response'}`); } }
async function api(path) { return parse(await fetch(path)); }
async function post(path, body) {
  const r = await fetch(path, body ? { method: 'POST', body: JSON.stringify(body) } : { method: 'POST' });
  if (r.status === 401) throw new Error('Signed out. Reload the page and sign in again.');
  return parse(r);
}
const say = (m, ready) => { const s = $('#status'); s.textContent = m; s.className = 'st' + (ready ? ' ready' : ''); };

/* ---------- helpers ---------- */
const ord = n => { if (!n) return ''; const s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); };
const sideName = (c, side) => side === 'H' ? c.home : side === 'A' ? c.away : 'Draw';
const pickText = c => c.v2.pick === 'D' ? 'Draw' : sideName(c, c.v2.pick);
const addDays = (d, n) => { const x = new Date(d + 'T12:00:00Z'); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); };
const pill = (ok, l) => `<span class="hit ${ok ? 'y' : 'n'}">${l}</span>`;
const isTop = c => c.v2 && (c.v2.best.p >= 62 || Math.max(...c.v2.p) >= 55);
const nowCT = () => new Intl.DateTimeFormat('en-US', { timeZone: TZ, hour: 'numeric', minute: '2-digit' }).format(new Date());

/* ---------- one game ---------- */
function expanded(c) {
  if (!c.v2) return `<div class="ex"><div class="in"><div class="small">${esc(c.skipped || 'No prediction yet.')}</div></div></div>`;
  const v = c.v2, g = c.grade;
  const ou = v.over >= 50 ? ['Over 2.5 goals', v.over, 'Under', 100 - v.over] : ['Under 2.5 goals', 100 - v.over, 'Over', v.over];
  const bt = v.btts >= 50 ? ['Both teams score: yes', v.btts, 'No', 100 - v.btts] : ['Both teams score: no', 100 - v.btts, 'Yes', v.btts];
  const mdl = `<div class="src m1"><small>Model said</small><b>${esc(v.scores[0][0])}</b><small>${esc(pickText(c))} ${Math.max(...v.p)}%</small>${g ? `<div class="hits">${pill(g.v2.outcomeHit, 'Winner')}${pill(g.v2.ouHit, 'O/U')}${pill(g.v2.bttsHit, 'Both')}</div>` : ''}</div>`;
  const sm = c.sm
    ? `<div class="src s1"><small>SportsMole said</small><b>${esc(c.sm.text.replace(/^.*?(\d+–\d+).*$/, '$1'))}</b><small>${esc(c.sm.text)}</small>${c.smGrade ? `<div class="hits">${pill(c.smGrade.outcomeHit, 'Winner')}${pill(c.smGrade.scoreHit, 'Score')}${pill(c.smGrade.ouHit, 'O/U')}${pill(c.smGrade.bttsHit, 'Both')}</div>` : ''}</div>`
    : `<div class="src s0"><small>SportsMole</small>No prediction found yet</div>`;
  const v4 = c.v4, v3 = c.v3;
  const shadow = v4
    ? `<div class="small"><b>v4 shadow test</b>: ${esc(c.home)} ${v4.p[0]}%, draw ${v4.p[1]}%, ${esc(c.away)} ${v4.p[2]}%. It picks <b>${OUT[v4.pick]}</b>${v4.pick === v.pick ? ', same as v2' : `, <b>not</b> v2's pick (${OUT[v.pick]})`}. Over 2.5 ${v4.over}%, both score ${v4.btts}%.
      ${g && g.v4 ? `<br>v4 result: ${pill(g.v4.outcomeHit, 'Winner')} ${pill(g.v4.ouHit, 'O/U')} ${pill(g.v4.bttsHit, 'Both')}` : ''}</div>`
    : v3
      ? `<div class="small"><b>v3 (retired shadow test)</b>${v3.drawRisk ? ' (draw risk)' : ''}: ${esc(c.home)} ${v3.p[0]}%, draw ${v3.p[1]}%, ${esc(c.away)} ${v3.p[2]}%. It picks <b>${OUT[v3.pick]}</b>. Over 2.5 ${v3.over}%, both score ${v3.btts}%.
      ${g && g.v3 ? `<br>v3 result: ${pill(g.v3.outcomeHit, 'Winner')} ${pill(g.v3.ouHit, 'O/U')} ${pill(g.v3.bttsHit, 'Both')}` : ''}</div>`
      : c.v4 === null && !c.final ? `<div class="small"><b>v4 shadow test</b>: no prediction for this game (a club with too little history).</div>` : '';
  return `<div class="ex"><div class="in"><div class="in">
    <div class="kv"><div class="box">${ou[0]}<b>${ou[1]}%</b><small>${ou[2]} ${ou[3]}%</small></div><div class="box">${bt[0]}<b>${bt[1]}%</b><small>${bt[2]} ${bt[3]}%</small></div></div>
    <div class="two">${mdl}${sm}</div>
    <div class="box f">Most likely scores<b style="font-size:13px">${v.scores.slice(0, 3).map(s => `${esc(s[0])} <span class="fnt" style="font-weight:500">${s[1]}%</span>`).join(' &nbsp; ')}</b></div>
    <div class="box f">Form going in<b style="font-size:12.5px;font-weight:500;color:var(--dim)">${esc(c.home)}: ${esc(c.form.home)}.<br>${esc(c.away)}: ${esc(c.form.away)}.</b></div>
    ${shadow}
    ${fbLine(c)}
    <div class="box f note">Your note<textarea id="note-${esc(c.id)}" maxlength="500" placeholder="Injuries, rotation, anything the model can't see">${esc(c.note || '')}</textarea>
      <div class="rw"><select id="mine-${esc(c.id)}" aria-label="Your pick">${[['', 'No pick of my own'], ['H', c.home + ' win'], ['D', 'Draw'], ['A', c.away + ' win']].map(([v, l]) => `<option value="${v}" ${(c.mine || '') === v ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select><button type="button" class="sv" data-save="${esc(c.id)}">Save</button></div></div>
    <details class="how"><summary>How the model got here</summary>
      <p>Last 5 domestic league games per club (before kickoff). Expected goals: ${esc(c.home)} ${v.lam[0]}, ${esc(c.away)} ${v.lam[1]}. Official model v2: league-average prior 1.56, home 1.17×, away 0.83×, form weight 0.6.</p>
      ${c.crossLeague ? `<p>${esc(c.home)} play in the ${esc(c.homeLeague)} and ${esc(c.away)} in the ${esc(c.awayLeague)}, so form comes from different leagues. v2 has no league-strength adjustment; the v4 cup model does.</p>` : ''}
      ${c.v4 && (c.leagueKey === 'ucl' || c.leagueKey === 'uel') ? `<p>v4 cup shadow model: each club's rating from its own league, a strength factor for each league, and a small correction from its Champions League and Europa League games of the last three seasons. Expected goals: ${esc(c.home)} ${c.v4.lam[0]}, ${esc(c.away)} ${c.v4.lam[1]}. Tracked next to v2; it never changes v2's picks.</p>` : c.v4 ? `<p>v4 shadow model: attack and defence ratings for every club from about 2.5 years of league games, with recent games counting more and each result judged against the opposition faced. Expected goals: ${esc(c.home)} ${c.v4.lam[0]}, ${esc(c.away)} ${c.v4.lam[1]}. Over 2.5 and both-score are pulled toward the league's recent scoring rate. It is tracked next to v2 and never changes v2's picks.</p>` : ''}
    </details></div></div>`;
}
const GAME_MS = 2 * 3600000;
const why = c => {
  if (c.v2.pick === 'D') return '';
  const f = t => { const m = /(\d+) scored, (\d+) conceded in last (\d+)/.exec(t || ''); return m ? { gf: +m[1], ga: +m[2], n: +m[3] } : null; };
  const H = c.v2.pick === 'H', pf = f(H ? c.form.home : c.form.away), of = f(H ? c.form.away : c.form.home);
  if (!pf || !of) return '';
  return `<div class="why">${esc(H ? c.home : c.away)} scored ${pf.gf} in their last ${pf.n}. ${esc(H ? c.away : c.home)} conceded ${of.ga} in theirs.</div>`;
};
const conf = c => { const t = Math.max(...c.v2.p); return t >= 55 ? ['Strong', 's', ''] : t >= 45 ? ['Lean', 'ln', 'lean'] : ['Toss-up', 'tu', 'toss']; };
function game(c) {
  const open = S.open === c.id, ko = new Date(c.kickoff).getTime(), now = Date.now();
  const rank = r => r ? ` <em>${ord(r)}</em>` : '';
  const v = c.v2, [h, d, a] = v.p, top = Math.max(h, d, a), [cl, ccls, pcls] = conf(c);
  let rt, pending = false, extra = '';
  if (c.final) {
    const hit = c.grade ? c.grade.v2.outcomeHit : null;
    rt = `<div class="rt"><span class="big">${c.final.h}–${c.final.a}</span>${hit == null ? '' : `<span class="mark ${hit ? 'ok' : 'no'}" style="margin:0">${hit ? '✓ correct' : '✗ missed'}</span>`}</div>`;
  } else if (now < ko) {
    rt = `<div class="rt"><span class="small2">${esc(v.scores[0][0])}</span><span class="sm">likely score</span><span class="sm">${esc(c.ko)}</span></div>`;
    if (v.best.p >= 60) extra = `<div class="bb"><span>Best bet <b>${esc(v.best.pick)}</b></span><b>${v.best.p}%</b></div>`;
  } else if (now < ko + GAME_MS) {
    rt = `<div class="rt"><span class="live">In play</span><span class="sm">kicked off ${esc(c.ko)}</span></div>`;
  } else {
    pending = true;
    const hrs = Math.floor((now - ko - GAME_MS) / 3600000), late = hrs >= 6;
    rt = `<div class="rt"><span class="pend ${late ? 'late' : ''}">Finished<br>result pending${hrs >= 1 ? `<br>${hrs} h` : ''}</span></div>`;
  }
  const nums = `<div class="nums"><span>${esc(c.home)} ${h}</span><span>Draw ${d}</span><span>${esc(c.away)} ${a}</span></div>`;
  const pickName = pickText(c), pp = v.pick === 'H' ? h : v.pick === 'A' ? a : d;
  return `<div class="m ${open ? 'open' : ''} ${pending ? 'pn' : ''}"><button type="button" class="hd" data-id="${esc(c.id)}" aria-expanded="${open}">
    <div class="row"><div class="teams"><div class="tag">${esc(c.leagueName)}${c.note ? ' <span class="nt">· note</span>' : ''}${c.mine ? ` <span class="you">· you: ${OUT[c.mine]}</span>` : ''}</div>
      <div class="pk ${pcls}"><b>${esc(pickName)}<i>${pp}%</i></b><span class="cf ${ccls}">${cl}</span></div>
      <div class="vs">${esc(c.home)}${rank(c.hRank)} vs ${esc(c.away)}${rank(c.aRank)}</div>
      <div class="bar" style="margin-top:0"><i class="h" style="width:${h}%"></i><i class="d" style="width:${d}%"></i><i class="a" style="width:${a}%"></i></div>${nums}${cl === 'Strong' && !c.final ? why(c) : ''}</div>${rt}</div>${open ? '' : extra}</button>${open ? expanded(c) : ''}</div>`;
}

/* ---------- alerts ---------- */
function backupAge() { try { const t = localStorage.getItem('hubBackup'); return t ? Math.floor((Date.now() - new Date(t).getTime()) / 86400000) : null; } catch (e) { return null; } }
function alerts() {
  const out = [], now = Date.now();
  const late = day.cards.filter(c => c.v2 && !c.final && now > new Date(c.kickoff).getTime() + GAME_MS + 6 * 3600000).length;
  if (late) out.push(`<b>${late} finished game${late === 1 ? ' is' : 's are'} 6+ hours past kickoff and still ungraded.</b> Tap Update results.`);
  if (stat) {
    const stale = stat.leagues.filter(l => !l.support && l.lastSync && now - new Date(l.lastSync).getTime() > 30 * 3600000);
    if (stale.length) out.push(`<b>Results haven't refreshed in over a day</b> for ${stale.slice(0, 3).map(l => esc(l.name)).join(', ')}${stale.length > 3 ? ` and ${stale.length - 3} more` : ''}. The background job may have stalled.`);
    const bad = stat.leagues.filter(l => l.problem && !l.support).length;
    if (bad) out.push(`<b>${bad} league${bad === 1 ? '' : 's'} had a problem.</b> See the Status tab.`);
    if (stat.writes.used >= 0.9 * stat.writes.limit) out.push(`<b>Saves are almost used up for today</b> (${stat.writes.used} of ${stat.writes.limit}).`);
  }
  const b = backupAge(); if (b != null && b >= 14) out.push(`<b>Last backup was ${b} days ago.</b> Export data on the Status tab.`);
  return out;
}

/* ---------- board ---------- */
// v4 shadow line for a game v2 could not cover (no v2 card, but the v4 cup model had a prediction)
// Forebet picks entered by hand. Recorded and graded only; no model reads them.
function fbLine(c) {
  const f = c.fb; if (!f) return '';
  let res = '';
  if (c.final) {
    const o = c.final.h > c.final.a ? 0 : c.final.h === c.final.a ? 1 : 2, top = f.p.indexOf(Math.max(...f.p));
    res = ` ${pill(top === o, 'Winner')}${f.score ? ' ' + pill(f.score.h === c.final.h && f.score.a === c.final.a, 'Score') : ''}`;
  }
  return `<div class="small"><b>Forebet</b> (${f.how === 'pasted' ? 'pasted by you' : 'saved before kickoff'}, no model uses it): ${esc(c.home)} ${f.p[0]}%, draw ${f.p[1]}%, ${esc(c.away)} ${f.p[2]}%.${f.score ? ` Predicts ${f.score.h}–${f.score.a}.` : ''}${res}</div>`;
}
function v4Only(c) {
  const v4 = c.v4; if (!v4) return '';
  const g = c.grade && c.grade.v4;
  return `<small><b>v4 shadow test</b>: ${esc(c.home)} ${v4.p[0]}%, draw ${v4.p[1]}%, ${esc(c.away)} ${v4.p[2]}%. Picks <b>${OUT[v4.pick]}</b>. Over 2.5 ${v4.over}%, both score ${v4.btts}%. Most likely ${esc(v4.scores[0][0])}.` +
    (c.final ? ` Final ${c.final.h}–${c.final.a}${g ? ` ${pill(g.outcomeHit, 'Winner')} ${pill(g.ouHit, 'O/U')} ${pill(g.bttsHit, 'Both')}` : ''}` : '') + `</small>`;
}
function uncovered(list) {
  if (!list.length) return '';
  const n4 = list.filter(c => c.v4).length;
  return `<details class="unc" ${n4 ? 'open' : ''}><summary>${list.length} game${list.length === 1 ? '' : 's'} not covered by v2${n4 ? `, ${n4} with a v4 shadow prediction` : ''}</summary>` +
    list.map(c => `<div class="u">${esc(c.home)} vs ${esc(c.away)}<small>${esc(c.leagueName)}, ${esc(c.ko)}. ${esc(c.skipped || 'No prediction yet.')}</small>${v4Only(c)}${fbLine(c)}</div>`).join('') + `</details>`;
}
const alertBox = () => { const a = alerts(); return a.length ? `<div class="alert">${a.join('<br>')}</div>` : ''; };
function board() {
  const unc = day.cards.filter(c => !c.v2);
  let cs = day.cards.filter(c => c.v2);
  const leagues = [...new Map(day.cards.map(c => [c.leagueKey, c.leagueName])).entries()];
  if (S.league !== 'all' && !leagues.some(([k]) => k === S.league)) S.league = 'all';
  const chips = `<div class="chips"><button type="button" class="chip ${S.league === 'all' && !S.top ? 'on' : ''}" data-league="all">All<i>${day.cards.filter(c => c.v2).length}</i></button>` +
    leagues.map(([k, n]) => `<button type="button" class="chip ${S.league === k ? 'on' : ''}" data-league="${k}">${esc(n)}<i>${day.cards.filter(c => c.v2 && c.leagueKey === k).length}</i></button>`).join('') +
    `<button type="button" class="chip amber ${S.top ? 'on' : ''}" data-top="1">Top picks</button></div>`;
  if (!day.cards.length) return chips + `<div class="empty">No games analyzed for this day yet.<br>Tap <b>Analyze this day</b> below to load the fixtures and predictions.</div>`;
  if (S.league !== 'all') cs = cs.filter(c => c.leagueKey === S.league);
  const uncShown = S.top ? [] : unc.filter(c => S.league === 'all' || c.leagueKey === S.league);
  if (S.top) cs = cs.filter(isTop);
  if (!cs.length) return chips + `<div class="empty">No games with a prediction match this filter.</div>` + uncovered(uncShown);
  cs.sort((a, b) => new Date(a.kickoff) - new Date(b.kickoff));
  const slots = new Map();
  for (const c of cs) { if (!slots.has(c.kickoff)) slots.set(c.kickoff, []); slots.get(c.kickoff).push(c); }
  const isToday = S.date === cfg.today, now = Date.now();
  let nowDone = !isToday, html = '';
  for (const [iso, list] of slots) {
    const t = new Date(iso).getTime(), done = list.every(c => c.final);
    if (!nowDone && t > now) { nowDone = true; if (html) html += `<div class="now">Now, ${esc(nowCT())}</div>`; }
    const [hm, ap] = list[0].ko.split(' ');
    html += `<div class="slot ${done ? 'done' : ''}"><div class="t">${esc(hm)}<small>${esc(ap || '')}</small></div>${list.map(game).join('')}</div>`;
  }
  return chips + alertBox() + `<div class="rail">${html}</div>` + uncovered(uncShown);
}

/* ---------- Model vs SportsMole ---------- */
function pairRow(label, note, rows) {
  const best = Math.max(...rows.map(r => r.k / r.n));
  return `<div class="pair"><div class="lab"><b style="font-weight:600">${label}</b><span>${note}</span></div>` + rows.map(r => {
    const p = r.n ? Math.round(100 * r.k / r.n) : 0, lead = rows.length > 1 && r.k / r.n === best && rows.some(o => o !== r && o.k / o.n < best);
    return `<div class="pb ${lead ? 'lead' : ''}"><div class="n">${r.name}</div><div class="tr"><i style="width:${p}%;background:${r.color}"></i></div><div class="v">${p}% <u>${r.k}/${r.n}</u></div></div>`;
  }).join('') + `</div>`;
}
function compare() {
  if (!tally) return `<div class="empty">Loading…</div>`;

  const last = s.earlier.slice(0, 10).reverse();
  const live = s.recent.map(r => `<div class="li"><div class="a"><span>${esc(r.home)} vs ${esc(r.away)}</span><span>${r.final.h}–${r.final.a}</span></div>

  const old = s.earlier.slice(0, 60).map(r => `<div class="li"><div class="a"><span>${esc(r.match)}</span><span>${esc(r.finalScore.replace(/^.* (\d+–\d+) .*$/, '$1'))}</span></div>
    <div class="b"><span>Model: ${esc(r.modelPick.replace(/ \(.*/, ''))} <b class="${r.modelHit ? 'ok' : 'no'}">${r.modelHit ? '✓' : '✗'}</b></span><span style="color:var(--sm)">SportsMole: ${esc(r.sportsmolePredict)} <b>${r.sportsmoleOutcomeHit ? '✓' : '✗'}</b></span></div></div>`).join('');
  return `<div class="banner">Tracks SportsMole's published “We say” scorelines against final results, next to this site's v2 model: ${s.importedMatches} matches carried over from the old Hub and ${s.newMatches} tracked here since. New predictions are fetched automatically.</div>
    <div class="sec">Share of picks that came true<small>${n} matches. Longer bar is better, the leader is bold.</small></div>
    ${pairRow('Winner or draw', '3 outcomes', [{ name: 'Model', k: s.model.outcome, n, color: G }, { name: 'SportsMole', k: s.sm.outcome, n, color: B }])}
    ${pairRow('Over or under 2.5 goals', '2 outcomes', [{ name: 'Model', k: s.model.ou, n, color: G }, { name: 'SportsMole', k: s.sm.ou, n, color: B }])}
    ${pairRow('Both teams to score', '2 outcomes', [{ name: 'Model', k: s.model.btts, n, color: G }, { name: 'SportsMole', k: s.sm.btts, n, color: B }])}
    ${pairRow('Exact score', 'SportsMole only', [{ name: 'SportsMole', k: s.sm.score, n, color: B }])}
    ${last.length ? `<div class="sec" style="padding-top:18px">Last 10 winner picks<small>One square per game, newest on the right.</small></div>
      <div class="pair" style="padding-top:8px"><div class="small" style="margin:0">Model</div><div class="dots">${last.map(r => `<i class="${r.modelHit ? 'y' : 'n'}"></i>`).join('')}</div>
      <div class="small" style="margin:10px 0 0">SportsMole</div><div class="dots s">${last.map(r => `<i class="${r.sportsmoleOutcomeHit ? 'y' : 'n'}"></i>`).join('')}</div></div>` : ''}

/* ---------- Results ---------- */
function tile(l, m, k) { return `<div class="tile"><div class="l">${l}</div><div class="v">${m.n ? Math.round(100 * m[k] / m.n) : 0}%</div><div class="f">${m[k]}/${m.n}</div></div>`; }
function resultsBlock(title, m) {
  return `<div class="sec">${title}<small>${m.n} graded. Brier score ${m.brier ?? '–'} (lower is better, 0.667 is a random guess).</small></div>
    <div class="tiles">${tile('Winner', m, 'outcome')}${tile('Over/under', m, 'ou')}${tile('Both score', m, 'btts')}</div>`;
}
function calibrationView(t) {
  if (!t.calibration) return '';
  const rows = t.calibration.filter(b => b.n).map(b => {
    const act = Math.round(100 * b.hits / b.n), few = b.n < 30, gap = act - b.avg;
    const verdict = few ? 'Too few games to trust yet.' : gap <= -8 ? 'Overconfident here: wins less than it says.' : gap >= 8 ? 'Underconfident here: wins more than it says.' : 'Close to honest.';
    return `<div class="cal ${few ? 'few' : ''}"><div class="h2"><b style="font-weight:600">${b.label}</b><span>said ${Math.round(b.avg)}%, won ${act}% <span class="fnt">(${b.hits}/${b.n})</span></span></div>
      <div class="tr2"><i style="width:${Math.round(b.avg)}%;background:#5f746b"></i></div><div class="tr2"><i style="width:${act}%;background:var(--grass)"></i></div><small>${verdict}</small></div>`;
  }).join('');
  const mine = t.mine && t.mine.n ? `<div class="small" style="margin-top:10px">Your own picks on ${t.mine.n} games: you got ${t.mine.mine}, the model got ${t.mine.model}.</div>` : '';
  return `<div class="sec" style="padding-top:20px">Are the percentages honest?<small>Winner picks grouped by how sure the model was. Grey bar is what it said, green is how often it won.</small></div><div class="pair" style="padding-top:6px">${rows}${mine}</div>`;
}
function forebetBlock(t) {
  const f = t.forebet; if (!f || !f.n) return '';
  const row = (name, x) => x.n ? `<div class="li"><div class="a"><span>Against ${name}, same ${x.n} games</span></div><div class="b"><span>Winner: Forebet ${x.fbOutcome}, ${name} ${x.outcome}</span><span>Brier: Forebet ${x.fbBrier}, ${name} ${x.brier}</span></div></div>` : '';
  return `<div class="sec" style="padding-top:20px">Forebet, entered by hand<small>${f.n} graded. Winner ${f.outcome}/${f.n}, exact score ${f.score}/${f.n}, Brier ${f.brier} (lower is better). Recorded only; no model uses it. Small samples swing a lot.</small></div><div class="lst">${row('v2', f.vs.v2)}${row('v4', f.vs.v4)}</div>`;
}
function results() {
  if (!tally) return `<div class="empty">Loading…</div>`;
  const t = tally;
  const rows = t.recent.map(c => `<div class="li"><div class="a"><span>${esc(c.home)} vs ${esc(c.away)}</span><span>${c.final.h}–${c.final.a}</span></div>
    <div class="b"><span>${OUT[c.v2.pick]} <b class="${c.grade.v2.outcomeHit ? 'ok' : 'no'}">${c.grade.v2.outcomeHit ? '✓' : '✗'}</b></span><span>${c.v2.over >= 50 ? 'Over' : 'Under'} <b class="${c.grade.v2.ouHit ? 'ok' : 'no'}">${c.grade.v2.ouHit ? '✓' : '✗'}</b></span><span>Both score ${c.v2.btts >= 50 ? 'yes' : 'no'} <b class="${c.grade.v2.bttsHit ? 'ok' : 'no'}">${c.grade.v2.bttsHit ? '✓' : '✗'}</b></span></div></div>`).join('');
  const old = t.earlier.map(r => `<div class="li"><div class="a"><span>${esc(r.match)}</span><span>${esc(r.actual)}</span></div>
    <div class="b"><span>Winner <b class="${r.outcomeHit ? 'ok' : 'no'}">${r.outcomeHit ? '✓' : '✗'}</b></span><span>O/U <b class="${r.ouHit ? 'ok' : 'no'}">${r.ouHit ? '✓' : '✗'}</b></span><span>Both <b class="${r.bttsHit ? 'ok' : 'no'}">${r.bttsHit ? '✓' : '✗'}</b></span></div></div>`).join('');
  return `<div class="banner">${t.importedMatches} matches carried over from the old Hub plus ${t.newlyGraded} graded here since.</div>` +
    resultsBlock('v2 official, all results', t.v2) + calibrationView(t) +
    `<div class="sec" style="padding-top:20px">v2 vs v4 shadow test<small>Both models on the same matches only. v4 started on Oct 14, 2026, so this fills in as games finish.</small></div>` +
    (t.v4 && t.v4.n ? resultsBlock('v4 (shadow), every game it predicted', t.v4).replace('<div class="sec">', '<div class="sec" style="padding-top:6px">') : '') +
    (t.h2h.v4.n ? resultsBlock('v2', t.h2h.v2).replace('<div class="sec">', '<div class="sec" style="padding-top:6px">') + resultsBlock('v4 (shadow)', t.h2h.v4).replace('<div class="sec">', '<div class="sec" style="padding-top:6px">') : '<div class="small" style="padding:6px 16px">No v4 games graded yet. Results fill in a few hours after each league finishes.</div>') +

    `<div class="sec" style="padding-top:20px">Recent results</div><div class="lst">${rows || '<div class="small">Nothing new graded yet. Results fill in automatically a few hours after each league finishes.</div>'}</div>` +
    `<details class="old"><summary>Earlier results carried over (${t.earlier.length})</summary><div class="lst" style="padding:0">${old}</div></details>`;
}


/* ---------- Status ---------- */
let stat = null;
const ago = iso => { if (!iso) return 'never'; const m = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60000)); return m < 1 ? 'just now' : m < 60 ? `${m} min ago` : m < 2880 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} days ago`; };
function statusView() {
  if (!stat) return `<div class="empty">Loading…</div>`;
  const w = stat.writes, pct = Math.min(100, Math.round(100 * w.used / w.limit)), cls = pct >= 90 ? 'x' : pct >= 70 ? 'w' : '';
  const bad = stat.leagues.filter(l => l.problem), ok = stat.leagues.filter(l => !l.problem);
  const row = l => `<div class="lg ${l.problem ? 'bad' : ''}"><div><span class="nm">${esc(l.name)}</span>${l.support ? ' <span class="fnt">(background)</span>' : ''}${l.problem ? `<small>${l.problem.kind === 'sync' ? 'Results won\'t load' : 'Game list won\'t load'}: ${esc(l.problem.msg)}</small>` : ''}</div><div class="when">${l.lastSync ? 'synced ' + ago(l.lastSync) : 'never synced'}${l.v4 ? `<br><span class="fnt">v4 ratings ${l.v4.ratingsAt ? ago(l.v4.ratingsAt) : 'from the bundled history'}</span>` : ''}</div></div>`;
  return `<div class="sec">Saves used today<small>${w.used} of ${w.limit}. The free plan stops saving at the limit and resets at 7:00 PM Central. This is a close estimate.</small></div>
    <div class="pair" style="padding-top:0"><div class="meter ${cls}"><i style="width:${pct}%"></i></div>${pct >= 90 ? '<div class="small" style="color:var(--miss)">Almost out. Avoid Analyze this day until the reset.</div>' : pct >= 70 ? '<div class="small" style="color:var(--amber)">Getting high. Use Analyze leftover games instead of a full run.</div>' : ''}</div>
    ${bad.length ? `<div class="sec" style="padding-top:16px">Needs attention<small>${bad.length} league${bad.length === 1 ? '' : 's'} with a problem the last time they ran.</small></div><div class="pair" style="padding-top:0">${bad.map(row).join('')}</div>` : `<div class="banner" style="margin-top:14px">No league problems on record.</div>`}
    <div class="sec" style="padding-top:16px">Leagues<small>When each league's results were last loaded. Each re-syncs about every 8 hours.</small></div>
    <div class="pair" style="padding-top:0">${ok.map(row).join('')}</div>
    ${shotsBlock()}
    ${forebetBox()}
    <div class="sec" style="padding-top:16px">Back up your history<small>Downloads every saved day with predictions, results and SportsMole picks, plus the carried-over totals.</small></div>
    <div class="pair" style="padding-top:0"><div class="small" style="margin:0 0 4px;${backupAge() == null || backupAge() >= 7 ? 'color:var(--amber)' : ''}">${backupAge() == null ? 'No backup made from this device yet.' : backupAge() === 0 ? 'Last backup from this device: today.' : `Last backup from this device: ${backupAge()} day${backupAge() === 1 ? '' : 's'} ago.`}</div><button type="button" class="xbtn" id="btn-export">Export data</button></div>`;
}
// Paste Forebet's league table (select the table on the page, copy, paste here). Only games that have not kicked off are saved.
function forebetBox() {
  const opts = (cfg.leagues || []).map(l => `<option value="${esc(l.slug)}"${l.slug === (S.league !== 'all' ? S.league : 'uefa.europa') ? ' selected' : ''}>${esc(l.name)}</option>`).join('');
  return `<div class="sec" style="padding-top:16px">Forebet picks<small>Copy the league table from forebet.com and paste it here. It is saved for ${esc(S.date)}, only for games that have not started, and only once per game. Nothing uses it except the Results tab.</small></div>
    <div class="pair" style="padding-top:0"><select id="fb-league" style="width:100%;margin-bottom:8px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit">${opts}</select>
    <div class="note"><textarea id="fb-text" placeholder="Paste the table here"></textarea></div><button type="button" class="xbtn" id="btn-fb">Save Forebet picks</button><div class="small" id="fb-msg" style="margin-top:6px"></div></div>`;
}
// Tracking only: whether ESPN gives shot counts for finished games. Nothing here feeds a prediction.
function shotsBlock() {
  const L = stat.leagues.filter(l => l.shots), cups = L.filter(l => /Champions|Europa/.test(l.name)), rest = L.filter(l => !cups.includes(l) && l.shots.checked > 0);
  const line = l => { const c = l.shots; return `<div class="lg"><div><span class="nm">${esc(l.name)}</span></div><div class="when">${c.checked ? `shots on ${c.withShots} of ${c.checked} finished games` : 'no finished games checked yet'}</div></div>`; };
  return `<div class="sec" style="padding-top:16px">Shot data from ESPN<small>Counts finished games saved since tracking started and how many came with shots and shots on target. This is only being recorded; no prediction uses it yet.</small></div>
    <div class="pair" style="padding-top:0">${cups.map(line).join('')}${rest.map(line).join('')}</div>`;
}
async function exportAll() {
  const b = $('#btn-export'); if (b) b.disabled = true;
  try {
    say('Exporting: listing saved days…');
    const list = (await api('/api/days')).days, days = [];
    for (let i = 0; i < list.length; i++) { say(`Exporting day ${i + 1} of ${list.length}…`); days.push(await api('/api/day?date=' + list[i])); }
    say('Exporting totals…');
    const data = { exportedAt: new Date().toISOString(), note: 'Game Day Hub backup. days = every saved day (cards with model picks, results, SportsMole picks); totals = results summary including carried-over history.', days, totals: await api('/api/tally') };
    const url = URL.createObjectURL(new Blob([JSON.stringify(data)], { type: 'application/json' }));
    const a = document.createElement('a'); a.href = url; a.download = `gameday-hub-backup-${new Date().toISOString().slice(0, 10)}.json`; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    try { localStorage.setItem('hubBackup', new Date().toISOString()); } catch (e) { /* ignore */ }
    say(`Backup downloaded: ${days.length} day${days.length === 1 ? "" : "s"}.`, true);
    if (S.tab === 'status') render();
  } catch (e) { say(e.message); }
  if (b) b.disabled = false;
}

/* ---------- page ---------- */
function renderHeader() {
  const d = new Date(S.date + 'T12:00:00');
  $('#title').innerHTML = esc(d.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' })) + (S.date !== cfg.today ? `<button type="button" class="tod" data-date="${cfg.today}">Today</button>` : '');
  const done = day.cards.filter(c => c.v2).length, need = day.cards.filter(c => !c.v2).length;
  $('#sub').textContent = day.cards.length ? `${done} games with a prediction${need ? `, ${need} not covered` : ''}` : 'Nothing analyzed for this day yet';
  $('#days').innerHTML = [-2, -1, 0, 1, 2].map(o => {
    const ds = addDays(S.date, o), x = new Date(ds + 'T12:00:00'), c = counts[ds];
    return `<button type="button" class="day ${o === 0 ? 'on' : ''}" data-date="${ds}">${x.toLocaleDateString('en-US', { weekday: 'short' })}<b>${x.getDate()}</b><small>${c == null ? '' : c}</small></button>`;
  }).join('');
  $('#tabs').innerHTML = [['board', 'Board'], ['results', 'Results'], ['compare', 'Compare'], ['status', 'Status']].map(([k, n]) =>
    `<button type="button" role="tab" class="tab ${S.tab === k ? 'on' : ''}" data-tab="${k}" aria-selected="${S.tab === k}">${n}${k === 'status' && alerts().length ? '<span class="dotm"></span>' : ''}</button>`).join('');
}
function render() {
  renderHeader();
  $('#view').innerHTML = S.tab === 'board' ? board() : S.tab === 'results' ? results() : S.tab === 'status' ? statusView() : compare();
}
async function loadCounts() {
  const ds = [-2, -1, 0, 1, 2].map(o => addDays(S.date, o)).filter(d => counts[d] == null || d === S.date);
  await Promise.all(ds.map(async d => { try { const j = await api('/api/day?date=' + d); counts[d] = j.cards.length; if (d === S.date) day = j; } catch (e) {} }));
}
async function loadDay(date) {
  if (date) S.date = date;
  S.open = null; day = { cards: [] };
  render();
  await loadCounts();
  render();
  say(day.analyzedAt ? 'Updated ' + new Date(day.analyzedAt).toLocaleString('en-US', { timeZone: TZ, month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '');
}
async function ensureTally() { if (!tally) { tally = await api('/api/tally'); } }

/* ---------- Analyze / Update: one league at a time ---------- */
let failed = [];
async function syncUntilCaughtUp(slug, name, i, n) {
  for (let k = 0; k < 10; k++) {
    say(`Loading ${name} results (${i}/${n})…`);
    const r = await post('/api/sync?league=' + slug);
    if (r.error) { failed.push(name); return; } // a league ESPN won't load must not stop the whole run
    if (r.caughtUp) return;
  }
}
async function runAll(kind) {
  const buttons = ['#btn-analyze', '#btn-left', '#btn-grade'].map($); buttons.forEach(b => b.disabled = true);
  const date = S.date; let done = 0, skipped = 0, graded = 0, smFound = 0; failed = [];
  try {
    let list = cfg.leagues;
    if (kind === 'leftover') {
      const need = new Set(day.cards.filter(c => !c.v2).map(c => c.league)), seen = day.analyzed || {};
      list = cfg.leagues.filter(l => need.has(l.slug) || !seen[l.slug]);
      if (!list.length) { say('Every game for this day already has a prediction.', true); buttons.forEach(b => b.disabled = false); return; }
    }
    for (let i = 0; i < list.length; i++) {
      const lg = list[i], at = `${i + 1}/${list.length}`;
      if (kind !== 'grade') {
        const lo = kind === 'leftover' ? '&leftover=1' : '';
        say(`Analyzing ${lg.name} (${at})…`);
        let r = await post(`/api/analyze?league=${lg.slug}&date=${date}${lo}`);
        if (r.error) throw new Error(r.error);
        if (r.needsSync) {
          for (const slug of r.needsSync) { const m = cfg.leagues.find(l => l.slug === slug); await syncUntilCaughtUp(slug, m ? m.name : slug, at.split('/')[0], list.length); }
          r = await post(`/api/analyze?league=${lg.slug}&date=${date}&partial=1${lo}`);
        }
        if (r.feedError) failed.push(lg.name + ' (games feed)');
        done += r.cards || 0; skipped += r.skipped || 0;
        if (r.cards) { try { say(`SportsMole predictions: ${lg.name} (${at})…`); const s = await post(`/api/sm?league=${lg.slug}&date=${date}`); smFound += s.found || 0; } catch (e) { /* optional */ } }
      } else {
        say(`Checking ${lg.name} results (${at})…`);
        const r = await post(`/api/grade?league=${lg.slug}&date=${date}`);
        if (r.error) throw new Error(r.error);
        graded += r.graded || 0;
      }
    }
    delete counts[date]; tally = null;
    await loadDay();
    say(kind !== 'grade' ? `Done: ${done} matches${kind === 'leftover' ? ' checked' : ''}${skipped ? ` (${skipped} skipped, not enough form data)` : ''}.${smFound ? ` SportsMole predictions found: ${smFound}.` : ''}${failed.length ? ` Couldn't load: ${[...new Set(failed)].join(', ')}.` : ''}` : `Graded ${graded} match${graded === 1 ? '' : 'es'}.`, true);
  } catch (err) { say(err.message); }
  buttons.forEach(b => b.disabled = false);
}

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  if (e.target.closest('#btn-export')) return exportAll();
  if (e.target.closest('#btn-fb')) {
    const msg = $('#fb-msg'), text = $('#fb-text').value, lg = $('#fb-league').value; if (!text.trim()) { msg.textContent = 'Paste the table first.'; return; }
    msg.textContent = 'Saving…';
    try {
      const r = await post(`/api/forebet?league=${encodeURIComponent(lg)}&date=${S.date}`, { text }); if (r.error) throw new Error(r.error);
      msg.textContent = `Saved ${r.saved}. ${r.alreadyHad ? r.alreadyHad + ' already had a pick. ' : ''}${r.started ? r.started + ' already started (skipped). ' : ''}${r.notFound.length ? "Couldn't match: " + r.notFound.join(', ') + '.' : ''}`;
      if (r.saved) { delete counts[S.date]; tally = null; await loadDay(); }
    } catch (er) { msg.textContent = er.message; }
    return;
  }
  const sv = e.target.closest('[data-save]');
  if (sv) {
    const id = sv.dataset.save, c = day.cards.find(x => x.id === id); if (!c) return;
    const note = document.getElementById('note-' + id).value, mine = document.getElementById('mine-' + id).value;
    sv.disabled = true;
    try { const r = await post(`/api/note?league=${c.league}&date=${S.date}`, { id, note, mine }); if (r.error) throw new Error(r.error); c.note = r.note || undefined; c.mine = r.mine || undefined; delete counts[S.date]; tally = null; say('Note saved.', true); render(); }
    catch (er) { say(er.message); sv.disabled = false; }
    return;
  }
  const t = e.target.closest('[data-date],[data-tab],[data-league],[data-top],.hd'); if (!t) return;
  if (t.dataset.date) { S.tab = 'board'; saveView(); return loadDay(t.dataset.date); }
  if (t.dataset.tab) { S.tab = t.dataset.tab; S.open = null; saveView();
    if (S.tab === 'status') { stat = null; render(); try { stat = await api('/api/status'); } catch (er) { say(er.message); } } else if (S.tab !== 'board') { render(); await ensureTally(); } return render(); }
  if (t.dataset.league) { S.league = t.dataset.league; S.top = false; S.open = null; saveView(); return render(); }
  if (t.dataset.top) { S.top = !S.top; if (S.top) S.league = 'all'; S.open = null; return render(); }
  if (t.classList.contains('hd')) { S.open = S.open === t.dataset.id ? null : t.dataset.id; return render(); }
});
$('#btn-analyze').onclick = () => {
  if (day.cards.some(c => c.v2) && !confirm('This redoes every game for this day, including ones that already have a prediction, and uses up more of your free daily saves.\n\nTo fill in only the missing games, use Analyze leftover games instead.\n\nRedo the whole day?')) return;
  runAll('analyze');
};
$('#btn-left').onclick = () => runAll('leftover');
$('#btn-grade').onclick = () => runAll('grade');

(async () => {
  cfg = await api('/api/config'); S.date = cfg.today; await loadDay();
  if (S.tab === 'results' || S.tab === 'compare') { await ensureTally(); render(); }
  try { stat = await api('/api/status'); if (!document.activeElement || document.activeElement.tagName !== 'TEXTAREA') render(); } catch (e) { /* alerts are optional */ }
})();
</script>
</body>
</html>
