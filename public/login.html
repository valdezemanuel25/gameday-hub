<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0B1210">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Sign in · Game Day Hub</title>
<style>
:root{--bg:#0B1210;--panel:#121C18;--line:#22332C;--ink:#E8EEE4;--dim:#8FA399;--grass:#58B27A;--miss:#E07A5F}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{width:100%;max-width:340px}
img{display:block;width:72px;height:72px;border-radius:16px;margin:0 auto 18px}
h1{font-size:20px;font-weight:700;text-align:center}
p{color:var(--dim);font-size:13.5px;text-align:center;margin:4px 0 18px}
input,button{width:100%;font:inherit;border-radius:12px;padding:13px 14px}
input{background:var(--panel);border:1px solid var(--line);color:var(--ink)}
input:focus{outline:2px solid var(--grass);outline-offset:1px}
button{margin-top:10px;border:0;background:var(--grass);color:#0B1210;font-weight:700;cursor:pointer}
.e{margin-top:10px;color:var(--miss);font-size:13.5px;text-align:center}
</style>
</head>
<body>
<main>
  <img src="/icon-192.png" alt="">
  <h1>Game Day Hub</h1>
  <p>Enter your password. This device stays signed in for a year.</p>
  <form method="post" action="/login">
    <input type="hidden" name="next" id="next" value="/">
    <input type="password" name="password" placeholder="Password" autocomplete="current-password" autofocus required>
    <button type="submit">Sign in</button>
    <div class="e" id="e" hidden>That password didn't work. Try again.</div>
  </form>
</main>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  if (q.get('e')) document.getElementById('e').hidden = false;
  var n = q.get('next'); if (n && n.charAt(0) === '/' && n.charAt(1) !== '/') document.getElementById('next').value = n;
})();
</script>
</body>
</html>
