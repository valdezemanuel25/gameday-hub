name = "gameday-hub"
main = "src/worker.js"
compatibility_date = "2026-09-01"

[assets]
directory = "./public"
binding = "ASSETS"
# The Worker sees every request first so it can ask for the password before serving the page
run_worker_first = true

# Storage: the KV namespace "HUB" (already created in your Cloudflare account).
[[kv_namespaces]]
binding = "HUB"
id = "3afff88abc944771a4c7bfdd78f05a36"

# Password-guessing limits, counted per visitor address (needs wrangler 4.36 or later). The namespace ids are numbers you pick;
# they only need to be different from each other within this Cloudflare account.
[[ratelimits]]
name = "LOGIN_LIMIT"      # tries on the sign-in page: 5 a minute
namespace_id = "1001"

  [ratelimits.simple]
  limit = 5
  period = 60

[[ratelimits]]
name = "API_LIMIT"        # requests that carry the password in a header (scripts): 60 a minute
namespace_id = "1002"

  [ratelimits.simple]
  limit = 60
  period = 60

# Every 5 minutes the Worker does ONE small job for ONE league, rotating:
#   sync results -> grade (a league is graded GAME_HOURS + GRADE_DELAY_HOURS after its last kickoff) -> analyze.
[triggers]
crons = ["*/5 * * * *"]

[vars]
GAME_HOURS = "2"          # assumed length of a game
GRADE_DELAY_HOURS = "3"   # wait this long after a league's games finish before grading it
BOOKS = "draftkings"      # books the Analyst may take a price from (src/btts.js BOOKS lists the US books); DraftKings only = no shopping
